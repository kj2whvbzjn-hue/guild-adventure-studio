only; ACTION terminal; extension not runtime node; battle post-reservation unchanged.\nP0: ACTION contract, Layout persistence, single resolver, Game save migration, Game tag catalog, minimum AI master, shared core strategy.","decision_refs":["DEC-V9-AI-001","DEC-V9-AI-002","DEC-V9-AI-003","DEC-V9-AI-004","DEC-V9-AI-005","DEC-V9-AI-006"],"depends_on":["SPEC-V9-AI-SRC-20260811-ROADMAP"],"acceptance_criteria":"8/16依存仕様を後発AI接続基準として参照できる。","approved_by":"Post-V9 source","approved_at":"2026-08-19T10:29:00+09:00","created_at":"2026-08-19T10:29:00+09:00","updated_at":"2026-08-19T10:29:00+09:00"},{"id":"SPEC-V9-AI-SRC-20260816-FORMALUI","title":"[POST-V9][AI][APPROVED SOURCE] AIチップUI 正式仕様 2方向分岐版","status":"Approved","summary":"正式AI盤面UI。TRUE/FALSE 2方向固定、ACTION終端、自動接続、extension UI専用、Validator赤黄緑、Preset=Formal Program+Layout、既存Battle接続境界を定義。","body":"file: AIチップUI_正式仕様_2方向分岐版_2026-08-16(7).zip\nsha256: b04d633be4049ecfe7c2da87f4d0d6afe5ddf45378783133b3ba8a829a91c669\ndate: 2026-08-16\nboard: provisional 8x8 (future-variable); touch-first UI; one output=one target; one input=one source.\nbattle boundary: AI returns action+target; reservation/re-evaluation/skill runtime/combat calculation unchanged.","decision_refs":["DEC-V9-AI-001","DEC-V9-AI-002","DEC-V9-AI-003","DEC-V9-AI-004","DEC-V9-AI-005"],"depends_on":["SPEC-V9-AI-SRC-20260816-DEPENDENCY"],"acceptance_criteria":"2方向正式UIの構造とBattle非変更境界を保持する。","approved_by":"Post-V9 formal UI specification","approved_at":"2026-08-19T10:29:00+09:00","created_at":"2026-08-19T10:29:00+09:00","updated_at":"2026-08-19T10:29:00+09:00"},{"id":"SPEC-V9-AI-SRC-20260816-PLAN","title":"[POST-V9][AI][PLAN] AIチップUI 実装計画 2方向分岐版","status":"Review","summary":"Phase0-9の実装・テスト計画。実装完了証拠ではない。Formal AI契約→Board UI→Tag編集→Resolver→Validator→Save/Preset→Battle bridge→回帰。","body":"file: AIチップUI_実装計画_2方向分岐版_2026-08-16(7).zip\nsha256: 20f9bd5dff7782387f82aa5fe1d481ee9a2528386a11fc8a7e098825f3876c39\nrole: implementation plan, not completion evidence.","decision_refs":["DEC-V9-AI-001","DEC-V9-AI-002","DEC-V9-AI-005"],"depends_on":["SPEC-V9-AI-SRC-20260816-FORMALUI"],"acceptance_criteria":"Planとimplementation completeを混同しない。","approved_by":"","approved_at":"","created_at":"2026-08-19T10:29:00+09:00","updated_at":"2026-08-19T10:29:00+09:00"},{"id":"SPEC-V9-AI-SRC-20260816-PREIMPL","title":"[POST-V9][AI][PREIMPLEMENTATION] AIチップUI 実装前残タスク仕様","status":"Approved","summary":"ACTION終端契約、AI Layout v1、Connection Resolver、Save v2 Migration、Game Tag/Skill供給、実装開始Gate。当時UI実装開始可だがACTION code pending、Tag/Skill data empty。","body":"file: AIチップUI_実装前残タスク仕様_2026-08-16(7).zip\nsha256: b34dd2d887d98cb08207e49234d72bda67df6fa663f30035bcb8ba7967f4539b\nhistorical_gate: ready_to_start_ui_implementation=true; action_terminal=SPEC_READY_CODE_CHANGE_PENDING; tag_skill_supply=SPEC_READY_DATA_EMPTY.\nImportant: current B665/B486.211 implementation status is not proven by this package.","decision_refs":["DEC-V9-AI-002","DEC-V9-AI-003","DEC-V9-AI-004","DEC-V9-AI-007"],"depends_on":["SPEC-V9-AI-SRC-20260816-FORMALUI","SPEC-V9-AI-SRC-20260816-DEPENDENCY"],"acceptance_criteria":"8/16 preimplementation stateを履歴として保持し、現行実装済みに誤昇格しない。","approved_by":"Post-V9 preimplementation specification","approved_at":"2026-08-19T10:29:00+09:00","created_at":"2026-08-19T10:29:00+09:00","updated_at":"2026-08-19T10:29:00+09:00"},{"id":"SPEC-V9-AI-INTEGRATED-001","title":"[BATTLE/AI][INTEGRATION CANDIDATE] Formal AI制作・AIチップUI 最新版候補","status":"Review","summary":"8/11資産/ロードマップを履歴、8/16 2方向Formal AI UI/依存仕様を後発基準として統合。AI判断と既存Battle実行責務を分離し、AI SaveもLegacy zeroとする。","body":"【1. 正式AI経路】\nBoard/Layout\n→ Connection Resolver\n→ Formal AI Program\n→ Validator\n→ Compiler\n→ AI Runtime / Decision Engine\n→ action_id + target_id\n→ 既存Battle予約処理\n\n【2. AI node契約】\nCONDITION:\n- input 1\n- TRUE output 1\n- FALSE output 1\n- 2方向固定\n- 3方向/N方向禁止\n- 3条件以上はCONDITION連結\n\nTARGET/通常node:\n- input 1\n- output 1\n\nACTION:\n- input 1\n- output 0\n- ACTION到達でAI判断を確定\n- 後続Edge禁止\n\n【3. Program / Layout分離】\nFormal Program:\n- 実行ロジックの正本\n- nodes / edges / parameters / entry_node_id等\n\nLayout:\n- board size\n- chip placement\n- rotation\n- extension panels\n- visual routing\n\n8×8は初期暫定値で将来可変。\nSTARTをFormal nodeとして新設せず、UI開始マーカーからentry_node_idを設定する方針。\n\n【4. Connection Resolver】\nBoard表示接続とFormal Program Edge生成は同一Resolverのみを正本とする。\n- 出口→入口のみ\n- 1入口=1source\n- 1出口=1target\n- rotation/port方向を解決\n- extension straight/cornerを追跡し実node間Edgeへ畳む\n- 行き止まり/循環/複数候補分岐はERROR\n- ACTIONは出口0\n\n【5. Validator / 保存】\n保存:\nBoard\n→ Resolver\n→ Formal Program生成\n→ Validator\n→ 成功時のみ保存\n\n赤: 保存不可\n黄: 警告\n緑: 保存可能\n\n盤面だけ保存成功してProgramが壊れる状態を作らない。\n\n【6. Preset】\n公式Preset/自作Presetとも別AI言語を作らない。\nFormal Program + Layoutとして展開し通常編集可能にする。\n\n【7. Battle責務境界】\nAI側:\n- chip評価\n- TRUE/FALSE分岐\n- target選択\n- action選択\n- ACTION到達\n- action_id + target_idをBattleへ渡す\n\nBattle側を変更しない:\n- 行動予約\n- 一定時間ごとの再判定\n- 行動順獲得後の予約実行\n- 実行時行動可能判定\n- Skill Runtime\n- 戦闘計算\n\nAI側へSkill Runtime/戦闘計算を複製しない。\n\n【8. Game / Studio / shared】\nshared:\n- Formal Program Model\n- Master Adapter\n- Validator\n- Compiler\n- Trace\n- Decision Engine\n\nStudio:\n- Master/Program管理\n- Validation/Simulation/Export\n\nGame:\n- Board UI\n- Tag/parameter editing UI\n- Layout/Preset\n- Save bridge\n- Battle bridge\n\nGame固有BridgeのみがSave/Character binding/Battle snapshot/reserveAction接続を持つ。\n\n【9. Tag / Skill供給】\nGameはStudio localStorageを正式依存にしない。\nStudio canonical project JSON\n→ Export\n→ Game AI Catalog Loader\n→ parameter editor\n\nLoaderはtags/tag_categories/skills/AI Masterをdata_version整合付きで読む。\n正式データが空の場合は候補を捏造しない。\n\n【10. Build / Release】\n新規AI asset追加時:\n- script load order\n- Service Worker APP_SHELL\n- cache version\n- URL version\n- package_manifest\n- integrity manifest\n- package build\n- public entrypoint\nを同期する。\n\n【11. 8/16時点Implementation Gate】\n- minimum AI master: READY\n- ACTION terminal contract: SPEC_READY_CODE_CHANGE_PENDING\n- Layout v1: SPEC_READY\n- Connection Resolver: SPEC_READY\n- Save v2 migration: SPEC_READY\n- Tag/Skill supply: SPEC_READY_DATA_EMPTY\n- UI implementation start: true\n\nこれはGKS-B596/GA-B486.189以前の歴史的状態。\n現行GKS-B665/GA-B486.211の実装完了を意味しない。\n\n【12. AI Save Legacy zero】\nHuman判断により、8/16 Save v2 Migration資料の旧互換保持部分は最新版では不採用。\n- aiGraph / aiPolicy / defaultSkillIdを残さない\n- Formal AI未設定時に旧AI挙動へfallbackしない\n- 旧AI SaveをFormal AIへ自動意味変換しない\n- Formal AI用Save/Program/Layout/Presetのみを正式経路とする\n\n既存旧Saveの救済が必要な場合は、旧runtime fallbackではなく、明示的な一回限りMigration Tool/Import Procedureを別仕様として設計する。\n\n【13. 未統合】\n- 戦闘計算本体の後発確定仕様\n- 現行BuildのFormal AI source/implementation evidence\n","decision_refs":["DEC-V9-AI-001","DEC-V9-AI-002","DEC-V9-AI-003","DEC-V9-AI-004","DEC-V9-AI-005","DEC-V9-AI-006","DEC-V9-AI-007","DEC-V9-AI-008"],"depends_on":["SPEC-V9-0021","SPEC-V9-TAG-INTEGRATED-001","SPEC-V9-SKILL-INTEGRATED-001","SPEC-V9-AI-SRC-20260816-DEPENDENCY","SPEC-V9-AI-SRC-20260816-FORMALUI","SPEC-V9-AI-SRC-20260816-PREIMPL"],"acceptance_criteria":"8/11と8/16の時系列を保持する。\n2方向CONDITION/ACTION終端を後発Formal基準とする。\nProgram/Layout/Resolverの正本を分離する。\nAI判断とBattle実行責務を混同しない。\nAI SaveもLegacy zeroとし旧互換field/fallbackを残さない。\n現行Build実装済みをソースEvidenceなしに断定しない。","approved_by":"","approved_at":"","created_at":"2026-08-19T10:29:00+09:00","updated_at":"2026-08-19T10:32:00+09:00"}]}},{"summary":{"id":"DEV-PROJ-0004","name":"Project Status / Context + Lifecycle 初版実装","status":"Specifying","workflow_stage":"Planning","lifecycle_status":"Active","superseded_by":"","updated_at":"2026-08-18T22:23:23.621Z","attention_mode":"Auto","attention_reasons":["確認待ち/FAIL 23件","案件状態 Specifying","Workflow Planning"],"counts":{"discussions":0,"architecture_nodes":12,"work_boxes":14,"tasks":70,"open_tasks":63,"checks":23,"pending_or_failed_checks":23,"decisions":1,"specifications":1,"open_questions":0},"implementation_approval":"Pending","completion_approval":"Pending","open_questions":[]},"workspace":{"id":"DEV-PROJ-0004","name":"Project Status / Context + Lifecycle 初版実装","status":"Specifying","ai_attention":"Auto","updated_at":"2026- ONTEXT-001","status":"Pending","result":"","evidence":"","checked_by":"","checked_at":"","created_at":"2026-08-19T07:19:00+09:00","updated_at":"2026-08-19T07:19:00+09:00"},{"id":"CHK-0021","title":"iPhone実機で現在地UIを実用的に読める","gate":"Completion","target_type":"WorkBox","target_id":"BOX-0010","status":"Pending","result":"","evidence":"","checked_by":"","checked_at":"","created_at":"2026-08-19T07:19:00+09:00","updated_at":"2026-08-19T07:19:00+09:00"},{"id":"CHK-0022","title":"Game / Story / Quest / Event / Character / Flag / Master非干渉を確認","gate":"Completion","target_type":"Project","target_id":"DEV-STATUS-CONTEXT-001","status":"Pending","result":"","evidence":"","checked_by":"","checked_at":"","created_at":"2026-08-19T07:19:00+09:00","updated_at":"2026-08-19T07:19:00+09:00"},{"id":"CHK-0023","title":"Quick Test / SOURCE_UPDATE正式Accept GateのPASSを確認","gate":"Completion","target_type":"Project","target_id":"DEV-STATUS-CONTEXT-001","status":"Pending","result":"","evidence":"","checked_by":"","checked_at":"","created_at":"2026-08-19T07:19:00+09:00","updated_at":"2026-08-19T07:19:00+09:00"}],"current_state":{"project_context":{"purpose":"","summary":""},"current_focus":{"architecture_id":"","work_box_id":"","theme":"","goal":""},"project_rules":[],"source_baseline":{"studio_build":"","game_build":"","source_label":"","source_role":"current_baseline","recorded_at":""},"lifecycle":{"status":"Active","superseded_by":"","updated_at":"2026-08-18T22:23:23.621Z"},"latest_implementation_record":null},"review_targets":{"architecture_nodes":[],"work_boxes":[{"id":"BOX-0001","node_id":"ARCH-0001","title":"B662初版の目的・対象・対象外・完成条件を確定する","body":"【目的】\nDevelopment Projectを開いた時点で「この案件は何か」「今どの工程か」「今何に集中しているか」「現在有効なRuleは何か」「どのSource / Buildが基準か」「案件自体が稼働中か・停止中か・完了済みか」を一意に確認できるようにする。\n\n【今回の対象】\n- Project Context\n- Current Focus\n- Project Rules\n- Source Baseline\n- Project Lifecycle\n- Implementation Records\n- 案件の「現在地」UI\n- Human AttentionとLifecycleの連動\n- 旧Development Project JSON互換\n\n【今回の対象外】\n- AI自動実行\n- GitHubをDevelopment Projectの正本にすること\n- Game Projectとのデータ統合\n- Story / Quest / Event / Character / Flag / Masterとの接続\n- 高度なRole / 複数Approver\n- Build適用処理からDevelopment Projectへ自動書込する密結合\n- 高度なDashboard / Chart\n\n【初版完成条件】\n1. Projectの目的が分かる\n2. Workflow Stageが分かる\n3. Lifecycleが分かる\n4. Current Focusが分かる\n5. Active Project Rulesが分かる\n6. Source Baselineが分かる\n7. 実装BuildとWork Box / Taskの関係を記録できる\n8. Human AttentionがLifecycleを考慮する\n9. 旧JSONを壊さず読める\n10. iPhoneで現在地を実用的に読める","created_at":"2026-08-19T07:19:00+09:00","updated_at":"2026-08-19T07:19:00+09:00"},{"id":"BOX-0002","node_id":"ARCH-0007","title":"WorkflowとLifecycleを別概念として正式化する","body":"【問題】\n現行は workspace.status と workflow.stage に作業工程と案件寿命が混在している。Archived相当もCompletedへ寄るため「実装工程」と「案件の位置付け」を区別できない。\n\n【B662方針】\nWorkflow = Discovery / Planning / Implementing / Verifying / Completed\nLifecycle = Active / Paused / Completed / Superseded / Archived\n\n例:\n- Active + Planning = 有効な案件で実装準備中\n- Paused + Implementing = 実装途中だが一時停止\n- Superseded + Planning = 検討途中だったが別案件へ置換\n\n【Human操作】\n- 一時停止 / 再開\n- Completion Gate承認時にLifecycle Completed\n- 別案件へ置換時は superseded_by を必須\n- 保管でArchived\n\n【重要】\n旧案件をAIやNormalize処理が推測だけでCompleted / Archivedへ変更しない。","created_at":"2026-08-19T07:19:00+09:00","updated_at":"2026-08-19T07:19:00+09:00"},{"id":"BOX-0004","node_id":"ARCH-0003","title":"Project Contextの初版データを実装する","body":"【役割】\n「このProjectは何をする案件か」を現在状態として示す。\n\n【初版】\n- purpose: 案件の目的\n- summary: 現在の短い説明\n- name: 既存workspace.nameを利用\n- stage: workflow.stageを利用し重複保持しない\n\n【UI】\n案件を開いた最初の「現在地」に表示し、必要時だけ編集する。","created_at":"2026-08-19T07:19:00+09:00","updated_at":"2026-08-19T07:19:00+09:00"},{"id":"BOX-0005","node_id":"ARCH-0004","title":"Current Focusを1 Project 1件で実装する","body":"【役割】\n「今、このProjectの何を検討・実装しているか」を示す。\n\n【初版候補】\n- architecture_id\n- work_box_id\n- theme\n- goal\n\n【操作】\nArchitecture Node / Work Box詳細から「現在のFocusに設定」できるようにする。ID手入力を主操作にしない。\n\n【整合性】\n参照先削除・不在を検出し、不正参照を表示または解除できること。案件切替時にFocusが混ざらないこと。","created_at":"2026-08-19T07:19:00+09:00","updated_at":"2026-08-19T07:19:00+09:00"},{"id":"BOX-0006","node_id":"ARCH-0005","title":"Project Rulesを現在有効なルールとして管理する","body":"【役割】\nDiscussion本文を読み返さなくても、Human / AIが現在守るべき案件固有ルールを確認できるようにする。\n\n【初版候補】\n- id\n- text\n- status: Active / Inactive\n- source_type\n- source_id\n\n【初版対象外】\nDecisionからRuleを完全自動生成しない。Humanが内容を確認して登録・有効化する。\n\n【必須境界例】\n- Game ProjectとDevelopment Workspaceを混在させない\n- AIはHuman Approvalを勝手に確定しない\n- Game / Story系は設計参考のみ。システム・処理・データモデル・UI部品を流用しない\n- Studio共通の戻る / 閉じる等の共通基盤は利用可","created_at":"2026-08-19T07:19:00+09:00","updated_at":"2026-08-19T07:19:00+09:00"},{"id":"BOX-0007","node_id":"ARCH-0006","title":"Source Baselineを現在の実装基準として管理する","body":"【役割】\nどのSource / Buildを現在の実装基準にするかを案件内で明示する。\n\n【B662実装開始前Baseline】\n- Studio Build: GKS-B661\n- Game Build: GA-B486.211\n- source_label: Humanが実装時の最新版Source ZIPを登録\n\n【初版候補】\n- studio_build\n- game_build\n- source_label\n- source_role: current_baseline\n- recorded_at\n\n【重要】\nBuild表示だけでなく、実装開始時にHumanが現在Baselineとして確認できること。GitHub同期をこの機能へ密結合しない。","created_at":"2026-08-19T07:19:00+09:00","updated_at":"2026-08-19T07:19:00+09:00"},{"id":"BOX-0008","node_id":"ARCH-0007","title":"Lifecycle状態とHuman操作を実装する","body":"【Lifecycle】\nActive / Paused / Completed / Superseded / Archived\n\n【操作原則】\n- Active → Paused: Humanが一時停止\n- Paused → Active: Humanが再開\n- Completion Gate Human承認 → Completed\n- Superseded: 後継Project ID必須\n- Archived: 保管操作\n\n【禁止】\nAIや自動移行が、根拠なくCompleted / Superseded / Archivedを確定しない。\n\n【表示】\nProject一覧と案件の現在地でWorkflowとは別にLifecycleを表示する。","created_at":"2026-08-19T07:19:00+09:00","updated_at":"2026-08-19T07:19:00+09:00"},{"id":"BOX-0009","node_id":"ARCH-0008","title":"Implementation RecordsでBuildとWork Box / Taskを結び付ける","body":"【目的】\nSource Updateが実際に適用されたのにDevelopment Project側のTaskがTodoのまま残るズレを減らす。\n\n【初版候補】\n- id\n- studio_build\n- game_build\n- work_box_ids[]\n- task_ids[]\n- result: Applied / Reverted / Partial 等の最小集合を実装時に確定\n- evidence\n- recorded_at\n\n【初版操作】\n「実装記録を追加」で現在Studio Build / Game Build / Current Focus Work Box / 関連Taskを候補入力し、Humanが確認して保存する。\n\n【境界】\nStudio Update適用処理からDevelopmentへ自動書込する密結合はB662初版では行わない。","created_at":"2026-08-19T07:19:00+09:00","updated_at":"2026-08-19T07:19:00+09:00"},{"id":"BOX-0010","node_id":"ARCH-0009","title":"案件を開いた最初に「現在地」を表示する","body":"【目的】\nArchitecture一覧より先に、案件の現在状態をHumanが理解できるようにする。\n\n【初版表示】\n- Project名\n- Lifecycle\n- Workflow Stage\n- Purpose / Summary\n- Current Focus\n- Source Baseline\n- Active Rules\n- 最新Implementation Record\n- Pending / Failed Confirmation / Human Gate\n\n【UI原則】\n- B655以降で確立した階層遷移UI原則を維持\n- 一覧と詳細を同時に大量表示しない\n- 閲覧を主役にし、編集フォームは必要時だけ\n- iPhoneで一画面ずつ読めることを優先\n- 高度なDashboard / Chartは作らない","created_at":"2026-08-19T07:19:00+09:00","updated_at":"2026-08-19T07:19:00+09:00"},{"id":"BOX-0011","node_id":"ARCH-0010","title":"Human AttentionをLifecycle対応にする","body":"【目的】\nHumanが意図的に停止・完了・置換・保管した案件を「未確定」として毎回出さない。\n\n【ai_attention】\nInclude = Lifecycleに関係なくHuman確認対象\nExclude = 常に対象外\nAuto = LifecycleとWorkflow / Confirmation等から判定\n\n【Auto案】\n- Active → Workflow / Pending・Failed Confirmation / Gate等から判定\n- Paused → 対象外\n- Completed → 対象外\n- Superseded → 対象外\n- Archived → 対象外\n\n【重要】\nB658以降のDevelopment専用Human Attentionロジックを更新し、Game / Story側へ接続しない。","created_at":"2026-08-19T07:19:00+09:00","updated_at":"2026-08-19T07:19:00+09:00"},{"id":"BOX-0012","node_id":"ARCH-0011","title":"Development専用モジュールとして分離実装する","body":"【配置案】\nstudio/development-project-context/\n- development-project-context.js\n- development-project-context.css\n\n【禁止】\n- Story / Quest / Event / Character / Flag / Masterの処理・データモデル・UI部品を流用しない\n- Game Project JSONへDevelopment状態を混在させない\n- Game Runtimeへ接続しない\n\n【許可】\nStudio Shell共通の戻る / 閉じる / 基本ナビ等は利用可。\n既存Development WorkspaceのHost API / canonical save / project registryとはDevelopment側の正式境界として接続する。","created_at":"2026-08-19T07:19:00+09:00","updated_at":"2026-08-19T07:19:00+09:00"}],"tasks":[],"discussions":[],"decisions":[{"id":"DEC-STATUS-0001","title":"WorkflowとProject Lifecycleを分離する","status":"Proposed","text":"Development Projectの作業工程はworkflow.stage、案件自体の位置付け・寿命はlifecycleとして別管理する。Lifecycle初版はActive / Paused / Completed / Superseded / Archivedとし、Completion GateのHuman承認をLifecycle CompletedのHuman判断として扱う。","rationale":"現行workspace.statusとworkflow.stageには工程と案件寿命が混在し、実装済み・停止・置換・保管を正確に表現できないため。Human Attentionや案件一覧の精度を上げ、Studio内データと実際の開発状態のズレを減らす。","source_discussion_ids":[],"approved_by":"","approved_at":"","created_at":"2026-08-19T07:19:00+09:00","updated_at":"2026-08-19T07:19:00+09:00"}],"specifications":[{"id":"SPEC-STATUS-0001","title":"Project Status / Context + Lifecycle 初版仕様","status":"Review","summary":"Development Projectに現在地、Lifecycle、実装履歴を追加し、Workflowと案件寿命を分離するB662初版計画。","body":"Project Contextとしてpurpose / summaryを保持する。Current Focusは1 Project 1件としarchitecture_id / work_box_id / theme / goalを持つ。Project RulesはActive / Inactiveとsource参照を持つ。Source Baselineはstudio_build / game_build / source_label / source_role / recorded_atを持つ。LifecycleはActive / Paused / Completed / Superseded / ArchivedとしWorkflowから分離する。Supersededは後継Project IDを必須とする。Completion GateのHuman承認時にLifecycle Completedへ連動する。Implementation RecordsはBuildとwork_box_ids / task_ids / result / evidence / recorded_atを保持し、初版ではHuman確認保存とする。案件を開いた最初の画面にPurpose / Lifecycle / Workflow / Current Focus / Baseline / Active Rules / 最新実装 / Human確認を表示する。Human Attention Auto判定ではActive案件のみ通常判定し、Paused / Completed / Superseded / Archivedを対象外とする。Development Project schema 1.2へ拡張するが、schema 1.1をNormalize互換で読み込み、既存Discussion / Decision / Specification / Architecture / Work Box / Task / ConfirmationとImport / Exportを保持する。実装はDevelopment専用moduleとし、Game / Story系の処理・データモデル・UI部品は流用しない。","decision_refs":["DEC-STATUS-0001"],"depends_on":[],"acceptance_criteria":"旧schema 1.1案件を壊さず読める。\nProject Contextを保存・再読込できる。\nCurrent Focus / Project Rules / Source Baselineが案件ごとに独立する。\nLifecycleとWorkflowを独立して表示・遷移できる。\nCompleted / Superseded / Archivedを区別できる。\nBuildとWork Box / TaskをImplementation Recordとして記録できる。\nHuman AttentionがLifecycleを正しく扱う。\n全案件JSON・個別案件JSONで新情報を往復保持できる。\niPhone実機で案件の現在地を読める。\nGame / Story系へ干渉しない。\nQuick Test / SOURCE_UPDATE正式Accept GateがPASSする。","approved_by":"","approved_at":"","created_at":"2026-08-19T07:19:00+09:00","updated_at":"2026-08-19T07:19:00+09:00"}]}},{"summary":{"id":"DEV-STATUS-CONTEXT-001","name":"Project Status / Context管理 初版実装","status":"Specifying","workflow_stage":"Planning","lifecycle_status":"Active","superseded_by":"","updated_at":"2026-08-18T10:05:36.765Z","attention_mode":"Auto","attention_reasons":["確認待ち/FAIL 12件","案件状態 Specifying","Workflow Planning"],"counts":{"discussions":0,"architecture_nodes":9,"work_boxes":10,"tasks":29,"open_tasks":22,"checks":12,"pending_or_failed_checks":12,"decisions":0,"specifications":0,"open_questions":0},"implementation_approval":"Pending","completion_approval":"Pending","open_questions":[]},"workspace":{"id":"DEV-STATUS-CONTEXT-001","name":"Project Status / Context管理 初版実装","status":"Specifying","updated_at":"2026-08-18T10:05:36.765Z","ai_attention":"Auto"},"workflow":{"stage":"Planning","implementation_approval":{"status":"Pending","by":"","at":""},"completion_approval":{"status":"Pending","by":"","at":""}},"pending_checks":[{"id":"CHK-0001","title":"初版の目的・対象・対象外をHuman確認","gate":"Implementation","target_type":"WorkBox","target_id":"BOX-0001","status":"Pending","result":"","evidence":"","checked_by":"","checked_at":"","created_at":"2026-08-18T19:00:00+09:00","updated_at":"2026-08-18T19:00:00+09:00"},{"id":"CHK-0002","title":"Source BaselineをGKS-B655 / GA-B486.211としてHuman確認","gate":"Implementation","target_type":"WorkBox","target_id":"BOX-0002","status":"Pending","result":"","evidence":"","checked_by":"","checked_at":"","created_at":"2026-08-18T19:00:00+09:00","updated_at":"2026-08-18T19:00:00+09:00"},{"id":"CHK-0003","title":"既存複数案件・Development JSON互換を維持する方針を確認","gate":"Implementation","target_type":"Project","target_id":"DEV-STATUS-CONTEXT-001","status":"Pending","result":"","evidence":"","checked_by":"","checked_at":" nではない。","created_at":"2026-08-18T19:00:00+09:00","updated_at":"2026-08-18T19:00:00+09:00"},{"id":"BOX-0002","node_id":"ARCH-0002","title":"B655の現状と保存境界を調査する","body":"【現在Baseline】\nStudio: GKS-B655\nGame: GA-B486.211\n\n【確認済みの現行Development機能】\n- 複数Development Project\n- ProjectごとのlocalStorage作業コピー\n- Development Workspace JSON追加 / 置換 / 出力\n- Discussion / Decision / Specification\n- 独立Architecture / Work Box / Task\n- Confirmation Records\n- Implementation / Completion Human Gate\n- 階層遷移型UI\n\n【実装時に確認すること】\n- Project Status / Context情報をどの既存Project JSONへ追加するのが最小か\n- B655のnormalize処理とImport / Export互換\n- 既存案件に新項目がなくても自動補完できること\n- 複数案件間でCurrent Focus等が混ざらないこと\n\n【禁止】\nGame Project JSONへDevelopment情報を混在させない。","created_at":"2026-08-18T19:00:00+09:00","updated_at":"2026-08-18T19:00:00+09:00"},{"id":"BOX-0007","node_id":"ARCH-0007","title":"AI Handover Context生成の初版を決める","body":"【目的】\nHumanが毎回引継ぎ文章を書かなくても、Studioの現在データから次AI向けContextを生成する。\n\n【初版出力候補】\n- Project Context\n- Workflow Stage\n- Current Focus\n- Active Project Rules\n- Source Baseline\n- Approved Decisions\n- Approved Specifications\n- Current Architecture / Work Box\n- Open Discussion / 未決事項\n- Pending / Failed Confirmation\n\n【重要】\n初版ではSource一式そのものをHandoverへ自動包含しない。\nSource Baselineを明示し、実装時には別途Source一式を渡せる前提とする。\n\n【出力形式候補】\nまずJSON + Human/AIが読めるMarkdownのどちらが最小かを実装時に判断する。","created_at":"2026-08-18T19:00:00+09:00","updated_at":"2026-08-18T19:00:00+09:00"},{"id":"BOX-0008","node_id":"ARCH-0008","title":"案件の「概要 / 現在地」UIを実装する","body":"【目的】\n案件を開いた直後に「この案件は何か」「今どこか」をHumanが確認できる。\n\n【表示候補】\n- Project名\n- Project目的\n- Workflow Stage\n- Current Focus\n- Source Baseline\n- Active Rules\n- Approved Decision / Specification件数\n- Pending / Failed Confirmation\n- AI Handover生成\n\n【UI原則】\n- B655で採用した階層遷移UIを維持\n- 一覧と詳細を同時に大量表示しない\n- 閲覧を主役にし、編集フォームは必要時だけ表示\n- iPhoneで読めることを優先\n\n【対象外】\n高度なDashboard / Chartは作らない。","created_at":"2026-08-18T19:00:00+09:00","updated_at":"2026-08-18T19:00:00+09:00"}],"tasks":[],"discussions":[],"decisions":[],"specifications":[]}}]}</script>
