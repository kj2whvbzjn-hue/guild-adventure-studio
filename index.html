perseded","summary":"V9 MOD接続の基礎値・Pipeline接続・Rules/Balance分離を整理した初期確定資料。後続v0.4により履歴化。","body":"【Source Package】\nfile: MOD接続仕様_検討確定版_v0.1(3).zip\nsha256: a56ec66a32ec06fa0aae7c438a1502aca5e72a1e86bfa7b9a78dd3dc217519ea\nrole: post-V9 source\n\n===== SOURCE: 00_MOD接続仕様_検討確定版_v0.1.md =====\n\n# MOD接続仕様 検討確定版 v0.1\n\n## 1. 位置付け\n本書はEquipment Generation Pipelineそのものではなく、生成された装備およびBattle RuntimeへMODを接続するための基本仕様をまとめる。\n\n現段階ではMODの具体的な数値バランスを確定しない。\n数値・係数・Tier値・警告閾値はシステム調整までの仮値とし、後から変更可能にする。\n\n## 2. 最上位原則\n\n**MODは原則として、そのMODが対象とする「基礎値」に対して適用する。**\n\n```text\nMOD\n↓\ntargetを特定\n↓\ntargetの基礎値を取得\n↓\ntargetに定義された適用方式でMODを適用\n↓\n補正後の値を次工程へ渡す\n```\n\nMODが何を変更するかは `target` で決定する。\nMODごとにBattle Runtime全体を独自再計算しない。\n\n## 3. MODカテゴリ\n\n既存V9 MOD仕様を正本として、少なくとも以下のカテゴリを前提とする。\n\n- DAMAGE\n- CRITICAL\n- DEFENSE\n\n既存MOD体系そのものをEquipment側で再設計しない。\nEquipment Pipelineでは接続境界を定義する。\n\n## 4. target接続方針\n\n代表的な接続先:\n\n| MOD target | 基礎値 / 接続先 |\n|---|---|\n| ACCURACY | 装備由来の基礎 `accuracy` |\n| EVASION | 装備由来の基礎 `evasion` |\n| CRITICAL_RATE | 武器由来 `base_critical_rate` |\n| CRITICAL_DAMAGE | Critical Pipelineの基礎クリティカル倍率 |\n| PHYSICAL_DAMAGE | Damage Pipelineの物理基礎ダメージ |\n| MAGIC_DAMAGE | Damage Pipelineの魔法基礎ダメージ |\n| FIRE_DAMAGE等 | Damage Pipelineの対応属性基礎ダメージ |\n| ELEMENT_RESIST | Defense Pipelineの対応属性基礎耐性 |\n| STATUS_RESIST | Defense Pipelineの基礎状態異常耐性 |\n| SURVIVAL | 対象となる生存系基礎値。詳細targetは該当正本との照合対象 |\n\n※ `SURVIVAL` の具体的な対象値は、現時点の検討だけで推論固定しない。\n\n## 5. Equipment性能MOD\n\nEquipment側ですでに確定している性能値については以下を基本式とする。\n\n```text\nFinal\n= Base\n+ (Base × Percent MOD合計)\n+ Flat MOD合計\n```\n\n例:\n\n```text\nBase attack = 100\nPercent MOD = +10%\nFlat MOD = +5\n\nFinal attack = 115\n```\n\n対象候補:\n- attack\n- accuracy\n- magic_weapon_bonus\n- hp_bonus\n- mp_bonus\n- evasion\n\nBaseItem保存値そのものはMODで上書きしない。\n\n```text\nBaseItem\n↓\nEquipment Contribution\n↓\nMOD Resolver\n↓\nModified Contribution\n↓\nRuntime\n```\n\n## 6. Critical接続\n\n武器の正式基礎値:\n\n```text\nbase_critical_rate = 0.05\n```\n\n基礎Critical 5%はBattle共通初期値ではなく、武器側からEquipment Contribution経由でBattleへ持ち込む。\n\nCRITICAL_RATE MODはこの基礎Critical Rateをtargetとする。\n\nただし「+10%」等の表記を、\n- 相対10%増加\n- 10 percentage points加算\n\nのどちらとして扱うかは、この段階では推論固定しない。\ntarget側の正式適用方式として別途確定する。\n\nCRITICAL_DAMAGEも同様にCritical Pipelineの基礎値へ接続する。\n\n## 7. Damage接続\n\nDAMAGE MODは武器 `attack` を直接書き換えるものとは限らない。\n\n例:\n\n```text\nPHYSICAL_DAMAGE\n→ Damage Pipelineで定義される物理基礎ダメージへ適用\n\nMAGIC_DAMAGE\n→ 魔法基礎ダメージへ適用\n\n属性DAMAGE\n→ 対応属性の基礎ダメージへ適用\n```\n\nEquipment性能MODとDamage MODを同一targetとして混同しない。\n\n## 8. Defense接続\n\nDEFENSE MODも対象となるDefense Pipelineの基礎値へ適用する。\n\n例:\n- EVASION → 基礎evasion\n- ELEMENT_RESIST → 対応属性の基礎耐性\n- STATUS_RESIST → 基礎状態異常耐性\n\n耐性貫通など、相手側の値や計算途中へ作用するものは「特殊target / 適用段階」として扱い、単純な基礎値強化と混同しない。\n\n## 9. RulesとBalanceの分離\n\nMODの以下は**システム仕様**として固定する。\n\n- MOD ID\n- category\n- target\n- application_type\n- 適用順序\n- 接続Pipeline\n- 重複可否等の構造ルール\n- balance_key\n\n一方、以下は**Balance Config**へ分離する。\n\n- Tierごとの具体値\n- %\n- Flat値\n- 係数\n- 上限 / 下限\n- Clamp値\n- Warning閾値\n- 異常値判定レンジ\n- その他バランス調整対象値\n\n## 10. MOD Definition / Balance Config\n\n推奨構造:\n\n```text\nMOD Definition\n├─ id\n├─ category\n├─ target\n├─ application_type\n├─ pipeline\n└─ balance_key\n       ↓\nMOD Balance Config\n├─ Tier1 value\n├─ Tier2 value\n├─ Tier3 value\n├─ Tier4 value\n├─ Tier5 value\n├─ clamp\n└─ validation thresholds\n```\n\nコード内にTier値や調整用数値を固定しない。\n\n## 11. Balance Config更新\n\nBalance Configを変更しても、\n- MOD Definition\n- Generator構造\n- Battle Runtime構造\n- 保存Schema\n\nを変更せず調整できることを目標とする。\n\n既存アイテムの数値をConfig更新時に自動上書きするかどうかは、Item Generation / 保存方式の確定時に決める。\n現段階では自動上書きを前提にしない。\n\n## 12. Validator\n\nValidatorの数値警告基準もConfig化する。\n\n```text\nStructural Validation\n→ 仕様違反ならError\n\nBalance Validation\n→ 調整レンジ逸脱なら原則Warning\n```\n\n例:\n- target不存在 → Error\n- application_type不正 → Error\n- Balance Config不存在 → Error\n- 想定レンジ超過 → Warning\n- Clamp到達 → Warning候補\n\n「数値が高すぎる」の基準をコード固定しない。\n後のバランス調整で正式値が変わればConfigだけ変更する。\n\n## 13. 現段階で固定しない事項\n\n以下は今後の接続詳細で確定する。\n\n1. CRITICAL_RATEの%が相対倍率かpercentage point加算か\n2. CRITICAL_DAMAGEの正式適用方式\n3. ELEMENT_RESISTの正式適用方式\n4. STATUS_RESISTの正式適用方式\n5. SURVIVALの正式target\n6. 貫通系MODの適用段階\n7. MOD間の厳密な演算順序\n8. 各Tierの具体値\n9. Clamp / Capの具体値\n\nこれらの**数値**はすべて調整可能にする。\n意味・target・演算方式を確定する場合も、具体的係数とは分離する。\n\n## 14. Equipment Pipelineとの境界\n\n```text\nBaseItem Generation\n↓\nBaseItem\n↓\nItem Generation\n  ├─ Rarity\n  ├─ MOD slot\n  ├─ MOD selection\n  └─ MOD Tier\n↓\nCompleted Equipment\n↓\nEquipment Contribution\n↓\nMOD Resolver\n  ├─ Equipment target\n  ├─ DAMAGE target\n  ├─ CRITICAL target\n  └─ DEFENSE target\n↓\n各Runtime Pipeline\n```\n\nBaseItem GenerationとMOD付与は別工程。\nMODはBaseItemの生成式そのものへ混入させない。\n\n## 15. 今回の確定事項まとめ\n\n- MODは原則、対象targetの基礎値に適用する。\n- targetごとに正式な接続先を持つ。\n- Equipment性能MODは `Base + Base×Percent合計 + Flat合計`。\n- BaseItem保存値をMODで上書きしない。\n- Damage / Critical / Defense MODはそれぞれ該当Runtime Pipelineへ接続する。\n- MODの意味・target・適用方式と、具体的バランス数値を分離する。\n- Tier値、係数、閾値、Clamp等はBalance Config化する。\n- ValidatorのBalance Warning閾値もConfig化する。\n- V9等の現行数値はシステム調整までの仮値として扱う。\n\n\n===== SOURCE: 01_MOD仕様_決定台帳_v0.1.md =====\n\n# MOD仕様 決定台帳 v0.1\n\n| 論点 | 状態 | 決定 |\n|---|---|---|\n| MODの基本適用先 | 確定 | targetの基礎値 |\n| Equipment性能MOD式 | 確定 | Base + Base×Percent合計 + Flat合計 |\n| BaseItem保存値 | 確定 | MODで上書きしない |\n| DAMAGE MOD | 方針確定 | Damage Pipeline基礎targetへ接続 |\n| CRITICAL MOD | 方針確定 | Critical Pipeline基礎targetへ接続 |\n| DEFENSE MOD | 方針確定 | Defense Pipeline基礎targetへ接続 |\n| 武器基礎Critical | 確定 | base_critical_rate=0.05を武器から供給 |\n| Tier具体値 | 仮 | Balance Configで変更可能 |\n| 係数/閾値/Clamp | 仮 | Balance Configで変更可能 |\n| Validator Balance閾値 | 確定方針 | Config化 |\n| CRITICAL_RATE適用方式 | 未確定 | 次工程 |\n| CRITICAL_DAMAGE適用方式 | 未確定 | 次工程 |\n| ELEMENT_RESIST適用方式 | 未確定 | 次工程 |\n| STATUS_RESIST適用方式 | 未確定 | 次工程 |\n| SURVIVAL target | 未確定 | 正本照合後に決定 |\n| 貫通系適用段階 | 未確定 | 次工程 |\n\n\n===== SOURCE: 02_次工程.md =====\n\n# MOD接続仕様 次工程\n\n1. V9 MOD一覧をtarget単位に整理\n2. CRITICAL_RATEの適用方式確定\n3. CRITICAL_DAMAGEの適用方式確定\n4. ELEMENT_RESIST / STATUS_RESISTの適用方式確定\n5. SURVIVALの正式target確認\n6. 貫通系MODの適用段階確定\n7. MOD演算順序確定\n8. MOD Definition Schema案\n9. MOD Balance Config Schema案\n10. Validator規則\n11. Equipment / Battle接続表完成\n12. Equipment完全統合仕様へ統合\n\n\n===== SOURCE: README.md =====\n\n# README\n\nここまでのMOD接続検討をまとめた作業用確定パッケージ。\n\n重要:\n- MOD数値バランスはまだ正式確定ではない。\n- V9等の既存数値は初期値/仮値として扱う。\n- システム構造とBalance値を分離する。\n- 未確定事項は推論で埋めず、次工程で順次確定する。","decision_refs":["DEC-V9-MOD-001"],"depends_on":["SPEC-V9-0028","SPEC-V9-0032"],"acceptance_criteria":"原資料の確定/仮採用/未決定の状態を変更せず保持し、V9 baselineとの差分根拠として参照できる。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:26:00+09:00","updated_at":"2026-08-19T09:26:00+09:00"},{"id":"SPEC-V9-MOD-SRC-V02","title":"[POST-V9][SUPERSEDED] MOD接続仕様系列 v0.2","status":"Superseded","summary":"CRITICAL/耐性/貫通/SURVIVALと拡張effect_typeを確定した版。後続v0.4により履歴化。","body":"【Source Package】\nfile: MOD接続仕様_確定版_v0.2(3).zip\nsha256: 55964c8bd3aa5cd820f72efa95118d7488662470ee467893694bceb39b418df3\nrole: post-V9 source\n\n===== SOURCE: 00_MOD接続仕様_確定版_v0.2.md =====\n\n# MOD接続仕様 確定版 v0.2\n\n## 0. 目的と境界\n\n本書で定義するのは **MODそのものの仕様と既存システムへの接続方法** である。\n\nBattle / Skill / HP / Critical / Resistance等の既存システム仕様を、\nMOD側から再定義しない。\n\nMODは既存システムが持つ正式な値・処理・受付先へ補正または効果を渡す。\n\n---\n\n# 1. 最上位原則\n\n## 1.1 MODは原則として対象の基礎値へ作用する\n\n```text\nMOD\n↓\ntargetを特定\n↓\ntargetの既存基礎値を取得\n↓\nMOD仕様に従って補正\n↓\n補正結果を既存システムへ渡す\n```\n\n数値MODは原則として「対象となる基礎値」に作用する。\n\nただし、耐性・貫通など対象値の性質上、\n相対倍率ではなく直接加算・減算を行うMODも存在する。\n\n---\n\n# 2. MODの構造\n\nMODの種類は今後増える前提とし、最初から固定一覧に閉じない。\n\n基本構造:\n\n```text\nMOD Definition\n├─ id\n├─ category\n├─ effect_type\n├─ target\n├─ operation\n├─ parameters\n├─ conditions\n├─ balance_key\n└─ enabled\n```\n\n## 2.1 category\n\n既存V9仕様で確認済みの大分類:\n\n- DAMAGE\n- CRITICAL\n- DEFENSE\n\nこの分類を正本として継承する。\n将来必要になれば追加可能。\n\n## 2.2 effect_type\n\nMODが「何をするか」を表す。\n\n現時点の代表例:\n\n- `numeric_modifier`\n- `attribute_grant`\n- `attribute_add`\n- `attribute_convert`\n- `skill_grant`\n- `skill_modifier`\n- `effect_grant`\n- `effect_modifier`\n- `trigger_modifier`\n\nただし詳細未確定のMODを先回りして固定しない。\n必要になった時点で正式追加する。\n\n## 2.3 operation\n\nMODが対象へ「どう作用するか」。\n\n数値MODで現時点に確定している代表方式:\n\n- `RELATIVE_PERCENT`\n- `FLAT_ADD`\n- `ADDITIVE_POINT`\n- `SUBTRACTIVE_POINT`\n\n非数値MODでは数値operationを必須にしない。\n\n## 2.4 parameters\n\nMOD固有の追加情報を保持する拡張領域。\n\n例:\n- skill_id\n- attribute_id\n- effect_id\n- trigger条件\n- その他参照ID\n\nただし `parameters` の内容をRuntimeが推測して処理しない。\n新しい `effect_type` を追加する場合は、\nSchema / Validator / Resolverを同時に正式追加する。\n\n---\n\n# 3. 新MOD追加ルール\n\n```text\n新MOD案\n↓\n既存effect_typeで表現可能か\n├─ YES → MOD Definition追加\n└─ NO\n    ↓\n新effect_type定義\n    ↓\nSchema追加\n    ↓\nValidator追加\n    ↓\nResolver追加\n    ↓\nMOD Definition登録\n```\n\n**MODの種類は拡張可能だが、無秩序な自由記述にはしない。**\n\n新しいMOD機能は原則として、\n\n```text\nDefinition\n+ Schema\n+ Validator\n+ Resolver\n```\n\nのセットで追加する。\n\nこれによりMODが多数増えても、再現性を維持する。\n\n---\n\n# 4. 数値MODの共通集約原則\n\nMODを装備順・保存順・読込順に1件ずつ適用しない。\n\n```text\n有効MODを収集\n↓\ntarget別に分類\n↓\neffect_type / operation別に集約\n↓\n一度だけ適用\n↓\n既存システムへ渡す\n```\n\n同じtarget・同じoperationのMODは先に合算する。\n\nこれによりMODの格納順や装備順で結果が変化しない。\n\n---\n\n# 5. RELATIVE_PERCENT\n\n対象の既存基礎値に対する相対割合補正。\n\n基本形:\n\n```text\nFinal\n= Base\n+ (Base × RelativePercent合計)\n```\n\nEquipment性能でFlat値が併存する場合:\n\n```text\nFinal\n= Base\n+ (Base × RelativePercent合計)\n+ FlatAdd合計\n```\n\n例:\n\n```text\nBase attack = 100\n+10%\n+5 flat\n\n→ 100 + 10 + 5\n→ 115\n```\n\nFlat追加値へRelativePercentを再適用しない。\n\n---\n\n# 6. CRITICAL_RATE\n\n武器側から既存システムへ持ち込まれる正式基礎値:\n\n```text\nbase_critical_rate = 5%\n```\n\nCRITICAL_RATE MODはこの既存基礎値への `RELATIVE_PERCENT`。\n\n例:\n\n```text\n基礎Critical Rate = 5%\nMOD = +10%\n\n5% + (5% × 10%)\n= 5.5%\n```\n\n`+10%` を +10 percentage points として15%にする方式は不採用。\n\nMOD側がCritical判定そのものを再定義しない。\n\n---\n\n# 7. CRITICAL_DAMAGE\n\nCRITICAL_DAMAGE MODは、\n既存Criticalシステムが持つ基礎Critical Damage値への\n`RELATIVE_PERCENT` とする。\n\nMOD側ではCritical Damageの基礎値自体を定義しない。\n\n基本形:\n\n```text\nFinal Critical Damage\n= Base Critical Damage\n+ (Base Critical Damage × MOD%合計)\n```\n\n具体的な基礎倍率は既存Critical仕様を参照する。\n\n---\n\n# 8. 耐性MOD\n\n## 8.1 基本\n\n耐性は基本0%から直接加算する。\n\n```text\nBase Resistance = 0%\n\nResistance +10%\n→ 10%\n\nResistance +10% +15%\n→ 25%\n```\n\n適用方式:\n\n```text\nADDITIVE_POINT\n```\n\nこれは「0%を10%相対強化」ではない。\n\n## 8.2 複数MOD\n\n同じ耐性targetを持つMODは合算する。\n\n```text\nFinal Resistance\n= Base Resistance\n+ Resistance MOD合計\n```\n\n## 8.3 正式上限\n\n耐性上限 **75%** は既存正式仕様として確定済み。\n\nMOD側はその既存上限仕様に従う。\n上限値や耐性をBattleでどう使用するかをMOD側で再定義しない。\n\n対象:\n- ELEMENT_RESIST\n- STATUS_RESIST\n- その他同方式の耐性target\n\n---\n\n# 9. 貫通MOD\n\n貫通は相手の対応耐性値から直接減算する。\n\n適用方式:\n\n```text\nSUBTRACTIVE_POINT\n```\n\n複数の同target貫通MODは合算。\n\n例:\n\n```text\n相手の耐性 = 40%\n貫通 +10%\n貫通 +15%\n\npenetration_total = 25%\n\n40% - 25%\n= 15%\n```\n\nMOD側が耐性の最終下限・Damage計算等を再定義しない。\nそれらは既存仕様に従う。\n\n---\n\n# 10. SURVIVAL\n\n既存MOD仕様上のSURVIVALは最大HP増加を対象とする。\n\nMOD仕様としては、既存の最大HP系基礎値に対する\n`RELATIVE_PERCENT` とする。\n\n複数SURVIVALは同target割合MODとして合算する。\n\n```text\nSURVIVAL +25%\nSURVIVAL +10%\n\n→ RelativePercent合計 = 35%\n```\n\nMOD側では、\n- 最大HPの基礎値の決め方\n- Battle開始時HP\n- Character HP計算\n\nを再定義しない。\n\n既存HP仕様が持つ値への補正だけを担当する。\n\n---\n\n# 11. Equipment性能MOD\n\nEquipment側で確定済みの数値MOD式:\n\n```text\nFinal Equipment Contribution\n= Base\n+ (Base × Percent MOD合計)\n+ Flat MOD合計\n```\n\n対象例:\n- attack\n- accuracy\n- magic_weapon_bonus\n- hp_bonus\n- mp_bonus\n- evasion\n\nBaseItem保存値を直接書き換えない。\n\n```text\nBaseItem\n↓\nEquipment Contribution\n↓\nMOD Resolver\n↓\nModified Contribution\n↓\n既存Runtime\n```\n\n---\n\n# 12. 数値以外のMOD\n\nMODは数値補正だけではない。\n\n今後想定される例:\n\n- 属性付与\n- 属性追加\n- 属性変換\n- Skill付与\n- Skill使用可能化\n- Skill補正\n- Effect付与\n- Buff / Debuff関連\n- Trigger発動\n- その他特殊効果\n\nこれらを数値MODの4演算へ無理に押し込まない。\n\n例:\n\n```text\neffect_type = attribute_grant\ntarget = 既存属性受付先\nparameters.attribute_id = ...\n```\n\n```text\neffect_type = skill_grant\ntarget = 既存Skill受付先\nparameters.skill_id = ...\n```\n\nMOD側は既存Skill/Attribute/Effectの処理本体を再定義しない。\n\n---\n\n# 13. RulesとBalanceの分離\n\n## 13.1 MOD仕様として固定するもの\n\n- MOD ID\n- category\n- effect_type\n- target\n- operation\n- stacking rule\n- 接続先\n- 条件構造\n- 重複ルール\n- balance_key\n- Schema\n- Validator\n- Resolver\n\n## 13.2 後から調整可能にするもの\n\n以下の数値はシステム調整までの仮値を含むため、\n可能な限りBalance Configで変更可能にする。\n\n- Tier値\n- MOD効果量\n- %\n- Flat値\n- 係数\n- Warning閾値\n- バランス判定レンジ\n- その他調整用数値\n\nただし、既存正式仕様として確定済みの値\n（例: 耐性上限75%）は正式仕様を優先する。\n\n---\n\n# 14. MOD Balance Config\n\n概念構造:\n\n```text\nMOD Definition\n├─ id\n├─ category\n├─ effect_type\n├─ target\n├─ operation\n├─ balance_key\n└─ ...\n\n          ↓\n\nMOD Balance Config\n├─ Tier1 value\n├─ Tier2 value\n├─ Tier3 value\n├─ Tier4 value\n├─ Tier5 value\n├─ validation thresholds\n└─ 調整用parameter\n```\n\nコード内へTier値や調整数値を直接固定しない。\n\n---\n\n# 15. Validator\n\n## Structural Validation\n\n仕様違反をErrorとして停止可能。\n\n例:\n- 未登録effect_type\n- 未登録target\n- operation不整合\n- 必須parameter欠落\n- 参照ID不存在\n- Balance Config不存在\n- effect_typeに対応するResolver不存在\n\n## Balance Validation\n\n数値レンジの異常候補は原則Warning。\n\n数値警告閾値はConfigで変更可能にする。\n\n---\n\n# 16. Equipment / Item Generationとの境界\n\n```text\nBaseItem Generation\n↓\nBaseItem\n\nItem Generation\n├─ Rarity\n├─ MOD slot\n├─ MOD selection\n├─ MOD Tier\n└─ 完成装備\n\n↓\nMOD Resolver\n\n├─ numeric_modifier\n├─ attribute系\n├─ skill系\n├─ effect系\n├─ trigger系\n└─ 将来追加effect_type\n\n↓\n既存システム\n```\n\nBaseItem生成式そのものへMODを混ぜない。\n\n---\n\n# 17. 現時点で確定したこと\n\n- MODは原則targetの既存基礎値へ作用する。\n- MODは既存Battle/Skill等の仕様を再定義しない。\n- 数値MODはtarget / operation単位で集約してから適用する。\n- MODの保存順・装備順で結果を変えない。\n- RELATIVE_PERCENTは基礎値に対する相対補正。\n- Equipment数値MODは `Base + Base×% + Flat`。\n- CRITICAL_RATE +10%は基礎5%に対して相対補正し5.5%。\n- CRITICAL_DAMAGEも基礎Critical Damageへの相対補正。\n- 耐性は基本0%から直接加算。\n- 同耐性MODは合算。\n- 耐性上限75%は既存正式仕様を継承。\n- 貫通は相手の対応耐性から直接減算。\n- 複数貫通は合算。\n- SURVIVALは既存最大HP系基礎値への相対%補正。\n- MODは数値だけでなく属性付与・Skill付与等へ拡張可能にする。\n- MOD種類は事前に全列挙せず都度追加できる構造にする。\n- 新effect_type追加時は Definition + Schema + Validator + Resolver をセットで追加する。\n- 具体的Tier値・効果量・調整値は変更可能なBalance Configへ分離する。\n\n---\n\n# 18. 次工程\n\n次の仕様確定候補:\n\n1. MOD Definition Schema正式化\n2. effect_type Registry\n3. target Registry\n4. operation Registry\n5. stacking rule Schema\n6. conditions / trigger構造\n7. MOD Balance Config Schema\n8. Item GenerationでのMOD抽選・Tier決定との接続\n9. MOD Validator詳細\n10. Equipment完全統合仕様への最終統合\n\n\n===== SOURCE: 01_MOD仕様_決定台帳_v0.2.md =====\n\n# MOD仕様 決定台帳 v0.2\n\n| 論点 | 状態 | 決定 |\n|---|---|---|\n| MODの責務 | 確定 | 既存仕様への補正/効果接続。Battle等を再定義しない |\n| MOD基本適用先 | 確定 | targetの既存基礎値 |\n| 数値MOD集約 | 確定 | target/operation単位で先に合算 |\n| 順序依存 | 禁止 | 保存順・装備順で結果を変えない |\n| Equipment数値MOD式 | 確定 | Base + Base×% + Flat |\n| CRITICAL_RATE | 確定 | relative percent。5% +10% → 5.5% |\n| CRITICAL_DAMAGE | 確定 | 既存基礎Critical Damageへのrelative percent |\n| ELEMENT_RESIST | 確定 | additive point |\n| STATUS_RESIST | 確定 | additive point |\n| 耐性基本値 | 確定 | 0% |\n| 耐性複数MOD | 確定 | 合算 |\n| 耐性上限 | 既存正式仕様 | 75% |\n| 貫通 | 確定 | 対応耐性からsubtractive point |\n| 複数貫通 | 確定 | 合算 |\n| SURVIVAL | 確定 | 既存最大HP系基礎値へのrelative percent |\n| MOD種類 | 確定方針 | 固定一覧に閉じず都度追加 |\n| 非数値MOD | 確定方針 | 属性/Skill/Effect/Trigger等をeffect_typeで拡張 |\n| 新effect_type追加 | 確定 | Definition + Schema + Validator + Resolver |\n| Tier具体値 | 調整値 | Balance Config |\n| MOD効果量 | 調整値 | Balance Config |\n| Warning閾値 | 調整値 | Balance Config |\n| Battle/Skill本体処理 | 対象外 | 既存正本へ委譲 |\n\n\n===== SOURCE: 02_次工程_v0.2.md =====\n\n# MOD仕様 次工程 v0.2\n\n## 優先順\n\n1. MOD Definition Schema\n2. effect_type Registry\n3. target Registry\n4. operation Registry\n5. stacking rule\n6. conditions / trigger Schema\n7. Balance Config Schema\n8. Item Generation接続\n9. Validator\n10. Equipment完全統合仕様へ反映\n\n## 方針\n\nMOD詳細は今後都度追加される前提。\n全MODを今の段階で列挙することを完了条件にしない。\n\nMOD Pipelineの完了条件は、\n「新しいMODを既存Pipelineを壊さず追加できる仕組み」が完成していること。\n\n\n===== SOURCE: README.md =====\n\n# README\n\nMOD関係のここまでの採用事項を統合した v0.2。\n\nv0.1からの主な更新:\n- MOD仕様とBattle/Skill仕様の境界を明文化\n- CRITICAL_RATEの相対補正を確定\n- CRITICAL_DAMAGEの接続原則を確定\n- 耐性の加算方式と正式上限75%を反映\n- 貫通の直接減算方式を確定\n- SURVIVALのMOD側仕様を整理\n- 数値MODをMOD全体と同一視しない構造へ拡張\n- 属性付与/Skill付与/Effect/Trigger等を将来追加可能に\n- 新effect_typeはDefinition+Schema+Validator+Resolverのセットで追加\n- MOD詳細は都度追加する運用を正式採用","decision_refs":["DEC-V9-MOD-001"],"depends_on":["SPEC-V9-0028","SPEC-V9-0032"],"acceptance_criteria":"原資料の確定/仮採用/未決定の状態を変更せず保持し、V9 baselineとの差分根拠として参照できる。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:26:00+09:00","updated_at":"2026-08-19T09:26:00+09:00"},{"id":"SPEC-V9-MOD-SRC-V03","title":"[POST-V9][SUPERSEDED] MOD接続仕様系列 v0.3","status":"Superseded","summary":"タグ駆動を最上位へ再整理し、MODを共通Tag Registry参加者とした版。後続v0.4により履歴化。","body":"【Source Package】\nfile: MOD接続仕様_タグ駆動統合版_v0.3(1).zip\nsha256: 8b6362af24ac641ddf2863940cdac64cbe63dcda65f59ea34c981ad40215fab4\nrole: post-V9 source\n\n===== SOURCE: 00_MOD接続仕様_タグ駆動統合版_v0.3.md =====\n\n# MOD接続仕様 タグ駆動統合版 v0.3\n\n## 0. 改訂方針\n\nv0.2までのMOD仕様を、ライブラリの最上位設計思想である\n**タグ駆動（Tag-Driven）** を前提として再整理する。\n\n重要な変更:\n- MOD専用の巨大な conditions / trigger システムを上位に置かない。\n- MODはタグシステムの「利用者・参加者」とする。\n- Skill / Equipment / Character / Monster / Effect等と同じタグ体系へ参加させる。\n- MODかSkillかというデータ種別より先に、タグによる性質・対象・相互作用を評価できる構造を目標とする。\n- MOD固有の効果内容・数値演算はMOD Definition / Resolverが担当する。\n- タグ自体にMOD固有の計算ロジックを埋め込まない。\n\n---\n\n# 1. 最上位設計\n\n```text\n                 タグシステム\n                     │\n     ┌───────────────┼───────────────┐\n     │               │               │\n Character        Monster          Job\n     │               │               │\n Equipment ─────── MOD ─────────── Skill\n     │               │               │\n     └──────────── Effect ────────────┘\n```\n\nタグシステムはMODの下位機能ではない。\nMODがタグシステムへ参加する。\n\n---\n\n# 2. MODの責務\n\nMODが担当するもの:\n- MOD固有ID\n- MOD自身のタグ\n- 効果種別\n- 効果対象\n- 数値演算方式（必要なMODのみ）\n- 効果固有パラメータ\n- Balance Config参照\n- 有効/無効\n- 対応Resolverへの接続\n\nMODが担当しないもの:\n- Battle仕様の再定義\n- Skill仕様の再定義\n- HP / Critical / Resistance等の既存計算仕様の再定義\n- MOD専用の別タグ体系\n- MOD専用のパッシブ概念\n- タグシステムと重複する独自分類・条件体系\n\n---\n\n# 3. タグ駆動MOD Definition\n\n基本形:\n\n```text\nMOD Definition\n├─ id\n├─ category\n├─ tags[]\n├─ effect_type\n├─ target\n├─ operation\n├─ parameters\n├─ balance_key\n├─ enabled\n└─ schema_version\n```\n\n### tags[]\n\nMODを共通タグシステムへ接続する最重要フィールド。\n\n例:\n```text\ntags:\n  - パッシブ\n  - 炎\n```\n\n同じ「パッシブ」「炎」タグをSkill等も利用可能。\n\n### effect_type\n\nMODが実際に何をするかを表す。\n\n例:\n- numeric_modifier\n- attribute_grant\n- skill_grant\n- skill_modifier\n- effect_grant\n- effect_modifier\n- その他、今後正式追加する効果\n\n### target\n\nMOD効果の既存システム上の受付先。\n\n### operation\n\n数値MOD等で必要な場合だけ使用する。\n\n現時点で確定:\n- RELATIVE_PERCENT\n- FLAT_ADD\n- ADDITIVE_POINT\n- SUBTRACTIVE_POINT\n\n### parameters\n\neffect_type固有の参照値・追加値を保持する。\n自由記述コードとしては扱わない。\n\n---\n\n# 4. タグと効果処理の責務分離\n\n```text\nタグ\n→ 性質\n→ 分類\n→ 対象判定\n→ 相互作用判定\n\nMOD Definition\n→ 何の効果を持つか\n→ 何を対象とするか\n→ 必要な値・参照ID\n\nResolver\n→ MOD効果を既存システムへ適用\n\n既存システム\n→ Battle / Skill等の本来の処理\n```\n\nタグ自体へ攻撃力計算等の処理本体を埋め込まない。\n\n---\n\n# 5. MODとSkillの共通利用\n\n例:\n\n```text\nMOD A\ntags:\n  - パッシブ\n  - 炎\n\nSkill B\ntags:\n  - パッシブ\n  - 炎\n```\n\nこの場合、将来の共通ルールは\n「MODかSkillか」だけでなくタグを基準に対象判定できる。\n\n例:\n- パッシブタグを持つ対象\n- 炎タグを持つ対象\n- 炎 + パッシブを同時に持つ対象\n\nこれによりMOD / Skill間の同時利用・相互作用を可能にする。\n\n---\n\n# 6. 発動条件・トリガーの扱い\n\nv0.2で想定していたMOD独自の `conditions` を、\nMOD制御の最上位には置かない。\n\n基本方針:\n\n```text\nまずタグシステムで表現・判定できるか\n↓\nできる → 共通タグシステムを使用\n↓\nできない\n↓\n効果固有の追加パラメータ/既存共通条件機構を参照\n```\n\n例:\n- パッシブ性 → パッシブタグ\n- 炎属性性 → 炎タグ\n- 武器種別との関連 → 武器タグ\n- 種族関連 → 種族タグ\n\n具体的な数値条件等がタグだけでは表現できない場合でも、\nMOD専用にBattle条件システムを再構築しない。\n既存の共通条件・効果機構がある場合はそれを参照する。\n\n---\n\n# 7. 固定処理型MOD\n\n耐性系など、すでに処理仕様が固定されているものは\nタグ駆動化しても計算方式を自由化しない。\n\n## 属性耐性 / 状態異常耐性\n\n```text\nBase = 0%\noperation = ADDITIVE_POINT\nstacking = 合算\n正式上限 = 75%（既存正式仕様）\n```\n\nMODデータから乗算等へ変更不可。\n\n## 耐性貫通\n\n```text\noperation = SUBTRACTIVE_POINT\nstacking = 合算\n```\n\n相手の対応耐性から直接減算する。\n\nタグはこれらの性質・対象判定・相互作用に利用できるが、\n確定済みの数値処理を上書きしない。\n\n---\n\n# 8. 拡張処理型MOD\n\n攻撃・ダメージ・属性・Skill連動等は拡張性を優先する。\n\n```text\n拡張MOD\n├─ tags[]\n├─ effect_type\n├─ target\n├─ operation（必要時）\n├─ parameters\n├─ balance_key\n└─ enabled\n```\n\n今後想定される例:\n- 攻撃補正\n- ダメージ補正\n- 属性付与\n- 属性追加\n- 属性変換\n- Skill付与\n- Skill強化\n- Effect付与\n- 条件付き効果\n- 追加攻撃\n- その他特殊効果\n\n全種類を現時点で固定しない。\n\n---\n\n# 9. 新しいMOD効果の追加\n\n```text\n新MOD案\n↓\n既存タグで性質・対象を表現可能か確認\n↓\n既存effect_type / Resolverで効果を表現可能か確認\n├─ YES\n│   └─ MOD Definitionを追加\n└─ NO\n    ├─ 必要なら正式タグを追加\n    ├─ effect_typeを追加\n    ├─ Schemaを追加\n    ├─ Validatorを追加\n    ├─ Resolverを追加\n    └─ MOD Definitionを登録\n```\n\n原則:\n\n**新effect_type = Definition + Schema + Validator + Resolver**\n\nタグ追加が必要な場合は既存タグシステムの正式な登録経路を使用する。\n\n---\n\n# 10. 数値MOD共通ルール\n\n数値MODは格納順・装備順に逐次計算しない。\n\n```text\n有効MOD収集\n↓\nタグ/対象条件の評価\n↓\ntarget別分類\n↓\noperation別集約\n↓\n一度だけ適用\n↓\n既存システムへ結果を渡す\n```\n\nこれにより順序依存を排除する。\n\n---\n\n# 11. Equipment数値MOD\n\n確定式:\n\n```text\nFinal\n= Base\n+ (Base × Percent MOD合計)\n+ Flat MOD合計\n```\n\n例:\n\n```text\nBase attack = 100\nPercent MOD = +10%\nFlat MOD = +5\n\nFinal = 115\n```\n\nBaseItem保存値そのものは書き換えない。\n\n---\n\n# 12. CRITICAL_RATE\n\n既存正式基礎値:\n```text\nbase_critical_rate = 5%\n```\n\nMOD +10%:\n\n```text\n5% + (5% × 10%)\n= 5.5%\n```\n\n相対%方式。\n+10 percentage points方式は不採用。\n\nMOD側はCritical判定そのものを再定義しない。\n\n---\n\n# 13. CRITICAL_DAMAGE\n\n既存Criticalシステムが持つ基礎Critical Damage値への\nRELATIVE_PERCENT。\n\n```text\nFinal\n= Base\n+ (Base × MOD%合計)\n```\n\n基礎Critical Damage値自体はMOD仕様で再定義しない。\n\n---\n\n# 14. SURVIVAL\n\n既存MOD仕様上、最大HP増加を対象とする。\n\nMOD側:\n```text\noperation = RELATIVE_PERCENT\nstacking = 同target割合を合算\n```\n\n既存最大HP系基礎値へ補正を渡す。\n\nHP計算本体は再定義しない。\n\n---\n\n# 15. 耐性\n\n属性耐性・状態異常耐性:\n\n```text\nBase = 0%\nFinal = MOD耐性値の合算\n既存正式上限 = 75%\n```\n\n相対%ではなく直接加算。\n\n---\n\n# 16. 貫通\n\n```text\neffective_resistance\n= target_resistance - penetration_total\n```\n\n複数貫通MODは合算。\n\n耐性の最終利用方法・下限等は既存仕様へ委譲。\n\n---\n\n# 17. MOD種類は固定一覧にしない\n\nMOD詳細は未確定であり、今後都度追加する。\n\nしたがってMOD Pipelineの完成条件を\n「全MOD種類が決まっていること」にはしない。\n\n完成条件:\n\n**新しいMODをタグ駆動の共通構造へ安全・再現可能に追加できること。**\n\n---\n\n# 18. RulesとBalanceの分離\n\n仕様側:\n- id\n- category\n- tags[]\n- effect_type\n- target\n- operation\n- stacking rule\n- Schema\n- Validator\n- Resolver\n- 既存システムへの接続規則\n\nBalance Config:\n- Tier値\n- MOD効果量\n- %\n- Flat値\n- 係数\n- バランス警告閾値\n- その他調整数値\n\n既存正式仕様の値はBalance仮値として勝手に再定義しない。\n例: 耐性上限75%。\n\n---\n\n# 19. Validator\n\n## 構造検証\n\n例:\n- MOD ID不正\n- 未登録タグ参照\n- 未登録effect_type\n- 未登録target\n- operation不整合\n- 必須parameter欠落\n- Resolver不存在\n- Balance Config不存在\n\n## タグ検証\n\nMOD独自タグDBを持たず、\n共通Tag Registry / Masterを参照する。\n\n例:\n- タグID不存在 → Error\n- 無効タグ参照 → Errorまたは既存タグ仕様に従う\n- タグカテゴリ矛盾 → 既存タグValidatorに委譲\n\n## Balance検証\n\n異常候補は原則Warning。\n警告閾値は調整可能にする。\n\n---\n\n# 20. Pipeline\n\n```text\nBaseItem Generation\n↓\nBaseItem\n↓\nItem Generation\n├─ Rarity\n├─ MOD slot\n├─ MOD selection\n└─ MOD Tier\n↓\n完成Equipment\n↓\n装備中MOD収集\n↓\n共通タグシステムによる評価\n↓\nMOD Definition / Resolver\n├─ 固定処理型\n└─ 拡張処理型\n↓\n既存Battle / Skill / Effect等へ接続\n```\n\n---\n\n# 21. Skill Pipelineへの応用\n\nEquipment/MOD Pipelineで確立する:\n\n- 共通Tag Registry参照\n- タグ検証\n- Definition Schema\n- Resolver登録\n- Balance分離\n- Validator\n- 再現可能な生成/検証\n\nをSkill Pipelineでも利用する。\n\nMOD専用とSkill専用で同じ概念を重複実装しない。\n\n---\n\n# 22. 現時点の確定事項\n\n1. タグシステムを最上位設計思想として扱う。\n2. MODはタグシステムの参加者。\n3. MOD専用タグ体系を作らない。\n4. MOD専用パッシブ概念を作らず、共通タグを利用する。\n5. Skill等と同じタグを利用可能にする。\n6. タグは性質・分類・対象・相互作用判定に利用する。\n7. 実際の効果内容はMOD Definition / Resolverが担当する。\n8. タグへMOD固有の計算ロジックを埋め込まない。\n9. MOD専用conditions/triggerを最上位制御層にしない。\n10. 数値MODの既確定演算は維持する。\n11. 耐性系は固定処理。\n12. 攻撃・Skill連動等は拡張性重視。\n13. MOD種類は都度追加可能にする。\n14. 新effect_typeはSchema/Validator/Resolverとセットで追加する。\n15. MOD Pipeline完成後、この方式をSkill Pipelineへ応用する。\n\n---\n\n# 23. 次工程\n\n1. 共通Tag Registryとの正式接続フィールド確定\n2. MOD必須タグ/任意タグの扱い\n3. MOD Definition Schema v1作成\n4. 固定処理型Resolver定義\n5. 拡張effect_type Registry定義\n6. MOD Validator\n7. Balance Config Schema\n8. Item GenerationからMOD Definitionへの接続\n9. タグ駆動相互作用テスト\n10. Equipment完全統合仕様へ反映\n\n\n===== SOURCE: 01_MOD仕様_決定台帳_v0.3.md =====\n\n# MOD仕様 決定台帳 v0.3\n\n| 論点 | 状態 | 決定 |\n|---|---|---|\n| 最上位設計思想 | 確定 | タグ駆動 |\n| MODとタグの関係 | 確定 | MODが共通タグシステムへ参加 |\n| MOD専用タグDB | 不採用 | 共通Tag Registry/Master参照 |\n| MOD専用パッシブ | 不採用 | 共通パッシブタグを利用 |\n| Skillとの共通利用 | 確定 | 同一タグ体系を利用可能 |\n| タグの責務 | 確定 | 性質・分類・対象・相互作用判定 |\n| 効果本体 | 確定 | MOD Definition / Resolver |\n| MOD独自conditionsを最上位化 | 不採用 | タグ駆動を優先 |\n| MODのBattle再定義 | 禁止 | 既存仕様へ委譲 |\n| 数値MOD集約 | 確定 | target/operation単位で集約 |\n| Equipment式 | 確定 | Base + Base×% + Flat |\n| CRITICAL_RATE | 確定 | 5%へ相対%補正。+10%→5.5% |\n| CRITICAL_DAMAGE | 確定 | 既存基礎値への相対% |\n| 耐性 | 確定 | 0%起点の直接加算 |\n| 耐性上限 | 既存正式仕様 | 75% |\n| 貫通 | 確定 | 対応耐性から直接減算 |\n| SURVIVAL | 確定 | 既存最大HP系基礎値への相対% |\n| 耐性系Resolver | 確定方針 | 固定処理 |\n| 攻撃系Resolver | 確定方針 | 拡張性重視 |\n| MOD種類 | 確定方針 | 都度追加 |\n| 新effect_type | 確定 | Definition+Schema+Validator+Resolver |\n| Balance値 | 確定方針 | Config分離 |\n\n\n===== SOURCE: 02_v0.2からの修正点.md =====\n\n# v0.2 → v0.3 修正点\n\n## 廃止・修正\n- MOD独自 `conditions` を共通Schemaの中心から外す。\n- MOD独自Trigger体系を上位制御として設計しない。\n- MOD専用パッシブ分類を作らない。\n- effect_typeだけでMODの性質すべてを表現しない。\n\n## 追加\n- `tags[]` をMOD Definitionの主要共通フィールドへ。\n- 共通Tag Registry/Master参照。\n- Skill / Equipment / Character / Monster / Effectとのタグ横断利用。\n- タグ駆動評価をMOD Resolverより上流へ。\n- タグ検証をValidatorへ追加。\n\n## 維持\n- Equipment: Base + Base×% + Flat\n- Critical Rate: 5%に+10% → 5.5%\n- Critical Damage: 相対%\n- 耐性: 0%から加算、上限75%\n- 貫通: 相手耐性から減算\n- SURVIVAL: 既存最大HP系基礎値への相対%\n- Balance Config分離\n- 新effect_type追加時のSchema/Validator/Resolverセット\n\n\n===== SOURCE: 03_次工程.md =====\n\n# 次工程\n\nタグ駆動前提で以下を順に確定する。\n\n1. MODの `tags[]` と共通Tag Registryの参照方式\n2. MOD生成時のタグ付与規則\n3. 必須タグと任意タグの境界\n4. MOD Definition Schema v1\n5. 固定処理型Resolver\n6. 拡張処理型effect_type Registry\n7. Validator\n8. Balance Config\n9. Equipment Item Generation接続\n10. タグ駆動相互作用テスト\n11. Equipment統合仕様への反映\n12. 完成した方式をSkill Pipelineへ展開\n\n\n===== SOURCE: README.md =====\n\n# README\n\nMOD接続仕様 v0.1 / v0.2までの採用事項を、\nライブラリの最上位設計思想「タグ駆動」を前提に修正統合した v0.3。\n\nこの版を今後のMOD検討基準とする。\n\n旧v0.2 ZIPをトレーサビリティ用に同梱。","decision_refs":["DEC-V9-MOD-001"],"depends_on":["SPEC-V9-0028","SPEC-V9-0032"],"acceptance_criteria":"原資料の確定/仮採用/未決定の状態を変更せず保持し、V9 baselineとの差分根拠として参照できる。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:26:00+09:00","updated_at":"2026-08-19T09:26:00+09:00"},{"id":"SPEC-V9-MOD-SRC-V04","title":"[POST-V9] MOD接続仕様 タグ駆動・必須タグ枠組み統合版 v0.4","status":"Approved","summary":"タグ駆動MODへRequired Tag Rule Engine枠組みを追加した後発最新版構造仕様。","body":"【Source Package】\nfile: MOD接続仕様_タグ駆動_必須タグ枠組み統合版_v0.4(1).zip\nsha256: 1fc2ab72204dbc0c8f203fd5ed06684a1cdd9de127d620d902c348ea47330a7a\nrole: post-V9 source\n\n===== SOURCE: 00_MOD接続仕様_タグ駆動_必須タグ枠組み統合版_v0.4.md =====\n\n# MOD接続仕様 タグ駆動・必須タグ枠組み統合版 v0.4\n\n## 0. 目的\n\n本書は、v0.3までのタグ駆動MOD仕様に、\n「必須タグを将来強制できる生成パイプラインの枠組み」を追加した統合版。\n\n現時点では正式な必須タグ一覧を選定しない。\nタグ整備前でもシステム実装を進められるよう、\n必須タグルールが0件でも正常動作する設計とする。\n\n---\n\n# 1. 最上位設計思想\n\nタグシステムを最上位の共通制御思想として扱う。\n\n```text\n                共通タグシステム\n                     │\n      ┌──────────────┼──────────────┐\n      │              │              │\n    Skill           MOD         Equipment\n      │              │              │\n Character        Monster           Job\n      │              │              │\n      └────────── Effect ────────────┘\n```\n\nMODはタグシステムの参加者。\nMOD専用タグ体系は作らない。\n\n---\n\n# 2. 今回のパイプラインの本質\n\nMOD/Skill生成パイプラインで重要なのは、\n個別のタグ内容そのものではなく、\n\n```text\n必須タグルール\n↓\nAIが同じ正本を参照\n↓\n生成\n↓\nValidatorが同じ正本で検証\n↓\nPASS / ERROR\n```\n\nという再現可能な枠組みを持つこと。\n\n現時点では具体的な必須タグは未整備なので、\n必須タグルールを空で開始可能とする。\n\n---\n\n# 3. 必須タグルール\n\n概念:\n\n```text\nrequired_tag_rules = []\n```\n\nこの状態は仕様上有効。\n\n意味:\n- 必須タグの正式定義はまだ0件\n- MOD/Skill生成を禁止しない\n- Validatorは必須タグ不足Errorを出さない\n- 将来ルール追加時にGenerator本体を変更しない\n\n---\n\n# 4. 空ルール時の動作\n\n```text\nAI生成要求\n↓\n必須タグルール取得\n↓\nルール0件\n↓\n必須タグ強制なし\n↓\n生成\n↓\nValidator\n↓\n必須タグ違反なし\n↓\nPASS\n```\n\n重要:\n「必須タグが空」でも、\n必須タグRule Engineそのものを省略しない。\n\n---\n\n# 5. 将来ルール追加時の動作\n\n将来タグ整備後:\n\n```text\nrequired_tag_rules\n├─ 条件A → TAG-X必須\n├─ 条件B → TAG-Y必須\n└─ 条件C → TAG-Z必須\n```\n\nAI:\n- 同じRule Registryを参照\n- 条件に該当する必須タグを生成時に付与\n\nValidator:\n- 同じRule Registryを参照\n- required_tags ⊆ generated_tags を検証\n\n不足時:\n- Error\n- 修正要求\n- 正式Commit不可\n\n---\n\n# 6. AIとの接続\n\nAIに「適切なタグを付ける」と自由判断させない。\n\n正式経路:\n\n```text\nAI START / 生成AI\n↓\nTag Registry参照\n↓\nRequired Tag Rules参照\n↓\n生成候補作成\n↓\nValidator\n↓\nPreview / Commit\n```\n\nAIが存在しないタグIDを推測生成しない。\n\n必須タグルールが0件の場合、\n「必須タグなし」を正式結果として扱う。\n\n---\n\n# 7. Validator\n\n## 7.1 構造検証\n\n例:\n- MOD ID不正\n- 未登録タグ参照\n- 未登録effect_type\n- 未登録target\n- operation不整合\n- 必須parameter欠落\n- Resolver不存在\n- Balance Config不存在\n\n## 7.2 必須タグ検証\n\n概念:\n\n```text\nrequired_tags = resolve_required_tags(definition)\ngenerated_tags = object.tags\n\nmissing = required_tags - generated_tags\n```\n\n- missing = 0 → PASS\n- missing \u003e 0 → ERROR\n\nrequired_tag_rulesが空なら、\nrequired_tagsも空となりPASS。\n\n## 7.3 タグ正本\n\nMOD独自タグDBを持たない。\n共通Tag Registry / Masterを参照する。\n\n---\n\n# 8. MOD Definition\n\n基本形:\n\n```text\nMOD Definition\n├─ id\n├─ category\n├─ tags[]\n├─ effect_type\n├─ target\n├─ operation\n├─ parameters\n├─ balance_key\n├─ enabled\n└─ schema_version\n```\n\n現時点では `required_tags[]` をMOD本体へ手書き固定するより、\n共通Rule Engineから解決する方式を優先する。\n\n必要ならPreview用に解決済み必須タグを表示可能にする。\n\n---\n\n# 9. タグとRuntimeの境界\n\nタグは:\n- 性質\n- 分類\n- 対象判定\n- 相互作用判定\n\nに利用する。\n\n実際のMOD効果は:\n- MOD Definition\n- Resolver\n- 既存Runtime\n\nが担当する。\n\nタグ自体へBattle/Skill計算ロジックを埋め込まない。\n\n---\n\n# 10. MOD数値仕様（既確定事項）\n\n## Equipment数値MOD\n\n```text\nFinal\n= Base\n+ (Base × Percent MOD合計)\n+ Flat MOD合計\n```\n\n## CRITICAL_RATE\n\n基礎5%へ相対%補正。\n\n例:\n```text\n5% +10%\n→ 5.5%\n```\n\n## CRITICAL_DAMAGE\n\n既存基礎Critical Damageへの相対%。\n\n## 耐性\n\n```text\nBase = 0%\n複数MOD = 加算\n正式上限 = 75%\n```\n\n## 貫通\n\n相手の対応耐性から直接減算。\n複数は合算。\n\n## SURVIVAL\n\n既存最大HP系基礎値への相対%。\n\n---\n\n# 11. 固定処理型 / 拡張処理型\n\n## 固定処理型\n- 属性耐性\n- 状態異常耐性\n- 耐性貫通\n\n処理方式はデータ側で自由変更させない。\n\n## 拡張処理型\n- 攻撃補正\n- ダメージ補正\n- 属性付与\n- 属性変換\n- Skill付与\n- Skill強化\n- Effect付与\n- 条件付き効果\n- その他将来追加MOD\n\n攻撃側は拡張性を優先する。\n\n---\n\n# 12. 新MOD追加\n\n全MOD種類を事前に列挙しない。\n\n```text\n新MOD案\n↓\n既存タグで表現可能か\n↓\n既存effect_type / Resolverで表現可能か\n├─ YES → Definition追加\n└─ NO\n    ├─ 必要なら正式タグ追加\n    ├─ effect_type追加\n    ├─ Schema追加\n    ├─ Validator追加\n    └─ Resolver追加\n```\n\n原則:\n**新effect_type = Definition + Schema + Validator + Resolver**\n\n---\n\n# 13. RulesとBalanceの分離\n\n仕様側:\n- id\n- category\n- tags[]\n- effect_type\n- target\n- operation\n- stacking rule\n- required tag rule framework\n- Schema\n- Validator\n- Resolver\n- Runtime接続\n\nBalance側:\n- Tier値\n- MOD効果量\n- %\n- Flat値\n- 係数\n- 警告閾値\n- 調整数値\n\n既存正式仕様値を勝手にBalance仮値へ降格しない。\n例: 耐性上限75%。\n\n---\n\n# 14. Skill Pipelineへの応用\n\nMODで作る必須タグ枠組みはSkillでも再利用する。\n\n```text\nRequired Tag Rule Engine\n        │\n   ┌────┴────┐\n   │         │\n  MOD      Skill\n   │         │\n   └────┬────┘\n        ↓\n   共通Validator\n```\n\n現時点ではMOD/Skillどちらも、\n必須タグ一覧を空で開始可能。\n\n将来Tag Registry整備後に、\nルールを追加するだけで強制を有効化できる。\n\n---\n\n# 15. システム実装時の必須要件\n\n1. required_tag_rules = [] を正常系として扱う\n2. Rule Engine自体は最初から実装する\n3. AIとValidatorが同一のRule Registryを参照する\n4. Tag Registryに存在しないIDを推測生成しない\n5. ルール追加だけで必須タグ強制を開始できる\n6. Generator本体の改修を不要にする\n7. Previewで不足タグを確認可能にする\n8. Commit前にValidatorを通す\n9. MOD/Skillの両方へ再利用可能にする\n10. タグ駆動という最上位思想を崩さない\n\n---\n\n# 16. 現時点の確定事項\n\n- タグシステムは最上位設計思想\n- MODは共通タグシステムの参加者\n- 必須タグの具体的選定は今は行わない\n- 必須タグルール0件を正式に許可\n- 空でもRule Engineは実装\n- AIとValidatorは同じルール正本を参照\n- 将来ルール追加だけで強制可能にする\n- 存在しないタグIDをAIが推測しない\n- MOD数値仕様はv0.3までの確定内容を維持\n- MOD Pipeline完成後、同方式をSkill Pipelineへ応用する\n\n---\n\n# 17. 次工程\n\n1. Required Tag Rule Schema\n2. Rule Registryの保存形式\n3. AI STARTへのRule参照導線\n4. Validatorの必須タグチェック\n5. Preview表示\n6. MOD Definition Schema v1\n7. 固定Resolver / 拡張Resolver\n8. Balance Config Schema\n9. Item Generation接続\n10. Skill Pipelineへの共通化\n\n\n===== SOURCE: 01_MOD仕様_決定台帳_v0.4.md =====\n\n# MOD仕様 決定台帳 v0.4\n\n| 論点 | 状態 | 決定 |\n|---|---|---|\n| 最上位思想 | 確定 | タグ駆動 |\n| MOD専用タグ体系 | 不採用 | 共通Tag Registry参照 |\n| 必須タグ具体一覧 | 未選定 | 現時点では選定しない |\n| required_tag_rules空 | 確定 | 正常系として許可 |\n| Rule Engine | 確定 | 空でも実装する |\n| AI参照 | 確定 | 同一Rule Registryを参照 |\n| Validator参照 | 確定 | 同一Rule Registryを参照 |\n| 必須タグ不足 | 確定 | 将来ルール有効時はError |\n| タグ不存在 | 確定 | AI推測禁止、Validator Error |\n| MOD/Skill共通化 | 確定 | 同じ必須タグ枠組みを再利用 |\n| Equipment数値MOD | 維持 | Base + Base×% + Flat |\n| Critical Rate | 維持 | 5% +10% → 5.5% |\n| Critical Damage | 維持 | 既存基礎値への相対% |\n| 耐性 | 維持 | 0%起点、加算、上限75% |\n| 貫通 | 維持 | 対応耐性から減算 |\n| SURVIVAL | 維持 | 既存最大HP系基礎値への相対% |\n| 耐性系 | 維持 | 固定処理 |\n| 攻撃系 | 維持 | 拡張性重視 |\n\n\n===== SOURCE: 02_v0.3からの更新点.md =====\n\n# v0.3 → v0.4 追加・修正点\n\n## 追加\n- 必須タグRule Engineの枠組み\n- required_tag_rules = [] を正式正常系として定義\n- AIとValidatorが同じRule Registryを参照する原則\n- 将来ルール追加だけで強制可能にする設計\n- MOD/Skill共通利用を明文化\n\n## 変更なし\n- タグ駆動最上位思想\n- MOD数値計算\n- Critical\n- 耐性\n- 貫通\n- SURVIVAL\n- 固定処理型/拡張処理型\n- Balance Config分離\n\n## 今は行わない\n- 必須タグの具体的選定\n- 架空タグの追加\n- Skill固有の必須タグ確定\n\n\n===== SOURCE: README.md =====\n\n# README\n\nv0.3までのタグ駆動MOD仕様に、\n「必須タグが未整備でも先にシステムを実装できる枠組み」を追加したv0.4。\n\n今回の中心:\n- 必須タグ一覧は空で開始可能\n- Rule Engineは最初から存在\n- AIとValidatorは同一ルールを参照\n- 将来ルール追加だけで強制可能\n- 同方式をSkill Pipelineへ再利用","decision_refs":["DEC-V9-MOD-001","DEC-V9-MOD-002"],"depends_on":["SPEC-V9-0028","SPEC-V9-0032"],"acceptance_criteria":"原資料の確定/仮採用/未決定の状態を変更せず保持し、V9 baselineとの差分根拠として参照できる。","approved_by":"Source package","approved_at":"2026-08-19T09:26:00+09:00","created_at":"2026-08-19T09:26:00+09:00","updated_at":"2026-08-19T09:26:00+09:00"},{"id":"SPEC-V9-MOD-SRC-EXTRA","title":"[POST-V9][MIXED STATUS] MOD関連 追加決定事項","status":"Review","summary":"通常MOD抽選の仮採用事項、能力値MOD不採用、固定/割合MOD方針、未採用アイデア候補、未決定事項を含む混在資料。","body":"【Source Package】\nfile: MOD関連_追加決定事項_前回ZIP以降(4).zip\nsha256: e456e559413a4f9835f00ea17c76b633689537b6e3e971debd130a5816437f78\nrole: post-V9 source\n\n===== SOURCE: MOD関連_追加決定事項_前回ZIP以降.md =====\n\n# MOD関連 追加決定事項\n## 対象範囲\n本資料は、前回作成した「MOD関連_決定事項.zip」以降に追加・変更された内容のみをまとめたものです。\n\n## 1. 仮採用した通常MOD抽選仕様\n\n### MODカテゴリ内の出現率\n- 同一カテゴリ内のMODは等確率で抽選する。\n\n### MOD抽選順序\n1. レアリティを決定する。\n2. MOD数を決定する。\n3. 攻撃枠・防御枠を決定する。\n4. MODカテゴリを抽選する。\n5. MOD種類を抽選する。\n6. MOD Tierを抽選する。\n\n### エリート・ボス補正\n- レアリティ補正は行わない。\n- MOD Tierの出現率だけを補正する。\n- 具体的な補正率は未決定。\n\n### TierとiLv\n- MOD TierにiLv制限を設けない。\n- すべてのiLvでTier1～Tier5を抽選対象とする。\n\n### MOD表示名\n- 効果内容をそのまま表示名として使用する。\n- 例：物理ダメージ+、魔法ダメージ+、回避率+、最大HP+。\n\n## 2. 今回は設計対象外とする事項\n- UNIQUE専用MOD\n- LEGENDARY専用MOD\n- MYTHIC専用MOD\n- クラフト成功率\n- クラフト素材\n- クラフト費用\n- エンドコンテンツ専用補正\n\n## 3. MOD設計方針\n\n### 能力値系MOD\n以下の能力値を直接増加させるMODは採用しない。\n- STR\n- VIT\n- AGI\n- DEX\n- INT\n- MND\n- LUK\n\nキャラクターの能力値はレベルアップ・職業・転職で獲得し、MODは戦闘性能を直接変化させる役割とする。\n\n### 固定値と割合\n同じ性能でも、固定値加算と割合加算を別MODとして扱う。\n\n例：\n- 物理ダメージ +15\n- 物理ダメージ +15%\n- 最大HP +200\n- 最大HP +10%\n- 命中 +20\n- 命中率 +8%\n\n## 4. 攻撃MODアイデア案\n※以下は採用済みではなく、選別用の候補案。\n\n### 基礎ダメージ\n1. 物理ダメージ固定値+\n2. 物理ダメージ%\n3. 魔法ダメージ固定値+\n4. 魔法ダメージ%\n5. 近接ダメージ固定値+\n6. 近接ダメージ%\n7. 遠距離ダメージ固定値+\n8. 遠距離ダメージ%\n9. スキルダメージ固定値+\n10. スキルダメージ%\n\n### 属性ダメージ\n11. 火属性ダメージ固定値+\n12. 火属性ダメージ%\n13. 氷属性ダメージ固定値+\n14. 氷属性ダメージ%\n15. 雷属性ダメージ固定値+\n16. 雷属性ダメージ%\n17. 風属性ダメージ固定値+\n18. 風属性ダメージ%\n19. 土属性ダメージ固定値+\n20. 土属性ダメージ%\n21. 光属性ダメージ固定値+\n22. 光属性ダメージ%\n23. 闇属性ダメージ固定値+\n24. 闇属性ダメージ%\n\n### クリティカル\n25. クリティカル率+\n26. クリティカルダメージ+\n27. 背面攻撃時クリティカル率+\n28. HP最大時クリティカル率+\n29. ボスへのクリティカルダメージ+\n\n### 命中\n30. 命中固定値+\n31. 命中率+\n32. ボスへの命中率+\n33. 弱点対象への命中率+\n\n### 状態異常\n34. 毒付与率+\n35. 火傷付与率+\n36. 凍結付与率+\n37. 感電付与率+\n38. 麻痺付与率+\n39. 睡眠付与率+\n40. 沈黙付与率+\n41. 呪い付与率+\n42. 毒ダメージ+\n43. 火傷ダメージ+\n44. 状態異常持続時間+\n45. 状態異常成功率+\n\n### 戦闘補助・特殊\n46. 攻撃速度+\n47. 詠唱速度+\n48. HP吸収\n49. MP吸収\n50. クールダウン短縮\n\n## 5. 防御MODアイデア案\n※以下は採用済みではなく、選別用の候補案。\n\n### HP・MP\n1. 最大HP固定値+\n2. 最大HP%\n3. 最大MP固定値+\n4. 最大MP%\n5. HP自然回復固定値+\n6. HP自然回復%\n7. MP自然回復固定値+\n8. MP自然回復%\n\n### 基礎耐性\n9. 物理耐性固定値+\n10. 物理耐性%\n11. 魔法耐性固定値+\n12. 魔法耐性%\n13. 火耐性固定値+\n14. 火耐性%\n15. 氷耐性固定値+\n16. 氷耐性%\n17. 雷耐性固定値+\n18. 雷耐性%\n19. 風耐性固定値+\n20. 風耐性%\n21. 土耐性固定値+\n22. 土耐性%\n23. 光耐性固定値+\n24. 光耐性%\n25. 闇耐性固定値+\n26. 闇耐性%\n\n### 状態異常耐性\n27. 毒耐性+\n28. 火傷耐性+\n29. 凍結耐性+\n30. 感電耐性+\n31. 麻痺耐性+\n32. 睡眠耐性+\n33. 沈黙耐性+\n34. 呪い耐性+\n35. 状態異常耐性+\n\n### 回避・軽減\n36. 回避固定値+\n37. 回避率+\n38. ガード率+\n39. ガード性能+\n40. 被ダメージ固定値軽減\n41. 被ダメージ%\n42. 遠距離ダメージ軽減\n43. 近接ダメージ軽減\n\n### 生存・シールド\n44. 瀕死時ダメージ軽減\n45. HP最大時ダメージ軽減\n46. HP50%以下で被ダメージ軽減\n47. バリア効果量+\n48. シールド耐久+\n49. 蘇生時HP+\n50. 回復アイテム効果+\n\n## 6. 現時点で未決定\n- 上記アイデア案の採用・不採用\n- 各候補の攻撃枠・防御枠分類\n- 各候補のTier1～Tier5の数値\n- 各候補の付与可能部位\n- 固定値版と割合版の併存可否\n- 同系統MOD間の排他条件\n- エリート・ボスのTier補正率","decision_refs":["DEC-V9-MOD-003","DEC-V9-MOD-004"],"depends_on":["SPEC-V9-0028","SPEC-V9-0032"],"acceptance_criteria":"原資料の確定/仮採用/未決定の状態を変更せず保持し、V9 baselineとの差分根拠として参照できる。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:26:00+09:00","updated_at":"2026-08-19T09:26:00+09:00"},{"id":"SPEC-V9-MOD-INTEGRATED-001","title":"[MOD][INTEGRATION CANDIDATE] V9＋後発資料 MOD最新版統合候補","status":"Review","summary":"V9 MOD baselineと後発資料を統合。通常MOD抽選順は正式採用、数値はBalance仮値・可変。能力値MODは通常枠ではなく一部装備のレア枠として限定可能。","body":"【位置付け】\nV9 Library v2.0のMOD仕様をBaselineとし、後発MOD資料 v0.1→v0.4 と『MOD関連 追加決定事項』を精査した最新版統合候補。\nV9原文は変更せず、後発差分を別Specificationとして積み上げる。\n\n【採用順位】\n1. V9全体の正式採用事項・共通設計原則\n2. 後発MOD v0.4の明示的確定事項\n3. v0.1〜v0.3からv0.4へ継承された確定事項\n4. 追加決定事項のうち明示的に確定している設計方針\n5. 『仮採用』『アイデア案』『未決定』はReviewのまま\n\n【数値の扱い：Human確定ルール】\n- MODに関する効果量・確率・上限・係数・補正率などの数値はすべてBalance調整項目として仮値扱い。\n- V9または後発資料に記載された数値は、現行Baseline/参考値として保持するだけで正式固定値とはしない。\n- 実装ではハードコードしない。\n- Config / CSV / JSON等の外部データから変更可能にする。\n- 数値変更だけでResolver/Schemaのロジック変更や再設計が不要な構造にする。\n- 仕様として固定するのは、計算方式・参照先・処理順・カテゴリ・制約構造などの「ルール」であり、具体数値はBalanceへ分離する。\n\n【1. タグ駆動】\n- タグシステムを最上位の共通制御思想として扱う。\n- MODは共通Tag Registry / Masterの参加者とし、MOD専用タグ体系を作らない。\n- Skill / Equipment / Character / Monster / Effect等と同一タグ体系を利用可能にする。\n- タグは性質・分類・対象・相互作用判定に利用する。\n- MOD固有の効果内容・計算はMOD Definition / Resolverが担当し、タグへ計算ロジックを埋め込まない。\n- MOD専用conditions/trigger体系を上位制御層にしない。\n\n【2. Required Tag Rule Engine】\n- required_tag_rules = [] を正式な正常系として許可する。\n- 必須タグが0件でもRule Engine自体は実装する。\n- AIとValidatorは同一Rule Registryを参照する。\n- Tag Registryに存在しないタグIDをAIが推測生成しない。\n- 将来はルール追加だけで必須タグ強制を開始できる。\n- 必須タグ不足はルール有効時にErrorとし、Commit前にValidatorを通す。\n- MOD/Skillへ同じ枠組みを再利用する。\n\n【3. MOD Definition候補】\nid / category / tags[] / effect_type / target / operation / parameters / balance_key / enabled / schema_version\n\n【4. 数値MOD共通ルール】\n- 有効MODを収集し、target / operation単位で集約して一度だけ適用する。\n- 保存順・装備順で結果を変えない。\n- BaseItem保存値そのものをMODで上書きしない。\n\nEquipment数値MOD:\nFinal = Base + (Base × RelativePercent合計) + FlatAdd合計\nFlat追加値へRelativePercentを再適用しない。\n\n【5. Critical】\nCRITICAL_RATE:\n- 武器由来のbase_critical_rateは現行Baselineで5%。ただしBalance Config上の仮値とし可変。\n- RELATIVE_PERCENT。\n- 例: 現行Baseline 5%へ+10% relativeを適用すると5.5%。これは計算例であり数値自体は固定しない。\n- +10 percentage points方式は不採用。\n\nCRITICAL_DAMAGE:\n- 既存Criticalシステムの基礎Critical Damage値へのRELATIVE_PERCENT。\n- MOD側で基礎倍率を再定義しない。\n\n【6. 耐性・貫通・SURVIVAL】\nELEMENT_RESIST:\n- Base 0%。\n- ADDITIVE_POINT。\n- 複数MODは合算。\n- 現行Baseline候補は75%。上限値はBalance Configから可変。\n\nSTATUS_RESIST:\n- Base 0%。\n- ADDITIVE_POINT。\n- 複数MODは合算。\n- 現行Baseline候補は75%。上限値はBalance Configから可変。\n- V9 MOD DB統合版の100%表記と後発75%表記は履歴として保持し、現行Baseline候補は75%。最終上限はBalance Configから可変。\n\n耐性貫通:\n- SUBTRACTIVE_POINT。\n- 複数貫通は合算し、相手の対応耐性から減算。\n- 耐性最終利用方法や下限は既存Battle/Status仕様へ委譲。\n\nSURVIVAL:\n- 既存最大HP系基礎値へのRELATIVE_PERCENT。\n- HP計算本体は再定義しない。\n\n【7. 固定処理型 / 拡張処理型】\n固定処理型:\n- 属性耐性\n- 状態異常耐性\n- 耐性貫通\n処理方式をデータ側で自由変更させない。\n\n拡張処理型:\n- 攻撃補正\n- ダメージ補正\n- 属性付与/変換\n- Skill付与/強化\n- Effect付与\n- 条件付き効果\n- その他将来追加MOD\n\n新effect_typeは Definition + Schema + Validator + Resolver のセットで追加する。\n\n【8. V9から継承するMOD枠・Tier・重複原則】\n- 現行BaselineではTier1〜Tier5。Tier数・範囲を固定コードへ埋め込まず、データ定義で扱う。\n- 同Tierは同一性能、内部乱数ロールなし。\n- 現行Baselineでは攻撃枠 最大2 / 防御枠 最大2。枠数はBalance/Config側で可変にできる構造とする。\n- 同一装備内の同一MOD重複禁止。\n- 装備部位が異なれば同一MOD重複可能。\n- V9既存カテゴリ DAMAGE / CRITICAL / DEFENSE と既存MOD一覧はBaselineとして保持する。\n- MODカテゴリ/種類は将来拡張可能で、既存一覧だけに閉じない。\n\n【9. RulesとBalanceの分離】\n構造仕様:\n- id / category / tags[] / effect_type / target / operation / stacking rule\n- Required Tag Rule framework\n- Schema / Validator / Resolver\n- Runtime接続規則\n\nBalance Config:\n- Tierごとの具体値\n- MOD効果量\n- % / Flat値\n- 係数\n- Warning閾値\n- その他調整数値\n\nV9に現在記録されているTier数値は削除せず、現行Baseline値として保持する。\nただし後発仕様ではTier値・効果量をBalance Configとして調整可能にする。\n数値はすべてBalance仮値として扱い、正式仕様では固定しない。正式採用するのは計算方式・参照規則・制約構造。\n\n【10. 能力値直接MOD】\n- STR / VIT / AGI / DEX / INT / MND / LUKを直接増加させる能力値MODは、通常MODの基本枠として常時採用しない。\n- 一部装備ではレア枠として能力値MODを持てる。\n- 能力値MODは確定付与ではない。\n- アミュレットも能力値MOD専用ではなく、基本は通常MODを持つ。\n- 能力値MODの具体的出現率・効果量・対象能力値等はBalance/Generator側の可変項目として扱う。\n- 同一性能について固定値版と割合版の両方を採用する場合は別MODとして扱う。\n- 固定値版と割合版を実際に両方採用するかは未決定。\n\n【通常MOD抽選順：正式採用】\n- レアリティ → MOD数 → 攻撃/防御枠 → MODカテゴリ → MOD種類 → MOD Tier\n- この順序は構造仕様として固定する。\n- 各段階の確率・補正率・Tier効果量等の数値はBalance Configで可変とする。\n- 順序以外の抽選ルールは、明示的に正式採用されたものを除き仮採用のまま扱う。\n\n【11. 仮採用の通常MOD抽選仕様：Human確認済み・仮採用維持】\n以下は、正式採用した抽選順を除き、Human確認により仮採用のまま維持する。実装・検証後に再判断する:\n- 同一カテゴリ内のMODは等確率抽選\n- 抽選順は正式採用済み（上記『通常MOD抽選順：正式採用』を参照）\n- エリート/ボスはレアリティ補正なし、MOD Tier出現率のみ補正\n- エリート/ボスの具体補正率は未決定\n- MOD TierにiLv制限を設けず、全iLvでTier1〜Tier5を抽選対象\n- MOD表示名は効果内容をそのまま使用\n\n【12. 未採用候補】\n追加決定事項に列挙された攻撃MOD50案・防御MOD50案は『アイデア案』『採用済みではない』と明記されているため正式MOD一覧へ追加しない。\n\n【13. 未決定】\n- 攻撃/防御アイデア候補の採否\n- 候補の攻撃枠/防御枠分類\n- 候補のTier1〜Tier5具体値\n- 候補の付与可能部位\n- 固定値版と割合版の併存可否\n- 同系統MOD間の排他条件\n- エリート/ボスTier補正率\n- 具体的必須タグ一覧\n\n【14. 他機能への引継ぎ】\nEquipment:\n- V9装備統合仕様にはアミュレット『能力値MOD専用』がある。\n- 後発MOD方針の『基礎能力値直接MOD不採用』と衝突するため、装備統合工程でアミュレット仕様を再確認する。\n\nTag:\n- Required Tag Rule Schema / Registry保存形式 / Tag Registry正式接続はタグ機能統合と連携する。\n\nSkill:\n- MODで確立するRequired Tag Rule EngineをSkill Pipelineへ再利用する。\n\n【15. 完了条件】\n- Humanが仮採用通常MOD抽選仕様の扱いを決定する。\n- MOD統合候補をHuman確認し、Approvedへ移行する。\n- Equipmentへの影響を依存事項として残す。\n","decision_refs":["DEC-V9-MOD-001","DEC-V9-MOD-002","DEC-V9-MOD-003","DEC-V9-MOD-004","DEC-V9-MOD-005","DEC-V9-MOD-006"],"depends_on":["SPEC-V9-0013","SPEC-V9-0025","SPEC-V9-0026","SPEC-V9-0027","SPEC-V9-0028","SPEC-V9-0032","SPEC-V9-MOD-SRC-V04","SPEC-V9-MOD-SRC-EXTRA"],"acceptance_criteria":"V9原本を保持している。\nv0.1〜v0.4の継承関係を追跡できる。\nタグ駆動・Required Tag Rule Engine・数値MOD演算構造を統合している。\n数値はすべてBalance仮値として扱い、実装時にConfig/データから変更可能である。\n仮採用/アイデア案/未決定を正式採用へ昇格していない。\n能力値MOD不採用によるEquipment影響を依存事項として残している。\nHuman確認後にApprovedへ移行できる。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:26:00+09:00","updated_at":"2026-08-19T09:48:00+09:00"},{"id":"SPEC-V9-EQUIP-SRC-V11","title":"[POST-V9][EQUIP] Equipment完全統合仕様 v1.1 原資料","status":"Approved","summary":"V9装備Version2.1、Phase6、実装前Phase8、AI START等を照合した後発Equipment修正統合正本 v1.1。原文とpackage manifestを保持。","body":"【Source Package】\nfile: 装備完全統合仕様_v1.1(2).zip\nsha256: cba856b78b12c267b6652da739e24e8bfcb27daa5fd5ea62793d931f003f67c2\npackage: Equipment完全統合仕様_AI_START接続_v1.1\nrole: post-V9 Equipment integration source\n\n===== README.md =====\n# Package README\n\nこのZIPはEquipment関連の修正統合正本 v1.1。\n\n含有:\n- Equipment完全統合仕様\n- AI START Equipment工程追加仕様\n- 現行Studio差分監査\n- 差分決定台帳\n- 参照元資料\n\n重要:\n現行Studioソース自体は変更していない。\n\nv1.1で以下を正式確定:\n- 防具要求ステータス = VIT / MND / AGI\n- V9ローブINT要求は旧仕様として不採用\n- 武器 `base_critical_rate = 0.05`\n- 基礎Critical 5%は武器側からEquipment Contribution経由でBattleへ持ち込む\n\n次工程はこのv1.1を正本としてGenerator実装仕様へ進める。\n\n===== CHANGELOG_v1.1.md =====\n# CHANGELOG v1.1\n\n## 正式確定\n- 防具要求ステータスを VIT / MND / AGI に統一。\n- V9ローブのINT要求を旧仕様として不採用。\n- 武器基礎クリティカル率5%を正式採用。\n- `base_critical_rate = 0.05` を武器由来戦闘寄与値として定義。\n- 基礎CriticalはEquipment Contribution経由でBattleへ渡す。\n- Battle側でSTR/LUK等から基礎Criticalを再計算しない。\n- Critical Damage倍率とは別概念として明記。\n- AI START Equipment工程へ同仕様を反映。\n\n\n===== 03_差分決定台帳.md =====\n# 統合時の差分・決定台帳\n\n| 論点 | 状態 | 採用 |\n|---|---|---|\n| BaseItem / Item / Loot分離 | 確定 | 3層分離 |\n| 武器正式性能 | 確定 | attack / accuracy / magic_weapon_bonus |\n| 防具正式性能 | 確定 | hp_bonus / mp_bonus / evasion |\n| 要求ステータスのBattle直接利用 | 廃止 | 装備可否のみ |\n| 旧defense | 廃止 | 使用しない |\n| 防具Growth | 確定 | HP/MP/evasion個別、Config可変 |\n| 武器Growth | 確定 | 拡張点のみ、初期無効 |\n| Equipment MOD | 確定 | Base + Base×% + Flat |\n| Damage/Defense MOD詳細 | 委譲 | V9 MOD正本 |\n| AIによる正式数値計算 | 禁止 | Studio Generatorが計算 |\n| 旧デモ互換 | 不要 | fallbackなし |\n| 防具要求ステータス | 確定 | VIT / MND / AGI。V9ローブINT要求は旧仕様として不採用 |\n| V9基礎Crit 5% | 確定 | 武器由来 `base_critical_rate=0.05` としてBattleへ持ち込む |\n\n\n===== 02_現行Studio_Equipment差分監査.md =====\n# 現行Studio Equipment差分監査\n\n提供された `guild-adventure-studio-main(20260810-021942).zip` を確認。\n\n## 結論\n現行Studioには旧デモEquipment解釈が残っており、本統合仕様への実装更新が必要。\n\n## 主な確認箇所\n- `studio/index.html` Battle UI説明: Equipment/MODからHP, MP, attack, defense, AGI, accuracy, crit, resist等を旧方式で加算\n- Battle unit生成: `str`, `luk`, `attack`, `defense` 等の旧fieldを保持\n- `BATTLE_FORMULA_DEFAULTS`: `strAccuracyCoefficient`, `lukCritCoefficient`, `defenseCoefficient`\n- `seedEquipmentBattleSample()`: `defense`, `status_resist` 等を含む旧fixture\n- Design Card Equipment例: `magic_damage_bonus`\n- Character Card: `attack`, `defense` 等の旧デモ基礎値\n- Equipment参照解決: 旧statsを直接Characterへ加算\n\n## 実装方針\n旧デモ互換は不要。\nEquipment ID/Master参照の器は再利用し、数値解釈だけ正式Consumer Contractへ置換する。\n\n\n===== 01_AI_START_09_EQUIPMENT生成_Draft_v1.md =====\n# 09_EQUIPMENT生成\n## AI START追加仕様 v1.1\n\n### 目的\nAIが装備の意図・候補を指定し、正式数値計算をStudio Equipment Generatorへ委譲する。\n\n### writable\n- equipment\n\n### read_only候補\n- tags\n- mods\n- stats / requirements master\n- Balance Config\n- Generation Rules\n- その他参照Master\n\n### AIが指定してよいもの\n- 装備カテゴリ/種別\n- BaseItem候補\n- iLvまたはiLv帯\n- 生成数\n- Item Generation接続後はMOD方向性の希望\n\n### AIが正規値として独自決定しないもの\n- required_*\n- attack\n- accuracy\n- magic_weapon_bonus\n- base_critical_rate（武器基礎値5%はGenerator/武器仕様から供給）\n- hp_bonus\n- mp_bonus\n- evasion\n- Growth計算結果\n- Config由来係数\n\n### 正規経路\n```text\nAI request\n→ Studio Generator input\n→ Generation Rules\n→ Active Balance Config\n→ BaseItem calculation\n→ Validator\n→ Preview\n→ Commit\n→ Equipment Master\n```\n\n### ID\n正式IDは推測しない。\n存在しないTag/MOD等が必要なら別カテゴリ工程へ戻る。\n\n### 提出前確認\n- equipment以外をwritableにしていない\n- Generatorを迂回した数値計算をしていない\n- 使用Config/Rulesを追跡できる\n- Validator Errorがない\n- Preview後にCommitしている\n\n\n### 防具要求ステータス\n防具要求値は `required_vit / required_mnd / required_agi` の3系統に統一する。\nAIはV9旧ローブ仕様のINT要求を生成しない。\n\n### 武器基礎Critical\n武器は `base_critical_rate = 0.05` を正式戦闘寄与値として持つ。\nAIが任意値として決めるのではなく、武器Generator/正式仕様から供給する。\n\n\n===== 00_Equipment完全統合仕様_v1.1.md =====\n# Equipment完全統合仕様 v1.1\n## AI START接続を含む\n\n## 0. 正本優先順位\n\n本統合版は以下を照合して作成した。\n\n1. V9ライブラリ `06_装備統合仕様書_Version2.1`\n2. Studio装備生成パイプライン ロードマップ Draft v0.5\n3. Phase6 装備生成パイプライン 統合完全解析資料 v1.1\n4. Equipment実装前仕様確定 Phase1〜8\n5. GKS AI START正式生成マニュアル v1\n6. 現行Studioソース（2026-08-10提供版）\n\n後工程で明示的に確定した変更は、旧V9記述より優先する。\n旧デモ実装は仕様正本として扱わない。\n\n---\n\n# 1. Equipment全体の責務\n\n装備生成は3層に分離する。\n\n```text\n1. BaseItem Generation\n装備種別\n→ iLv\n→ 要求閾値\n→ 基礎性能\n→ BaseItem\n\n2. Item Generation\nBaseItem\n→ レアリティ\n→ MOD数 / MOD枠\n→ MOD抽選\n→ Tier\n→ 完成装備\n\n3. Loot / Drop\nドロップ元\n→ ドロップ判定\n→ 装備カテゴリ等を選択\n→ Item Generation\n→ ドロップ\n```\n\n初期実装の中核はBaseItem Generation。\nMOD・レアリティ・Tier・Drop率は別工程。\n\n---\n\n# 2. 装備スロット\n\nV9正本:\n- 武器1\n- 武器2\n- 頭\n- 鎧\n- 手袋\n- 足\n- アミュレット\n- 指輪1\n- 指輪2\n- ベルト\n\n合計10スロット。\n\n両手持ちは武器種係数とは別の装備ルールとして扱う。\n\n---\n\n# 3. Item Level\n\nBaseItemは基本 `iLv1〜iLv11`。\n\nV9の共通名称:\n- iLv1 木の\n- iLv2 鉄の\n- iLv3 鋼鉄の\n- iLv4 銀の\n- iLv5 ダイヤの\n- iLv6 ミスリルの\n- iLv7 アダマンタイトの\n- iLv8 オリハルコンの\n- iLv9 巨人の\n- iLv10 竜の\n- iLv11 星鋼の\n\nBaseItemのレアリティはNORMAL固定。\n完成装備のレアリティはItem Generation側。\n\n---\n\n# 4. 武器BaseItem\n\n## 4.1 要求値\n\n```text\nrequired_str = iLv × STR係数\nrequired_dex = iLv × DEX係数\nrequired_int = iLv × INT係数\n```\n\n要求値は装備可否判定専用。\n\n## 4.2 基礎性能\n\nV9正本の生成思想を継承し、後工程で確定した正式fieldへ接続する。\n\n```text\nattack\n= required_str × attack係数\n\naccuracy\n= required_dex × accuracy係数\n\nmagic_weapon_bonus\n= required_int × magic算出係数\n```\n\nV9初期値:\n- attack係数 = 2\n- accuracy係数 = 2\n- V9の魔法上昇力式 = `INT要求閾値 × STR係数`\n\nただし係数はBalance Configへ分離し、コード固定しない。\n\n正式field名:\n- `attack`\n- `accuracy`\n- `magic_weapon_bonus`\n- `base_critical_rate`\n\n基礎クリティカル率5%は**武器側からBattleへ持ち込む正式な戦闘寄与値**として採用する。\n\n```text\nbase_critical_rate = 0.05\n```\n\nこれはBattle側の共通初期Critical 5%ではなく、武器BaseItem由来の値。\nEquipment Contributionを経由してBattleへ渡す。\n\nBattle側でSTR/LUK等から再計算しない。\nCritical Damage倍率とは別概念として扱う。\n\n## 4.3 武器係数\n\n- 片手剣 STR6 / DEX3 / INT1\n- 大剣 STR12 / DEX3 / INT1\n- 短剣 STR3 / DEX6 / INT1\n- 片手斧 STR6 / DEX3 / INT1\n- 大斧 STR12 / DEX3 / INT1\n- 槍 STR6 / DEX3 / INT1\n- 弓 STR3 / DEX6 / INT1\n- 大弓 STR6 / DEX3 / INT1\n- 杖 STR3 / DEX1 / INT6\n- ワンド STR1 / DEX3 / INT6\n- 魔導書 STR1 / DEX3 / INT6\n- 盾 STR6 / DEX3 / INT1\n- 矢筒 STR3 / DEX6 / INT1\n\n杖タグ: `WEAPON_STAFF`\n\n---\n\n# 5. 防具BaseItem\n\n防具要求系統は武器と分離する。\n\n正式要求field:\n- `required_vit`\n- `required_mnd`\n- `required_agi`\n\nV9カテゴリ:\n- 重装: VIT6 / MND3 / AGI1\n- スカウト: AGI6 / VIT3 / MND1\n- ローブ: MND6 / INT3 / VIT1\n\n正式確定:\n防具の要求ステータス系統は **VIT / MND / AGI** とする。\n\n正式field:\n- `required_vit`\n- `required_mnd`\n- `required_agi`\n\nV9ローブに記載されていた `MND6 / INT3 / VIT1` のINT要求は旧仕様として不採用。\n正式Generatorでは防具要求値としてINTを使用しない。\n\n各防具カテゴリ/部位の係数テーブルも、VIT / MND / AGIの3系統へ統一して管理する。\n\n正式BaseItem性能:\n- `hp_bonus`\n- `mp_bonus`\n- `evasion`\n\nBattle RuntimeでVIT/MND/AGIから再計算しない。\n\n---\n\n# 6. 防具iLv追加成長\n\n攻撃Skill等のインフレに追従できるよう、防具性能は要求閾値とは別に追加成長を持てる。\n\n```text\n基礎性能\n= 要求閾値 × 装備/部位係数\n\n最終BaseItem基礎性能\n= 基礎性能 × categoryGrowthMultiplier\n```\n\n防具は初期状態から有効。\n\n個別設定:\n```text\narmor_growth:\n  hp: iLv別設定\n  mp: iLv別設定\n  evasion: iLv別設定\n```\n\n武器側にも同じ拡張点を持てるが初期運用は `1.0` / disabled相当。\n通常UIでは不要な武器Growth設定を露出させない。\n\n---\n\n# 7. Generation Rules / Balance Config\n\nGeneration Rules:\n- 計算順序\n- 入出力\n- 武器/防具分岐\n- 必須データ\n- 検証ルール\n\nBalance Config:\n- 要求閾値係数\n- 武器/防具係数\n- 基礎性能倍率\n- 防具Growth\n- Clamp\n- 丸め\n- 検証閾値\n- 将来のItem Generation用係数\n\n最低metadata:\n- `config_id`\n- `config_version`\n- `status`\n- `created_at`\n- `updated_at`\n\nstatus:\n- draft\n- testing\n- active\n- archived\n\n正規生成は用途ごとに原則1 Active Config。\n\n---\n\n# 8. generation metadata / 再現性\n\n生成物は少なくとも以下を追跡可能にする。\n\n- generator_version\n- generation_rules_version\n- config_id\n- config_version\n- source_spec_version\n- seed\n- base_item_type / base_item_id\n- item_level\n- generated_at\n\n必要に応じて:\n- generation_input\n- calculation_trace\n\n同一入力 + 同一seed + 同一generator_version + 同一Configで同一結果を再現できることを目標とする。\n\nBalance Config更新で既存Equipmentを自動上書きしない。\n\n---\n\n# 9. Generator Validator\n\n```text\nGenerator Validator\n├─ Structural Validation → Error / 停止\n└─ Balance Validation    → 原則Warning\n```\n\nStructural:\n- BaseItem不存在\n- iLv不正\n- Config不存在/status不正\n- Rules/Config互換不一致\n- 係数欠落\n- NaN/Infinity\n- required_* \u003c 0\n- 必須Tag/性能欠落\n- stat/combat parameter混同\n- armor growth設定欠落\n- generation metadata欠落\n\nBalance:\n- attack等の想定レンジ逸脱\n- hp/mp/evasion成長異常候補\n- clamp到達等\n\nBalance閾値はコード固定せずConfig化する。\n\n---\n\n# 10. Equipment Consumer Contract\n\n要求値は装備可否専用。\n\n戦闘性能:\n- `attack`\n- `accuracy`\n- `magic_weapon_bonus`\n- `base_critical_rate`\n- `hp_bonus`\n- `mp_bonus`\n- `evasion`\n\n禁止:\n- base_attack\n- base_defense\n- 旧単一 defense\n- Equipment STR/DEX/INT/VIT/MND/AGIの直接戦闘加算\n- 旧equipmentBonus()\n- 旧field fallback\n\n---\n\n# 11. Equipment Contribution / MOD境界\n\nBaseItem保存値はMODで上書きしない。\n\n```text\nBaseItem Performance\n↓\nEquipment Contribution\n↓\nEquipment MOD\n↓\nModified Equipment Contribution\n↓\nRuntime\n```\n\nEquipment性能MODの確定式:\n\n```text\nFinal\n= Base\n+ (Base × Percent合計)\n+ Flat合計\n```\n\n例:\nBase attack 100 / +10% / +5 → 115\n\n対象:\n- attack\n- accuracy\n- magic_weapon_bonus\n- hp_bonus\n- mp_bonus\n- evasion\n\n`base_critical_rate = 5%` は武器由来の正式戦闘寄与値としてContributionを経由する。\n基礎5%自体は武器BaseItemで確定し、Battle側でLUK等から生成しない。\nCritical率へ作用する追加MODの詳細はCritical/MOD正本へ委譲する。\n\nDamage MOD / Defense MODは別Pipelineへ委譲する。\nEquipment仕様からCombat MOD全体を再設計しない。\n\n---\n\n# 12. Battle/Game旧デモ処理\n\n旧デモは互換維持しない。\n\n削除/置換対象:\n- hard-coded EQUIPMENT\n- equipmentBonus()\n- STR→attack\n- VIT→maxHp\n- STR→accuracy\n- LUK→critical\n- Equipment AGI直接加算\n- defense / defenseCoefficient\n- base_attack / base_defense\n- Equipment名ベースlookup\n- 旧Battle sampleの数値解釈\n\n再利用可能:\n- Equipment ID参照構造\n- Master lookup\n- inventory概念\n- 装備枠UI\n- 装備/解除操作\n\n正式参照:\n`equipment_id → Equipment Dataset → Equipment Record`\n\n---\n\n# 13. AI START正式接続\n\n## 13.1 AI STARTの既存絶対ルールを維持\n\n既存AI START:\n- 1回につき1カテゴリwritable\n- read_onlyは変更しない\n- 正式IDを推測しない\n- 前工程確定データを勝手に変更しない\n- 不足カテゴリは該当工程へ戻す\n- Runtime確定仕様をAI側で再設計しない\n\nEquipmentでも同じ原則を適用する。\n\n## 13.2 Equipment工程をAI STARTへ追加\n\nAI STARTの工程別ルーティングにEquipmentを追加する。\n\n```text\n対象カテゴリ = equipment\n↓\nEquipment生成工程を読む\n↓\nAIが生成意図を作る\n↓\nStudio Equipment Generatorへ入力\n↓\nStudioが正式計算\n↓\nValidator\n↓\nPreview\n↓\nCommit\n↓\nData Exchange\n```\n\n## 13.3 AIとStudioの責務\n\nAI:\n- どの装備を作るか\n- BaseItem候補\n- iLv / iLv帯\n- 必要なら狙うMOD方向性（Item Generation工程時）\n\nStudio:\n- 要求閾値計算\n- BaseItem性能計算\n- Balance Config適用\n- Growth適用\n- calculation trace\n- Validator\n- generation metadata\n- Preview\n- 保存\n\n**AIがattack / accuracy / hp_bonus等の正式数値を独自計算して正規データとして提出しない。**\n\n## 13.4 Data Exchange\n\nEquipment工程では `equipment` のみwritable。\n参照が必要なTag/MOD/その他Masterはread_only。\n\n存在しないTag/MOD IDをAIが推測生成しない。\n別カテゴリの追加が必要なら、そのカテゴリ工程へ戻る。\n\n## 13.5 AI START追加マニュアル案\n\n既存の:\n`00_AI_START → 01_共通生成規則 → 対象工程 → JSON出力 → 提出前チェック`\n\nを維持し、対象工程として\n`09_EQUIPMENT生成.md`\nを追加する。\n\nEquipment工程はGolden Sample/Studio Schemaが確定した時点で\nEquipment専用Golden Sampleを追加する。\n\n---\n\n# 14. Studio実装順\n\n1. Generation Rules / Balance Config\n2. BaseItem Generator\n3. calculation trace\n4. 単体生成UI\n5. Generator Validator\n6. Preview → Commit\n7. Equipment Master保存/Data Exchange\n8. Balance Simulation\n9. 一括生成\n10. AI START接続\n11. Item Generation\n12. Loot/Drop\n\n単体生成・一括試算・一括生成・AI生成は同じGenerator Engineを使う。\n\n---\n\n# 15. 現行Studioソース監査\n\n2026-08-10提供Studioには旧デモEquipment解釈が残っている。\n\n確認例:\n- Battle説明にHP/MP/攻撃/防御/AGI等の旧一括加算記述\n- `normalizeBattleUnits()`系に旧stats解釈\n- `BATTLE_FORMULA_DEFAULTS` にSTR命中係数 / defenseCoefficient等\n- `seedEquipmentBattleSample()` に旧defense/status_resist等\n- Design Card Equipment例に旧magic_damage_bonus\n- Character Cardに旧attack/defense等\n- Equipment参照時に旧statsを直接加算\n\nしたがって現行Studioは**仕様統合済みではない**。\n本書を実装正本として、旧Equipment consumerを削除/置換する必要がある。\n\n---\n\n# 16. 確定済み差分と残課題\n\n## 今回解消した差分\n\n1. 防具要求ステータスは `VIT / MND / AGI` を正式採用。\n   - V9ローブのINT要求は旧仕様として不採用。\n2. 武器の基礎クリティカル率5%を正式採用。\n   - 武器側からEquipment Contributionを経由してBattleへ持ち込む。\n   - Battle共通初期値として生成しない。\n   - STR/LUK等から再計算しない。\n\n## 残課題\n\n1. アクセサリBaseItemの現行Generator対象範囲\n2. `magic_weapon_bonus` の魔法Runtime最終接続（Runtime未完成）\n3. 状態異常耐性は将来MOD側から流すためBaseItem初期対象外\n4. Defense/Damage/Critical MODの詳細はV9各MOD正本へ委譲\n\nこれらは推論で埋めず、該当工程または正本参照で解消する。\n\n\n===== PACKAGE_MANIFEST.json =====\n{\n  \"package\": \"Equipment完全統合仕様_AI_START接続_v1.1\",\n  \"files\": [\n    {\n      \"path\": \"00_Equipment完全統合仕様_v1.1.md\",\n      \"sha256\": \"090c0ba812f4aeafac0400099224b4a86d79e97e457516c7b8203e433f72153a\"\n    },\n    {\n      \"path\": \"01_AI_START_09_EQUIPMENT生成_Draft_v1.md\",\n      \"sha256\": \"8ffec56a0bb620010cfaaa198a24bc8522458d0b7379b6ba9a3df451de34b92d\"\n    },\n    {\n      \"path\": \"02_現行Studio_Equipment差分監査.md\",\n      \"sha256\": \"4ae6f4d1ebea4355ff43257500ef3725e60f1dc83bbdfeaab9d62b9d78541b99\"\n    },\n    {\n      \"path\": \"03_差分決定台帳.md\",\n      \"sha256\": \"bf6e7e995d46900d7bc321b57e5b9f71376aa776fe3f3e908261329ccea8c82c\"\n    },\n    {\n      \"path\": \"CHANGELOG_v1.1.md\",\n      \"sha256\": \"383146de7dcddf545480d688250312333739bef59bf5da07f15c7a89f232c2bb\"\n    },\n    {\n      \"path\": \"README.md\",\n      \"sha256\": \"571af896a5a1ee313f6ee12aa8cf3ad62087d48763691e361ba11c327196b6e8\"\n    },\n    {\n      \"path\": \"references/06_装備統合仕様書_Version2.1.txt\",\n      \"sha256\": \"f76aabfcf1615e3a026f68fabc8ef54a0ab8f4b91e07e561b3da801272dceccc\"\n    },\n    {\n      \"path\": \"references/Equipment実装前仕様確定_Phase8(1).zip\",\n      \"sha256\": \"dbb6c811c8a87413fc90129a9d8519735b97db7f38f9404a4c148a8d0ec3e89b\"\n    },\n    {\n      \"path\": \"references/GKS_AI_START正式生成マニュアル_v1.zip\",\n      \"sha256\": \"5607bbd57b9bc0879e009b52c733aa3fea4a1192e7cab07f691dd2f4d066a376\"\n    },\n    {\n      \"path\": \"references/Phase6_装備生成パイプライン_統合完全解析資料_v1.1.zip\",\n      \"sha256\": \"6b70a870ecae8b963b388f1811444962d37f0fa3eae45d4011af31e6bf420f9b\"\n    },\n    {\n      \"path\": \"references/Studio_装備生成パイプライン_ロードマップ_Draft_v0.5.md\",\n      \"sha256\": \"5fa5e17974903505fd5b0aad252657a6cdb08427e8ffdfaa4962f5da14173ac1\"\n    }\n  ]\n}","decision_refs":["DEC-V9-EQUIP-001","DEC-V9-EQUIP-002","DEC-V9-EQUIP-003","DEC-V9-EQUIP-004","DEC-V9-EQUIP-005"],"depends_on":["SPEC-V9-0027","SPEC-V9-MOD-INTEGRATED-001"],"acceptance_criteria":"原資料の確定事項と残課題を状態変更せず保持し、V9 baselineとの差分根拠として参照できる。","approved_by":"Equipment package v1.1","approved_at":"2026-08-19T09:46:00+09:00","created_at":"2026-08-19T09:46:00+09:00","updated_at":"2026-08-19T09:46:00+09:00"},{"id":"SPEC-V9-EQUIP-INTEGRATED-001","title":"[EQUIP][INTEGRATION CANDIDATE] V9＋Equipment v1.1 最新版統合候補","status":"Review","summary":"V9装備Version2.1へ後発Equipment v1.1を統合。アミュレットは通常MOD主体＋能力値MODレア枠、Critical 5%は可変Baseline、初期Generatorはアクセサリを含む方針までHuman確定済み。","body":"【位置付け】\nV9 Library v2.0の装備統合仕様 Version2.1をBaselineとし、後発正本 Equipment完全統合仕様 v1.1を差分統合した最新版候補。\nV9原文は変更せず保持する。\n\n【1. 生成責務】\nEquipment生成は3層に分離:\n1. BaseItem Generation\n2. Item Generation\n3. Loot / Drop\n初期実装中核はBaseItem Generation。\nMOD・レアリティ・Tier・Drop率は別工程境界を維持する。\n\n【2. 要求値と戦闘性能の分離】\n要求値は装備可否判定専用。\nEquipmentのSTR/DEX/INT/VIT/MND/AGI要求値をBattle性能へ直接加算しない。\n\n武器要求:\n- required_str\n- required_dex\n- required_int\n\n防具要求:\n- required_vit\n- required_mnd\n- required_agi\n\nV9ローブのINT要求は後発v1.1により旧仕様として不採用。\n\n【3. 正式Consumer field】\n武器:\n- attack\n- accuracy\n- magic_weapon_bonus\n- base_critical_rate\n\n防具:\n- hp_bonus\n- mp_bonus\n- evasion\n\n廃止/禁止:\n- 旧単一 defense\n- base_attack / base_defense\n- Equipment能力値のBattle直接加算\n- 旧equipmentBonus()\n- 旧field fallback\n- Equipment名ベースlookupによる旧数値解釈\n\n【4. Generation Rules / Balance Config】\nGeneration Rules:\n- 計算順序\n- 入出力\n- 武器/防具分岐\n- 必須データ\n- 検証ルール\n\nBalance Config:\n- 要求閾値係数\n- 武器/防具係数\n- 基礎性能倍率\n- 防具Growth\n- Clamp\n- 丸め\n- 検証閾値\n- 将来Item Generation用係数\n\nBalance値はコードへ直書きせずConfig管理する。\n正規生成は用途ごとに原則1 Active Config。\n\n【5. generation metadata / 再現性】\n追跡候補:\n- generator_version\n- generation_rules_version\n- config_id / config_version\n- source_spec_version\n- seed\n- base_item_type / base_item_id\n- item_level\n- generated_at\n- 必要に応じ generation_input / calculation_trace\n\nBalance Config更新で既存Equipmentを自動上書きしない。\n\n【6. Generator Validator】\nStructural ValidationはError/停止。\nBalance Validationは原則Warning。\nBalance閾値はConfig化する。\n\n【7. Equipment Contribution】\nBaseItem保存値をMODで上書きしない。\n\nBaseItem Performance\n→ Equipment Contribution\n→ Equipment MOD\n→ Modified Equipment Contribution\n→ Runtime\n\nEquipment性能MOD:\nFinal = Base + (Base × Percent合計) + Flat合計\nPercentはBaseだけへ作用しFlatへ再適用しない。\n同一target / operationは集約する。\n\n【8. MOD domain境界】\nMOD domain:\n- equipment\n- damage\n- defense\n\nequipment domainはEquipment Contributionへ作用。\ndamage domainはDamage Pipelineへ作用。\ndefense domainはDefense/Damage Resolutionへ作用。\n全domainを同一数式へ強制せず、最終計算式はtarget側正式仕様へ従う。\n\n【9. AI START】\nEquipment工程をAI STARTへ追加。\nequipmentのみwritable。\nTag / MOD / Stats / Requirements / Balance Config / Rules等はread_only参照。\n\nAIが指定可能:\n- 装備カテゴリ/種別\n- BaseItem候補\n- iLvまたはiLv帯\n- 生成数\n- Item Generation接続後のMOD方向性希望\n\nAIが正式数値として独自決定しない:\n- required_*\n- attack / accuracy / magic_weapon_bonus\n- base_critical_rate\n- hp_bonus / mp_bonus / evasion\n- Growth結果\n- Config係数\n\n正規経路:\nAI request\n→ Studio Generator\n→ Generation Rules\n→ Active Balance Config\n→ BaseItem calculation\n→ Validator\n→ Preview\n→ Commit\n→ Equipment Master\n\n【10. 旧Studio互換】\n旧デモ互換は不要。\n再利用可能:\n- Equipment ID参照構造\n- Master lookup\n- inventory概念\n- 装備枠UI\n- 装備/解除操作\n\n数値解釈は正式Consumer Contractへ置換する。\n\n【11. Human確定事項】\nA. アミュレット\n- 旧『能力値MOD専用』は廃止。\n- 基本は通常MODを持つ装備。\n- 能力値MODはレア枠として持てるが確定付与ではない。\n- 能力値MODの出現率・効果量等はBalance/Generator側で可変。\n\nB. base_critical_rate\n- 現行Baselineは0.05（5%）。\n- 5%は仮の基準値。\n- 固定値にはせずBalance Configで可変。\n\nC. アクセサリGenerator範囲\n- 初期BaseItem Generatorにアミュレット・指輪・ベルトを含める。\n\n【12. 現時点の扱い】\n上記3点はHuman判断により確定。\nEquipment v1.1のその他の確定構造差分と合わせて最新版候補へ採用する。\n","decision_refs":["DEC-V9-EQUIP-001","DEC-V9-EQUIP-002","DEC-V9-EQUIP-003","DEC-V9-EQUIP-004","DEC-V9-EQUIP-005","DEC-V9-EQUIP-006","DEC-V9-EQUIP-007","DEC-V9-EQUIP-008"],"depends_on":["SPEC-V9-0027","SPEC-V9-EQUIP-SRC-V11","SPEC-V9-MOD-INTEGRATED-001"],"acceptance_criteria":"V9装備原文を保持している。\n後発Equipment v1.1の確定構造差分を反映している。\n旧field/旧Battle直接加算を最新版候補から除外している。\nEquipment ContributionとMOD domain境界を反映している。\nAI STARTのGenerator委譲を反映している。\nHuman未確認3点を正式採用へ自動昇格していない。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:46:00+09:00","updated_at":"2026-08-19T09:48:00+09:00"},{"id":"SPEC-V9-SKILL-SRC-FORMAL555","title":"[POST-V9][FORMAL] GKS-B555 新スキルシステム正式化方針","status":"Approved","summary":"Formal Skill/Compiler/runtimeContracts/Skill Master/Formal Runtimeへ一本化し、Generic/Legacy/旧Tag Runtime/旧Demo/Fallbackを移行完了後に完全除去する正式化方針。","body":"【Source Package】\nfile: GKS-B555_NEW_SKILL_SYSTEM_FORMALIZATION_PLAN_LEGACY_ZERO(1)(4).zip\nsha256: e4c7385cbee85768f3502493af203a01ca36578d2737c53cbb4297320aef774e\nrole: post-V9 formal source\n\n# GKS-B555 新スキルシステム正式化方針\n\n基準: guild-adventure-studio-main(20260812-222809)\n\n## 目的\n\n旧Generic/Legacyとの互換維持を目的にした継ぎ足しではなく、\n新スキル仕様を正式仕様として Studio / Compiler / Skill Master / Runtime / Test の中心に据える。\n\n最終目標は次の一本化された経路である。\n\n    正式Skill\n      -\u003e 正式Skill Compiler\n      -\u003e 正式Compiled Skill / runtimeContracts\n      -\u003e Skill Master\n      -\u003e 正式Runtime\n\nGeneric / Legacy / 旧Demoは移行完了後に完全除去する。\n\n## 1. 正式Skill Schema\n\n現在G06で使用している次のSkill構造を正式Authoring Schemaの基礎とする。\n\n- schemaVersion\n- id\n- name\n- skillLevel\n- trigger\n- conditions\n- target\n- effects\n- resource\n\n未知フィールドを場当たり的に例外追加する方式にはしない。\n正式SchemaとRegistryを正本にし、Studioの生成・読込・検証はすべて同じ定義を使用する。\n\n旧名称:\n- GKS_GENERIC_SKILL_BATCH\n- skill-generic-registry.json\n- Generic Skill\n\nこれらは正式昇格後にGeneric名称を廃止する。\n\n## 2. Skill Master\n\nG07で新Skillを旧Tag Skillへ潰して保存する構造を最終形にしない。\n\nSkill Masterは新Skill仕様または正式Compiled Skillを正式に保持できるSchemaへ移行する。\nMaster側の許可フィールドも正式Schemaから導出し、個別の未知フィールド例外を増やさない。\n\n## 3. Compilerを正式Native化\n\n正式Compilerは新Skillを直接入力とし、旧Tag/Legacy形式を経由しない。\n\n正式Compiler経路から完全排除し、移行完了後に関連実装も削除するもの:\n- legacySkill\n- genericRuntime\n- legacyCompile\n- compileForLegacy\n- compileTaggedSkill\n- Legacy Adapter\n- Legacy Fallback\n\n正式Compilerは legacySkill を生成しない。\n正式Compilerは legacyCompile / compileForLegacy / compileTaggedSkill を呼び出さない。\n正式出力のRuntime契約は runtimeContracts のみとし、Generic/Legacy互換aliasを正式仕様へ含めない。\n\n## 4. Runtime\n\n正式Runtimeは runtimeContracts を直接実行し、Legacyを一切参照しない。\n\n移行完了時に完全除去するもの:\n- runtimeContracts ?? genericRuntime のfallback\n- genericRuntime\n- Legacy Adapter / Legacy Fallback\n- 旧Demo Runtime / Bridge\n- 旧Tag Runtimeへの必須依存\n\nCOVER / COUNTER / APPLY / origin / derived_generation / lifecycle等も\n正式runtimeContractsを唯一の正本として実行・検証する。\n\n## 5. Studio\n\nStudioのG06/G07を新スキル正式仕様へ統合する。\n\n- 「Generic Skill生成」から正式「Skill生成」へ昇格\n- 正式Skill Schemaを生成\n- 同じ正式SchemaでImport/Validation\n- 正式Compilerへ直接渡す\n- 正式Skill Masterへ登録\n- Generic固有の名称・schema・APIを最終的に除去\n\n## 6. Test\n\n新仕様の回帰を先に成立させる。\n\n必要な順序:\n1. 正式Skill Schema回帰\n2. Studio生成/Import回帰\n3. 正式Compiler回帰\n4. Skill Master登録/再読込回帰\n5. runtimeContracts Native Runtime回帰\n6. 実機正式運用回帰\n7. 旧Generic/Legacyを無効化した状態でFull回帰\n8. 旧Generic/Legacyファイルの物理削除\n\n旧R04/R05等の移行期テストは、新正式回帰で同等以上を確認してからrelease gateを退役させる。\n新仕様のテストを旧仕様に合わせて書き換えることはしない。\n\n## 7. 削除対象\n\n正式経路完成後に参照を確認して削除する。\n\n- generic-* 実装\n- GKSGeneric* API\n- genericRuntime\n- legacySkill\n- legacyCompile\n- compileForLegacy\n- compileTaggedSkill\n- Legacy Adapter / Legacy Fallback\n- Generic移行期テスト\n- Legacy用テスト\n- 旧Demo専用Runtime / Bridge\n- Generic / Legacy名称のschema / config / UI表示 / API\n\n保護領域を含む物理削除は、既存Studioの二段階削除承認方式に従う。\n\n## 8. 移行完了の最終条件\n\n移行完了は次をすべて満たした場合に限る。\n\n- 正式RuntimeはLegacyを一切参照しない。\n- legacySkillを生成しない。\n- legacyCompileを使わない。\n- compileForLegacyを使わない。\n- compileTaggedSkillを正式新スキル経路で使わない。\n- Legacy Adapter / Legacy Fallbackを使わない。\n- genericRuntimeを残さない。\n- 旧Demo Runtime / Bridgeを削除する。\n- Legacy用テストは正式回帰へ移行後に削除する。\n- Generic移行期テストは正式回帰へ移行後に削除する。\n- 移行完了後の成果物にLegacyコード・API・fallback・名称を残さない。\n- 完成形は「正式系 + Legacy互換層」ではなく、正式新スキル系のみとする。\n\n## 9. 実装原則\n\n- 互換処理を新規追加して問題を隠さない。\n- 未知フィールドを個別許可する小手先対応をしない。\n- 正式Schemaを正本として各層を合わせる。\n- 新正式経路を先に完成させ、実機回帰後に旧経路を削除する。\n- 移行完了後の成果物にLegacyコード・API・fallback・名称を残さない。\n- 削除前に完全一致パスと参照関係を確定する。\n","decision_refs":["DEC-V9-SKILL-001","DEC-V9-SKILL-002"],"depends_on":["SPEC-V9-0023","SPEC-V9-0039"],"acceptance_criteria":"Formal Skill最終経路とLegacy zero条件を原文のまま追跡できる。","approved_by":"Post-V9 GKS-B555 formalization plan","approved_at":"2026-08-19T10:11:00+09:00","created_at":"2026-08-19T10:11:00+09:00","updated_at":"2026-08-19T10:11:00+09:00"},{"id":"SPEC-V9-SKILL-PROCESS-FORMAL-PREFLIGHT","title":"[PROCESS][FORMALIZED] Runtime / Compiler 実装前確認手順","status":"Review","summary":"P01-02の運用原則をFormal構造へ一般化。旧compileTaggedSkill等は採用せず、現行Formal実体の接続・Build・回帰を確認する。","body":"【Source Package】\nfile: ランタイム確認手順(4).zip\nsha256: f9b461c291bf3e74ad362d9afda68f8f555366c451eaded81e284860dffcde5c\nrole: source handoff with legacy-specific names\n\n【原資料の運用原則として継承】\n- Studioから開始し、更新ZIP仕様と現在Buildを確認\n- studio-update.json / package_manifest.json / package-build.json を確認\n- 配置後にCommit / Build / cache回避を確認\n- 実際に使用されるRuntime / Compiler / Skill Master / Registryの位置と接続を確認\n- 検証環境→Game JSON→正式運用回帰の順で全PASSして次工程\n- ロジック変更時はBuild番号、更新ZIP名、cache keyを更新\n\n【Formal化により採用しない原資料記載】\n- compileTaggedSkill\n- executeTaggedSkill\n- resolveTaggedTargets\n- 旧Tag Runtime必須依存\n- その他Legacy固有の関数/ファイルを正式確認対象として固定すること\n\n【適用原則】\n確認対象は毎回『現行BuildでFormal経路が実際に使用している実体』から確定する。\n旧資料に名前があることを理由にLegacy実装を復活させない。\n\n【Source original】\n# 引継ぎ資料：ランタイム・コンパイラ確認手順（P01-02 シールド完了時点）\n\n## 目的\n\n新しいロジック実装前に、実際に使用されるランタイムとコンパイラの位置・接続状態を確認し、検証環境と本編環境の差異を防ぐ。\n\n## 確認手順\n\n### 1. Studioから開始\n\n-   AIスタート\n-   AI引継ぎ\n-   更新ZIP仕様を確認\n-   現在のビルド番号を確認\n\n### 2. 更新ZIP確認\n\n必須: - studio-update.json - package_manifest.json - package-build.json\n\n外側ZIPではなく更新ZIPを使用する。\n\n### 3. GitHub配置\n\n配置完了後 - Commit ID確認 - ビルド番号確認 - キャッシュ回避URLで確認\n\n### 4. ランタイム位置確認\n\nゲーム: - game/assets/js/tag-skill-runtime.js -\ngame/assets/js/battle-control.js - game/assets/js/app-runtime.js -\ngame/assets/js/studio-skill-bridge.js\n\nタグ検証: - game-tag-test/assets/js/tag-skill-runtime.js -\ngame-tag-test/assets/js/validation-runtime.js\n\n共通: - assets/shared/js/game-shell-common.js\n\n### 5. コンパイラ確認\n\n確認項目 - compileTaggedSkill - executeTaggedSkill -\nresolveTaggedTargets - logicOrder生成 - Studio出力読み込み\n\n### 6. 検証順序\n\n1.  タグ検証\n2.  ゲーム側JSON検証\n3.  正式運用回帰\n\nすべてPASS後に次工程へ進む。\n\n### 7. ビルド規則\n\n-   ロジック変更時は必ずビルド番号更新\n-   更新ZIP名にも反映\n-   キャッシュキー更新\n\n例: GA-B486.2 GA-B486.3 GA-B486.4\n\n### 8. P01-02完了条件\n\n-   タグ検証 PASS\n-   ゲーム側JSON PASS\n-   正式運用回帰 PASS\n\nその後P01-03へ進む。\n\n","decision_refs":["DEC-V9-SKILL-004"],"depends_on":["SPEC-V9-SKILL-SRC-FORMAL555"],"acceptance_criteria":"Formal実装前に現行実体を確認し、Legacy固有名を正本へ復活させない。","approved_by":"","approved_at":"","created_at":"2026-08-19T10:11:00+09:00","updated_at":"2026-08-19T10:11:00+09:00"},{"id":"SPEC-V9-TAG-INTEGRATED-001","title":"[TAG][FORMAL INTEGRATION CANDIDATE] V9＋Formal Tag接続","status":"Review","summary":"V9 Tag baselineを保持しつつ、Formal最新版ではLegacy固定Runtime/固定数値タグを継承せず、TagをRegistry定義された汎用の実行命令構築部品としてCompilerへ接続する。","body":"【位置付け】\nV9 Tag SystemはBaseline原本として保持する。\n最新版のSkill実行設計はGKS-B555 Formal方針とHuman判断を優先する。\n\n【1. Legacy除外】\n最新版へ継承しない:\n- ATTACK / DOT等を固定Runtime種別として扱う旧方式\n- DOT_POWER / DOT_DURATION / DOT_INTERVAL等のLegacy限定固定数値タグ/parameter\n- タグから旧Tag Runtimeを直接選び実行する方式\n- compileTaggedSkill等の旧Tag Compiler経路\n- Generic/Legacy互換alias/fallback\n\n必須タグv0.1、システムタグv0.2、タグ式Skillロジック引継ぎはLegacy前提資料として最新版採用元から除外する。\n\n【2. FormalにおけるTag】\nTagは実行命令を組み立てるための汎用部品。\nTag自体が固定処理コードを意味するとは限らない。\n\nTag/Registryが担うもの:\n- 意味の識別\n- 性質/分類\n- 条件/対象/相互作用に使う識別\n- CompilerがFormal Skillを構成・検証するための部品参照\n\n【3. Registry / Schema】\n個別Tagの意味、使用可能場所、parameter Schema、組合せ条件、互換性はFormal Registry / Schemaを正本とする。\n未知要素を旧Legacyキーへfallbackして解決しない。\n\n【4. Compiler】\nFormal Skill + Registry/Schema定義 + 必要parameter\n→ validation / normalization\n→ runtimeContracts\n\nCompilerはLegacy Tag Skillへ変換しない。\nCompilerは旧固定Runtime名を経由しない。\n\n【5. Runtime】\nFormal RuntimeはruntimeContractsを直接実行する。\nTagを見て旧固定処理へdispatchするLegacy方式を使用しない。\n\n【6. 数値】\nRuntimeに数値は必要。\nただしFormal数値はRegistry/Schemaが要求するparameterとして保持し、\nDOT_POWER等のLegacy限定キーを正式仕様として残さない。\nBalance調整値はデータ駆動で可変にする。\n\n【7. 資料未提供領域】\nFormal Tag Registryの個別tag ID / parameter Schema / composition ruleの完成版は今回資料に未収録。\nこれは旧Generic/Legacy定義から復元しない。\n正式Formal資料が追加された時点で別工程として統合する。\n","decision_refs":["DEC-V9-TAG-001","DEC-V9-TAG-002","DEC-V9-SKILL-003"],"depends_on":["SPEC-V9-0026","SPEC-V9-SKILL-SRC-FORMAL555"],"acceptance_criteria":"Legacy固定Runtime/固定数値タグを最新版へ持ち込まない。\nTagをFormal Compiler用の汎用部品として整理する。\n個別Registry詳細を資料なしに捏造しない。","approved_by":"","approved_at":"","created_at":"2026-08-19T10:11:00+09:00","updated_at":"2026-08-19T10:16:00+09:00"},{"id":"SPEC-V9-SKILL-INTEGRATED-001","title":"[SKILL][FORMAL INTEGRATION CANDIDATE] V9＋Formal Skill 最新版候補","status":"Review","summary":"Formal Skill→Formal Compiler→runtimeContracts→Skill Master→Formal Runtimeへ一本化。Legacy固定処理・旧Tag Runtime・Generic/Fallbackを最新版から完全除外する。","body":"【位置付け】\nV9 Skill資料はBaseline原本として保持する。\n最新版のSkill実行正本はFormal新Skill系のみとする。\n\n【1. Formal Authoring Schema基礎】\n- schemaVersion\n- id\n- name\n- skillLevel\n- trigger\n- conditions\n- target\n- effects\n- resource\n\n正式SchemaとRegistryを正本にする。\n未知fieldを場当たり的に例外追加しない。\n\n【2. Formal経路】\nFormal Skill\n→ Formal Skill Compiler\n→ Formal Compiled Skill / runtimeContracts\n→ Skill Master\n→ Formal Runtime\n\n【3. Legacy zero】\n正式経路・最終成果物へ残さない:\n- legacySkill\n- genericRuntime\n- legacyCompile\n- compileForLegacy\n- compileTaggedSkill\n- Legacy Adapter / Legacy Fallback\n- 旧Tag Runtime\n- 旧Demo Runtime / Bridge\n- Generic / Legacy固有schema/API/名称/fallback\n- ATTACK / DOT等の旧限定Runtime dispatch\n- DOT_POWER等のLegacy専用固定parameter/tag体系\n\n【4. Tag / Compiler】\nTagは実行命令を組み立てるための汎用部品。\nFormal Registry / SchemaがTag・effect・condition・target・resource等の意味と許可構造を定義する。\nCompilerはFormal Skillの構造とRegistry定義を検証・正規化してruntimeContractsを生成する。\n\n【5. 数値】\nFormal Runtimeでも数値parameterは必要。\n数値の意味・型・必須性はFormal Schema/Registryの各構造で定義する。\n旧DOT_POWER等へ固定しない。\nBalance値は可変データとして扱い、検証済みparameterをCompilerがruntimeContractsへ含める。\n\n【6. Runtime】\nFormal RuntimeはruntimeContractsのみを実行正本とする。\nCOVER / COUNTER / APPLY / origin / derived_generation / lifecycle等も、個別Legacy Runtimeへ戻さずruntimeContractsの契約として実行・検証する。\nTag/Legacy dataを直接読んで旧固定処理を選ばない。\n\n【7. Skill Master】\nFormal SkillまたはFormal Compiled Skillを正式保持できるSchemaへ合わせる。\nLegacy Tag Skillへ潰して保存する方式を最終形にしない。\n\n【8. Studio】\n- Formal Skill Schemaで生成/Import/Validation\n- Formal Compilerへ直接接続\n- Formal Skill Masterへ登録\n- Registry定義とSchemaをUI/Validationの正本にする\n- Legacy互換処理で不足fieldを補わない\n\n【9. Test / Migration完了】\nFormal Schema\n→ Studio生成/Import\n→ Formal Compiler\n→ Skill Master登録/再読込\n→ runtimeContracts Native Runtime\n→ 実機正式運用\n→ Legacy無効状態Full回帰\nの順で同等以上の回帰を成立させる。\n\n移行完了後はLegacy/Genericファイル・test・API・fallback・名称を残さない。\n\n【10. 実装前確認】\n実装前に現行BuildのFormal Runtime / Compiler / Registry / Skill Master実接続を確認する。\n旧資料記載のcompileTaggedSkill等は確認対象へ復活させない。\n\n【11. 資料未提供領域】\nFormal Registryの個別effect / condition / target / trigger / resource / Tag定義とparameter Schemaの完成版は今回資料に未収録。\nGeneric/Legacy移行期のRegistryをFormal完成版として転用しない。\n後発Formal資料が届くまで詳細は未統合として保持する。\n","decision_refs":["DEC-V9-TAG-001","DEC-V9-TAG-002","DEC-V9-SKILL-001","DEC-V9-SKILL-002","DEC-V9-SKILL-003","DEC-V9-SKILL-004"],"depends_on":["SPEC-V9-0023","SPEC-V9-0039","SPEC-V9-0040","SPEC-V9-SKILL-SRC-FORMAL555","SPEC-V9-TAG-INTEGRATED-001"],"acceptance_criteria":"Formal Skill最終経路を明記する。\nLegacy/Generic/旧Tag Runtime/固定DOT等を最新版へ継承しない。\nRuntime数値をFormal parameterとして保持する。\n個別Registry detailを資料なしに捏造しない。","approved_by":"","approved_at":"","created_at":"2026-08-19T10:11:00+09:00","updated_at":"2026-08-19T10:16:00+09:00"},{"id":"SPEC-V9-SKILL-SOURCE-AUDIT-001","title":"[AUDIT] Formal Tag / Skill Registry 資料充足確認","status":"Approved","summary":"Formal構造は確認可能だが、個別Tag ID / parameter Schema / Registry完成版は現資料に未収録。Generic/Legacy実装からの逆生成を禁止する。","body":"【確認対象】\n- GKS-B555 新スキルシステム正式化方針\n- 最新ロードマップ\n- G07 Stage1 Master Registration update\n- P01-02 Runtime / Compiler確認手順\n- 既存V9 Tag / Skill baseline\n\n【確認できたFormal項目】\n- Authoring Schema基礎:\n  schemaVersion / id / name / skillLevel / trigger / conditions / target / effects / resource\n- Formal Skillを直接入力するFormal Compiler\n- Formal出力はruntimeContractsのみ\n- Skill MasterはFormal SkillまたはFormal Compiled Skillを正式保持\n- Formal RuntimeはruntimeContractsを直接実行\n- Legacy / Generic /旧Tag Runtime / fallback / aliasを移行完了後に残さない\n- COVER / COUNTER / APPLY / origin / derived_generation / lifecycle等も\n  別Legacy RuntimeではなくruntimeContractsを唯一の正本として実行・検証する\n\n【現在資料に存在しないFormal完成定義】\n- 個別Formal Tag ID一覧\n- Formal Tag Registry完成Schema\n- 各Tagのparameter Schema\n- Tag composition / conflict / required ruleのFormal完成版\n- 各effect / trigger / condition / target / resource RegistryのFormal昇格後完成版\n\n【採用禁止】\nGeneric移行期のRegistryや旧Tag Runtime定義を、\n名前だけ変更してFormal仕様として再採用しない。\n\n【扱い】\n不足部分は推測しない。\n後発Formal資料が提供された時点で個別機能として統合する。\n","decision_refs":["DEC-V9-TAG-001","DEC-V9-TAG-002","DEC-V9-SKILL-001","DEC-V9-SKILL-002"],"depends_on":["SPEC-V9-SKILL-SRC-FORMAL555","SPEC-V9-TAG-INTEGRATED-001","SPEC-V9-SKILL-INTEGRATED-001"],"acceptance_criteria":"Formal資料で確認できる範囲と未提供範囲を分離し、Generic/LegacyからFormal詳細を捏造しない。","approved_by":"Source audit","approved_at":"2026-08-19T10:16:00+09:00","created_at":"2026-08-19T10:16:00+09:00","updated_at":"2026-08-19T10:16:00+09:00"},{"id":"SPEC-V9-AI-SRC-20260811-IMPL","title":"[POST-V9][HISTORY] Studio正式AIシステム構築方針 2026-08-11","status":"Superseded","summary":"GKS-B527時点。AI部品Master→Program→Validator→Compiler→Battle検証→Export→Game実行の構築方針。8/16 Formal AIチップUI仕様より前段の設計根拠。","body":"file: Studio_AI_implementation_plan_2026-08-11(3).zip\nsha256: 27a3cd307f88215515eedee9edb7b23a160385b5c9b610168412c4c4497d6362\nbaseline: GKS-B527\nrole: historical design plan\nkey_points: AI master/program/runtime/trace分離、既存Studio資産再利用、AI判断とBattle実行責務分離、Validator/Compiler/Decision Engine/Trace/Export新規実装方針。","decision_refs":["DEC-V9-AI-005"],"depends_on":["SPEC-V9-0021"],"acceptance_criteria":"8/11前段設計を履歴として追跡でき、8/16正式UI仕様より優先しない。","approved_by":"","approved_at":"","created_at":"2026-08-19T10:29:00+09:00","updated_at":"2026-08-19T10:29:00+09:00"},{"id":"SPEC-V9-AI-SRC-20260811-ROADMAP","title":"[POST-V
