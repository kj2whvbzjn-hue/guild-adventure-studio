"title":"V9 document_manifestと実ファイルの参照差異","status":"Open","summary":"document_manifest 39件のうち12件は現在ZIPにsource_pathが存在しない。","body":"V9ライブラリの管理索引と現在ZIPの実ファイルを比較した結果、下記source_pathは存在しない。類似タイトルの別ファイルへ自動対応付けはしない。\n- DOC-009: 01_最新版/03_戦闘_AI/03_Enemy_Budget設計書_Version1.0.txt\n- DOC-011: 01_最新版/03_戦闘_AI/03_戦闘・スキル・AI設計書_Version3.3.txt\n- DOC-027: 01_最新版/10_クエスト_イベント_ギルド/10_ギルド施設システム設計書_Version1.0.txt\n- DOC-028: 01_最新版/99_未統合_要確認/04_BUFFシステム設計書_Version1.0.txt\n- DOC-029: 01_最新版/99_未統合_要確認/09_ボスデータベース_Version1.0.txt\n- DOC-030: 02_統合済み/01_V6参照元/03_戦闘計算式設計書_Version1.0.txt\n- DOC-031: 02_統合済み/01_V6参照元/06_武器データベース_Version1.0.txt\n- DOC-032: 02_統合済み/01_V6参照元/06_装備生成アルゴリズム_Version1.0.txt\n- DOC-033: 02_統合済み/01_V6参照元/10_クエスト定義生成システム_Version1.0.txt\n- DOC-037: 03_派生仕様/01_予算_数値表/07_ユニーク生成アルゴリズム_Version1.0.txt\n- DOC-040: 03_派生仕様/04_MOD分冊/07_ユニークMOD詳細_Version3.0.txt\n- DOC-041: 03_派生仕様/04_MOD分冊/07_ユニーク専用MOD体系_Version2.0_旧版.txt","open_questions":"各欠損参照は、旧パス・改名・統合済み・実ファイル欠落のどれか。機能別精査時にHuman確認する。","conclusion":"","related_discussion_ids":[],"artifact_note":"00_マスター/03_AI知識ベース/document_manifest.json","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"DISC-V9-0002","title":"V9未統合・要確認資料の扱い","status":"Open","summary":"V9未確定事項台帳にはDOC-028 BUFF、DOC-029 ボスDBが正式採用として断定しない対象として記録されている。","body":"V9原本の未確定事項台帳をそのまま継承する。後発資料と精査するまで正式採用へ昇格しない。","open_questions":"BUFF仕様とボスDBの最新確定資料が後発資料側に存在するか確認する。","conclusion":"","related_discussion_ids":[],"artifact_note":"00_マスター/03_AI知識ベース/未確定事項台帳.md","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"}],"decisions":[{"id":"DEC-V9-0001","title":"V9ライブラリ v2.0を統合原本として固定する","status":"Approved","text":"V9ライブラリ v2.0を変更前Baselineとして固定し、後発確定資料は機能単位でV9との差分を精査して追加・変更する。原本v2.0は直接改変しない。","rationale":"全追加資料を一括混在させず、各機能の基準と変更根拠を追跡可能にしたまま最新版ライブラリを作るため。","source_discussion_ids":[],"approved_by":"Human","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"DEC-V9-0002","title":"個別機能の統合完了後に全体ライブラリを出力する","status":"Approved","text":"V9取り込み後、個別機能ごとに後発資料を精査・統合し、最後に機能間整合を確認してV9 Library vNextを別出力する。","rationale":"作業途中でも現在地と統合済み範囲を明確にし、誤った一括統合を避けるため。","source_discussion_ids":[],"approved_by":"Human","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"DEC-V9-MOD-001","title":"MOD接続仕様 v0.4を後発構造仕様の最新版候補として扱う","status":"Approved","text":"MOD接続仕様の系列v0.1→v0.2→v0.3→v0.4について、v0.4を後発構造仕様の最新版として採用し、v0.1〜v0.3は履歴・根拠資料として保持する。","rationale":"各版が前版からの更新点と継承事項を明示し、v0.4がv0.3までのタグ駆動MOD仕様へ必須タグ枠組みを追加した統合版と明記しているため。","source_discussion_ids":[],"approved_by":"Source package v0.4","approved_at":"2026-08-19T09:26:00+09:00","created_at":"2026-08-19T09:26:00+09:00","updated_at":"2026-08-19T09:26:00+09:00"},{"id":"DEC-V9-MOD-002","title":"MOD数値を固定仕様にせずBalance Config化する","status":"Approved","text":"状態異常耐性上限、Critical基礎値、Tier効果量、抽選確率、補正率等を含むMOD関連の数値は、すべてBalance調整項目として仮値扱いとする。V9や後発資料に記載された75%、100%、5%等は現時点のBaseline/参考値として保持するが、正式固定値としてハードコードしない。実装はConfig/データ駆動で可変にする。","rationale":"Human方針により、数値は仕様構造ではなくBalance調整対象として扱い、実装後も再ビルドなしで変更可能にするため。","source_discussion_ids":["DISC-V9-MOD-002"],"approved_by":"Human","approved_at":"2026-08-19T09:33:00+09:00","created_at":"2026-08-19T09:26:00+09:00","updated_at":"2026-08-19T09:33:00+09:00"},{"id":"DEC-V9-MOD-003","title":"基礎能力値MODは通常MODの基本枠ではなくレア枠として限定採用可能","status":"Approved","text":"STR / VIT / AGI / DEX / INT / MND / LUKを直接増加させる能力値MODは、通常MODの基本構成として常時・確定付与するものではない。一部装備ではレア枠として能力値MODを持てる余地を残す。アミュレットも能力値MOD専用にはせず、基本は通常MODを持ち、能力値MODはレア枠候補として扱う。","rationale":"Human最新判断により、能力値MODを完全不採用とはせず、通常MOD中心の設計を維持しつつ希少枠で限定的に許容する方針へ更新したため。","source_discussion_ids":["DISC-V9-MOD-003"],"approved_by":"Human","approved_at":"2026-08-19T09:48:00+09:00","created_at":"2026-08-19T09:26:00+09:00","updated_at":"2026-08-19T09:48:00+09:00"},{"id":"DEC-V9-MOD-004","title":"通常MOD抽選ルールは抽選順を除き仮採用のまま維持する","status":"Approved","text":"通常MOD抽選の処理順『レアリティ → MOD数 → 攻撃/防御枠 → MODカテゴリ → MOD種類 → MOD Tier』は正式採用する。一方、同一カテゴリ内等確率、エリート/ボス補正方式、全iLvで全Tierを対象とする案、表示名ルール等は、現時点では仮採用のまま維持し、実装・検証後に正式採用可否を判断する。","rationale":"Human判断により、順序だけを構造仕様として確定し、その他の抽選ルールは検証余地を残す。","source_discussion_ids":["DISC-V9-MOD-001"],"approved_by":"Human","approved_at":"2026-08-19T09:36:00+09:00","created_at":"2026-08-19T09:26:00+09:00","updated_at":"2026-08-19T09:36:00+09:00"},{"id":"DEC-V9-MOD-005","title":"MODの数値は全て仮値・可変式とする","status":"Approved","text":"MODに関する効果量、確率、上限、係数、補正率その他の数値はすべてBalance調整項目として仮値扱いとする。実装時は数値をロジックへ直書きせず、Config/CSV/JSON等の外部データから変更可能な方式とする。","rationale":"ゲームバランス調整で変更される値を仕様固定・コード固定にしないため。","source_discussion_ids":[],"approved_by":"Human","approved_at":"2026-08-19T09:33:00+09:00","created_at":"2026-08-19T09:33:00+09:00","updated_at":"2026-08-19T09:33:00+09:00"},{"id":"DEC-V9-MOD-006","title":"通常MOD抽選の処理順を正式採用する","status":"Approved","text":"通常MOD抽選の処理順は『レアリティ → MOD数 → 攻撃/防御枠 → MODカテゴリ → MOD種類 → MOD Tier』を正式採用する。各段階の確率・補正率・Tier効果量等の数値はBalance調整項目として仮値・可変とする。","rationale":"Human判断により、抽選フローの順序は構造仕様として固定し、バランス数値とは分離する。","source_discussion_ids":["DISC-V9-MOD-001"],"approved_by":"Human","approved_at":"2026-08-19T09:36:00+09:00","created_at":"2026-08-19T09:36:00+09:00","updated_at":"2026-08-19T09:36:00+09:00"},{"id":"DEC-V9-EQUIP-001","title":"Equipment生成をBaseItem / Item / Lootの3層へ分離する","status":"Approved","text":"Equipment生成は BaseItem Generation、Item Generation、Loot/Drop の3層に分離し、初期実装の中核をBaseItem Generationとする。","rationale":"後発Equipment完全統合仕様 v1.1で正式統合されているため。","source_discussion_ids":[],"approved_by":"Post-V9 Equipment v1.1","approved_at":"2026-08-19T09:46:00+09:00","created_at":"2026-08-19T09:46:00+09:00","updated_at":"2026-08-19T09:46:00+09:00"},{"id":"DEC-V9-EQUIP-002","title":"Equipment Consumer Contractを正式fieldへ置換する","status":"Approved","text":"要求値は装備可否判定専用とする。戦闘寄与fieldは武器 attack / accuracy / magic_weapon_bonus / base_critical_rate、防具 hp_bonus / mp_bonus / evasion とする。旧defense、base_attack/base_defense、装備能力値の直接Battle加算、旧field fallbackを使用しない。","rationale":"後発Equipment v1.1および実装前仕様確定資料でConsumer Contractが整理・確定されているため。","source_discussion_ids":[],"approved_by":"Post-V9 Equipment v1.1","approved_at":"2026-08-19T09:46:00+09:00","created_at":"2026-08-19T09:46:00+09:00","updated_at":"2026-08-19T09:46:00+09:00"},{"id":"DEC-V9-EQUIP-003","title":"防具要求ステータスをVIT / MND / AGIへ統一する","status":"Approved","text":"防具要求fieldは required_vit / required_mnd / required_agi とする。V9ローブのINT要求は旧仕様として不採用とし、防具要求値にINTを使用しない。","rationale":"Equipment v1.1のREADME・差分決定台帳・本文で正式確定として一致しているため。","source_discussion_ids":[],"approved_by":"Post-V9 Equipment v1.1","approved_at":"2026-08-19T09:46:00+09:00","created_at":"2026-08-19T09:46:00+09:00","updated_at":"2026-08-19T09:46:00+09:00"},{"id":"DEC-V9-EQUIP-004","title":"Equipment ContributionとMOD domain境界を正式化する","status":"Approved","text":"BaseItem保存値はMODで上書きせずEquipment Contributionを経由する。Equipment性能MODは Final = Base + (Base × Percent合計) + Flat合計。MOD domainはequipment / damage / defenseへ分離し、最終計算式はtarget側の正式仕様へ委譲する。","rationale":"Equipment実装前仕様確定 Phase7/8をEquipment v1.1が統合しているため。","source_discussion_ids":[],"approved_by":"Post-V9 Equipment v1.1","approved_at":"2026-08-19T09:46:00+09:00","created_at":"2026-08-19T09:46:00+09:00","updated_at":"2026-08-19T09:46:00+09:00"},{"id":"DEC-V9-EQUIP-005","title":"Equipmentの正式数値計算をStudio Generatorへ委譲する","status":"Approved","text":"AI STARTではequipmentのみwritableとし、required_*、attack、accuracy、magic_weapon_bonus、hp_bonus、mp_bonus、evasion、Growth結果、Config係数等の正式数値をAIが独自計算して正規値として提出しない。Studio GeneratorがGeneration RulesとActive Balance Configから計算する。","rationale":"Equipment v1.1のAI START接続仕様で明示されているため。","source_discussion_ids":[],"approved_by":"Post-V9 Equipment v1.1","approved_at":"2026-08-19T09:46:00+09:00","created_at":"2026-08-19T09:46:00+09:00","updated_at":"2026-08-19T09:46:00+09:00"},{"id":"DEC-V9-EQUIP-006","title":"武器base_critical_rateは現行5%をBaselineとしBalance Configで可変にする","status":"Approved","text":"武器由来base_critical_rateは現行Baselineとして0.05（5%）を使用する。ただし正式固定値にはせず、Balance Configから変更可能にする。","rationale":"Human判断により、現行基準値5%を保持しつつバランス調整可能にするため。","source_discussion_ids":["DISC-V9-EQUIP-002"],"approved_by":"Human","approved_at":"2026-08-19T09:48:00+09:00","created_at":"2026-08-19T09:46:00+09:00","updated_at":"2026-08-19T09:48:00+09:00"},{"id":"DEC-V9-EQUIP-007","title":"アミュレットは通常MOD主体＋能力値MODレア枠とする","status":"Approved","text":"アミュレットの旧『能力値MOD専用』は廃止する。基本は通常MODを持つ装備とし、能力値MODはレア枠として持てるが確定付与ではない。","rationale":"Human判断により、アミュレットを能力値MOD専用装備へ固定せず、通常MODを基本としつつ希少な能力値MODの余地を残すため。","source_discussion_ids":["DISC-V9-EQUIP-001"],"approved_by":"Human","approved_at":"2026-08-19T09:48:00+09:00","created_at":"2026-08-19T09:46:00+09:00","updated_at":"2026-08-19T09:48:00+09:00"},{"id":"DEC-V9-EQUIP-008","title":"初期BaseItem Generatorにアクセサリを含める","status":"Approved","text":"初期BaseItem Generatorの対象にアミュレット・指輪・ベルトを含める。","rationale":"Human判断により、初期段階からアクセサリもBaseItem生成対象とするため。","source_discussion_ids":["DISC-V9-EQUIP-003"],"approved_by":"Human","approved_at":"2026-08-19T09:48:00+09:00","created_at":"2026-08-19T09:46:00+09:00","updated_at":"2026-08-19T09:48:00+09:00"},{"id":"DEC-V9-TAG-001","title":"Legacy固定Runtimeタグ・固定数値タグを最新版へ継承しない","status":"Approved","text":"ATTACK / DOT等の旧固定Runtime種別、DOT_POWER / DOT_DURATION / DOT_INTERVAL等のLegacy専用固定数値タグ・parameter体系、旧Tag Runtime前提の仕様は最新版Formal Tag/Skill仕様へ一切継承しない。","rationale":"Human確認により、Formal化は限定処理をなくし旧Legacy仕様を完全破棄する方針と確定したため。","source_discussion_ids":["DISC-V9-TAG-001"],"approved_by":"Human","approved_at":"2026-08-19T10:11:00+09:00","created_at":"2026-08-19T10:11:00+09:00","updated_at":"2026-08-19T10:11:00+09:00"},{"id":"DEC-V9-TAG-002","title":"TagはFormal Compilerが実行契約を構成する汎用部品とする","status":"Approved","text":"Tagは実行命令そのものや固定Runtime名ではなく、実行命令を組み立てるための汎用部品として扱う。個別Tagの意味・必要parameter・許可組合せはFormal Registry/Schemaで定義し、CompilerがFormal SkillからruntimeContractsを生成する。","rationale":"Humanが示した『タグは実行命令を組み立てる部品、Compilerが作ってRuntimeへ渡す』設計を正式化するため。","source_discussion_ids":["DISC-V9-TAG-002"],"approved_by":"Human","approved_at":"2026-08-19T10:11:00+09:00","created_at":"2026-08-19T10:11:00+09:00","updated_at":"2026-08-19T10:11:00+09:00"},{"id":"DEC-V9-SKILL-001","title":"Skill最終正本をFormal系のみにする","status":"Approved","text":"最終Skill経路は Formal Skill → Formal Skill Compiler → Formal Compiled Skill/runtimeContracts → Skill Master → Formal Runtime とする。Generic/Legacy/旧Tag Runtime/旧Demo/Fallbackを最終成果物へ残さない。","rationale":"GKS-B555正式化方針とHumanのLegacy完全破棄方針が一致するため。","source_discussion_ids":["DISC-V9-SKILL-001"],"approved_by":"Human","approved_at":"2026-08-19T10:11:00+09:00","created_at":"2026-08-19T10:11:00+09:00","updated_at":"2026-08-19T10:11:00+09:00"},{"id":"DEC-V9-SKILL-002","title":"Formal Skill Authoring Schema基礎を採用する","status":"Approved","text":"Formal Skill Authoring Schemaの基礎fieldは schemaVersion / id / name / skillLevel / trigger / conditions / target / effects / resource とする。未知fieldを場当たり追加せずSchema/Registryを正本とする。","rationale":"GKS-B555正式化方針で正式Authoring Schemaの基礎として明示されているため。","source_discussion_ids":["DISC-V9-SKILL-001"],"approved_by":"Post-V9 GKS-B555 formalization plan","approved_at":"2026-08-19T10:11:00+09:00","created_at":"2026-08-19T10:11:00+09:00","updated_at":"2026-08-19T10:11:00+09:00"},{"id":"DEC-V9-SKILL-003","title":"Formal Runtimeの数値は汎用parameterとしてcontractへ渡す","status":"Approved","text":"Formal Runtimeでも実行に必要な数値parameterを使用する。ただしDOT_POWER等のLegacy限定キーを正式仕様として残さず、Formal Schema/Registryが定義する汎用parameterとして保持し、Compilerが検証・正規化してruntimeContractsへ渡す。Balance値はデータ駆動で可変にする。","rationale":"Human確認により『数値は必要だがLegacy限定処理は不要』という境界を確定したため。","source_discussion_ids":["DISC-V9-TAG-002"],"approved_by":"Human","approved_at":"2026-08-19T10:11:00+09:00","created_at":"2026-08-19T10:11:00+09:00","updated_at":"2026-08-19T10:11:00+09:00"},{"id":"DEC-V9-SKILL-004","title":"実装前Runtime/Compiler確認はFormal実体を対象にする","status":"Approved","text":"新ロジック実装前に現行Buildの正式Runtime/Compiler/Registry/Skill Master接続と更新ZIPメタを確認し、段階回帰を全PASSしてから次工程へ進む。旧compileTaggedSkill等を確認対象として復活させない。","rationale":"P01-02運用原則をFormal化後の構造へ適用するため。","source_discussion_ids":["DISC-V9-SKILL-002"],"approved_by":"Human","approved_at":"2026-08-19T10:11:00+09:00","created_at":"2026-08-19T10:11:00+09:00","updated_at":"2026-08-19T10:11:00+09:00"},{"id":"DEC-V9-AI-001","title":"Formal AI条件分岐をTRUE/FALSE 2方向へ固定する","status":"Approved","text":"Formal AIのCONDITIONは入口1 / TRUE出口1 / FALSE出口1とし、3方向・N方向分岐は実装しない。3条件以上はCONDITIONを連結して表現する。","rationale":"2026-08-16 AIチップUI正式仕様・依存関係仕様が固定前提として一致しているため。","source_discussion_ids":["DISC-V9-AI-001"],"approved_by":"Post-V9 AI chip UI formal specification","approved_at":"2026-08-19T10:29:00+09:00","created_at":"2026-08-19T10:29:00+09:00","updated_at":"2026-08-19T10:29:00+09:00"},{"id":"DEC-V9-AI-002","title":"ACTIONを終端nodeとする","status":"Approved","text":"Formal AIのACTIONは入口1 / 出口0とし、ACTION到達時点でAI判断結果を確定して既存Battle予約へ渡す。ACTION後続Edgeは存在しない。","rationale":"2026-08-16正式仕様と実装前残タスクのACTION終端契約が一致しているため。","source_discussion_ids":["DISC-V9-AI-001"],"approved_by":"Post-V9 AI chip UI formal specification","approved_at":"2026-08-19T10:29:00+09:00","created_at":"2026-08-19T10:29:00+09:00","updated_at":"2026-08-19T10:29:00+09:00"},{"id":"DEC-V9-AI-003","title":"Formal AI ProgramとBoard/Layoutを分離する","status":"Approved","text":"Formal Programを実行ロジックの正本、Board/LayoutをUI配置正本として分離する。盤面サイズ、座標、rotation、extension等をFormal Programへ混在させない。延長パネルはRuntime nodeにしない。","rationale":"2026-08-16依存関係仕様・正式UI仕様・Layout v1 Schemaで一貫しているため。","source_discussion_ids":["DISC-V9-AI-001"],"approved_by":"Post-V9 AI chip UI formal specification","approved_at":"2026-08-19T10:29:00+09:00","created_at":"2026-08-19T10:29:00+09:00","updated_at":"2026-08-19T10:29:00+09:00"},{"id":"DEC-V9-AI-004","title":"Board接続とFormal Edge生成に単一Connection Resolverを使う","status":"Approved","text":"盤面表示用接続とFormal Program edges[]を別管理せず同一Connection Resolverから生成する。出口→入口のみ、1入口=1source、1出口=1target。extensionはResolverが畳み、行き止まり・循環・複数候補分岐をERRORとする。","rationale":"2026-08-16 Connection Resolver仕様で正本として固定されているため。","source_discussion_ids":["DISC-V9-AI-001"],"approved_by":"Post-V9 AI chip UI dependency/preimplementation specification","approved_at":"2026-08-19T10:29:00+09:00","created_at":"2026-08-19T10:29:00+09:00","updated_at":"2026-08-19T10:29:00+09:00"},{"id":"DEC-V9-AI-005","title":"Formal AIは判断までを担当しBattle実行仕様を再定義しない","status":"Approved","text":"Game AI UI→Formal AI Program→Validator→Compiler→AI Runtime/Decision Engine→action_id+target_idまでをAI側責務とし、行動予約、一定時間ごとの再判定、行動順獲得後の予約実行、実行時行動可能判定、Skill Runtime、戦闘計算は既存Battle側の責務として変更しない。","rationale":"2026-08-16正式UI仕様・依存関係仕様・実装計画で明示されているため。","source_discussion_ids":["DISC-V9-AI-001"],"approved_by":"Post-V9 AI chip UI formal specification","approved_at":"2026-08-19T10:29:00+09:00","created_at":"2026-08-19T10:29:00+09:00","updated_at":"2026-08-19T10:29:00+09:00"},{"id":"DEC-V9-AI-006","title":"Game/StudioでFormal AI coreを共有しGame固有Bridgeだけを分離する","status":"Approved","text":"Formal Program Model / Master Adapter / Validator / Compiler / Decision Engine / TraceはGameとStudioで同一coreを使用し二重実装しない。Game専用BridgeだけがSave、Character binding、Battle unit snapshot、reserveAction接続を扱う。","rationale":"2026-08-16 Game/Studio/shared境界仕様が目標責務として明示しているため。","source_discussion_ids":["DISC-V9-AI-001"],"approved_by":"Post-V9 AI chip UI dependency specification","approved_at":"2026-08-19T10:29:00+09:00","created_at":"2026-08-19T10:29:00+09:00","updated_at":"2026-08-19T10:29:00+09:00"},{"id":"DEC-V9-AI-007","title":"GameのTag/Skill候補はStudio正本Export経由で供給する","status":"Approved","text":"GameはStudio localStorageを直接読まず、Studio project JSONのtags/tag_categories/masters.skills等を正式Exportし、Game Catalog Loaderが同一data_version系として読み込む。データが空なら候補を捏造せず、必須参照を満たせないチップは保存不可とする。","rationale":"2026-08-16 Game用Tag/Skill供給仕様で明示されているため。","source_discussion_ids":["DISC-V9-AI-004"],"approved_by":"Post-V9 AI chip UI preimplementation specification","approved_at":"2026-08-19T10:29:00+09:00","created_at":"2026-08-19T10:29:00+09:00","updated_at":"2026-08-19T10:29:00+09:00"},{"id":"DEC-V9-AI-008","title":"AI SaveもLegacy zeroとし旧互換項目を残さない","status":"Approved","text":"Fo 後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0003","title":"[MASTER] CSV_DB共通設計ルール_Version1.0","status":"Approved","summary":"V9ライブラリ v2.0基準文書。マスター・運用 / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 00_マスター/02_運用管理/CSV_DB共通設計ルール_Version1.0.md\nsha256: 4aa1c8eb5825d31455373843273cb0ead20467477a2b8934f32ac19de97af498\nbytes: 9200\narea: MASTER / マスター・運用\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# ギルド冒険物語 CSV・DB共通設計ルール\n\nVersion 1.0  \n採用状態：正式採用  \n監査ID：AUD-016  \n決定ID：DEC-0009\n\n## 1. 目的\n\n本書は、ゲーム実装用CSV、DBインポート用CSV、およびPHPが直接読み込むCSVの共通規則を定義する。\n\n本書は形式・命名・型・検証方法を統一するものであり、全CSVの固有列が確定したことを意味しない。各CSV固有列は領域別設計で順次定義する。\n\n## 2. 適用範囲\n\n適用対象：\n\n- ゲーム実装用マスターCSV\n- 多対多関係CSV\n- レベル・Tier・進行度などの段階CSV\n- DBインポート用CSV\n- PHPが直接読み込むCSV\n- 今後新規作成する実装管理CSV\n\n原則適用対象外：\n\n- 既存の日本語列を持つ監査表\n- 既存の仕様ID台帳\n- 人間向け管理資料の過去版\n\n既存管理資料は一括変換せず、手戻りを発生させない。新規作成または全面改訂時に本規則へ寄せる。\n\n## 3. CSV分類\n\n### 3.1 マスターCSV\n\nゲームの固定定義を保持する。\n\n例：`jobs.csv`、`skills.csv`、`monsters.csv`、`guild_facilities.csv`、`regions.csv`\n\n### 3.2 関連CSV\n\nマスター同士の多対多関係を保持する。\n\n例：`skill_tags.csv`、`monster_skills.csv`、`region_connections.csv`\n\n### 3.3 数値・段階CSV\n\nレベル、Tier、進行度などの段階別数値を保持する。\n\n例：`guild_levels.csv`、`mod_tiers.csv`、`skill_levels.csv`\n\n### 3.4 管理CSV\n\n仕様・実装・監査・ID・CSV定義などを管理する。原則としてゲーム実行時には読み込まない。\n\n例：`csv_definitions.csv`、`csv_columns.csv`、`spec_asset_relations.csv`\n\n## 4. ファイル形式\n\n- 文字コード：UTF-8\n- Excel配布・編集用：UTF-8 BOM付きを許可し、原則推奨\n- 改行コード：LF\n- 区切り文字：カンマ\n- 囲み文字：ダブルクォート\n- 1行目：必須ヘッダー\n- 空ファイル、ヘッダーなしファイルは禁止\n\nカンマ、改行、ダブルクォート、前後空白を含む値はダブルクォートで囲む。値中のダブルクォートは二重化する。\n\n## 5. ファイル名\n\n- 英小文字\n- `snake_case`\n- 拡張子は`.csv`\n- 内容を複数形名詞で表現する\n\n例：`guild_facilities.csv`、`region_connections.csv`\n\n## 6. 列名\n\n- 英小文字\n- `snake_case`\n- 半角英数字とアンダースコアのみ\n- 略語はプロジェクト用語辞書で定義済みのものに限定\n- 意味の曖昧な`value`、`type`、`data`の単独使用を避ける\n\n良い例：`required_guild_level`、`storage_capacity`、`duration_ticks`\n\n## 7. ID\n\n- 形式：`PREFIX-00001`\n- 数値部分：5桁ゼロ埋め\n- プレフィックス：`id_prefixes.csv`を唯一の定義元とする\n- 一度発行したIDは再利用しない\n- ID数値部にカテゴリや順序の意味を持たせない\n- 原則として全マスターCSVと関連CSVに`id`を持たせる\n- 外部キーは表示名やcodeではなくIDを使用する\n\n複合IDは章・節など恒久的な階層構造に限定する。通常の関係データは独立IDと外部キーで管理する。\n\n## 8. idとcode\n\n主要マスターでは`id`と`code`を分離する。\n\n- `id`：DB主キー、外部キー、変更禁止\n- `code`：PHP判定用、人間可読、同一CSV内で一意\n- `code`形式：`UPPER_SNAKE_CASE`\n\n名称文字列をPHPロジックの判定条件に使用しない。\n\n## 9. 共通列\n\n主要マスターの標準候補：\n\n| 列 | 型 | 必須 | 説明 |\n|---|---|---:|---|\n| id | ID | 1 | 主キー |\n| code | STRING | 1 | PHP参照用一意コード |\n| name | STRING | 1 | 表示名 |\n| description | TEXT | 0 | 表示可能な説明 |\n| sort_order | INTEGER | 0 | 表示順 |\n| enabled | BOOLEAN | 1 | 使用可否 |\n| notes | TEXT | 0 | 開発者向けメモ |\n\nすべてのCSVへ共通列を機械的に強制しない。表示名を持たない関係CSVには`name`を置かない。\n\n## 10. データ型\n\n初期標準型：\n\n- `ID`\n- `STRING`\n- `TEXT`\n- `INTEGER`\n- `DECIMAL`\n- `BOOLEAN`\n- `ENUM`\n\n必要時のみ追加：`DATE`、`DATETIME`、`JSON`\n\nJSON列は検証と参照が難しくなるため原則として多用せず、可能な場合は関連CSVへ分離する。\n\n## 11. 真偽値\n\n- `0` = false\n- `1` = true\n\n`true`、`false`、`yes`、`no`、日本語表記は使用しない。\n\n## 12. 空欄とNULL\n\n- 空欄 = 値なし\n- `0` = 数値ゼロまたはfalse\n- `NULL`、`null`、`N/A`、`なし`、`-`を未設定表現として使用しない\n- 必須列の空欄は禁止\n\nDBインポート時に、任意列の空欄をDBのNULLへ変換するかは列定義で指定する。\n\n## 13. 数値と単位\n\n- 整数に桁区切りを入れない\n- 小数点はピリオド\n- 割合は原則として整数百分率で保持する\n- 割合列は`*_percent`\n- 倍率列は`*_multiplier`\n- 戦闘時間は`*_ticks`\n- 秒は`*_seconds`\n\n例：30%は`30`、1.5倍は`1.5`。\n\n## 14. 列挙値\n\n- 形式：`UPPER_SNAKE_CASE`\n- 自由記述を禁止\n- 選択肢が固定的で少数なら列定義書で管理\n- 頻繁に追加され、他CSVから参照される場合は専用マスターへ分離\n\n## 15. 外部キー\n\n- 外部キー列は`*_id`\n- 参照先IDが存在することをインポート時に検証\n- 表示名を外部キーにしない\n- 親子関係は`parent_*_id`\n- 親なしは空欄\n- 循環参照は禁止\n\n## 16. 関連CSV\n\n- 独立した`id`を持つ\n- 関係を構成する外部キーの組み合わせへ一意制約を設定する\n- 必要に応じて条件、優先度、順序、enabledを追加する\n\n例：`UNIQUE(character_id, skill_id)`\n\n## 17. 段階CSV\n\n親IDと段階値の組み合わせを一意にする。\n\n例：\n\n- `UNIQUE(facility_id, level)`\n- `UNIQUE(mod_id, tier)`\n- 単独ギルドレベル表なら`UNIQUE(level)`\n\n段階値は原則1以上の連続整数とする。ただし0段階が仕様上必要な場合は列定義へ明記する。\n\n## 18. 表示順\n\n- 表示順が必要なCSVは`sort_order`を持つ\n- 初期値は10刻みを推奨\n- 同値の場合は`id`昇順を補助順序とする\n\n## 19. 無効化と削除\n\n- 公開済みまたは参照済みマスターデータは原則として物理削除しない\n- 使用停止は`enabled=0`\n- 誤登録で未参照かつ公開前のみ物理削除を許可\n- 廃止IDは再利用しない\n\n## 20. 表示文と開発メモ\n\n- `description`：ゲームまたは管理画面へ表示可能\n- `notes`：開発者向け。ゲーム画面へ表示禁止\n\n## 21. 日時列\n\nマスターCSVには原則として`created_at`、`updated_at`を持たせない。\n\nプレイヤーセーブDB、履歴DB、監査ログには必要に応じて日時列を持たせる。\n\n## 22. CSVデータ辞書\n\n`csv_definitions.csv`でファイル単位、`csv_columns.csv`で列単位を管理する。\n\n各CSVはデータ辞書に登録されてから量産する。\n\n最低管理項目：\n\n- ファイル名\n- DBテーブル名\n- データ分類\n- 領域\n- インポート順\n- 列名\n- 型\n- 必須\n- 主キー\n- 一意制約\n- 外部キー\n- 既定値\n- 列挙値\n- 最小値・最大値\n- NULL許可\n- 説明\n\n## 23. インポート検証\n\nPHP CSVインポーターは最低限次を検証する。\n\n1. ファイルの存在\n2. 文字コードとBOM\n3. 必須ヘッダー\n4. 未定義列\n5. 必須値\n6. ID形式\n7. 主キー重複\n8. 外部キー存在\n9. 列挙値\n10. 型\n11. 最小値・最大値\n12. 一意制約\n13. 親子循環\n14. 不正な改行または引用符\n\n## 24. トランザクション\n\n- 原則としてファイル単位でトランザクションを使用\n- 全行成功時のみCOMMIT\n- 1行でも失敗した場合はROLLBACK\n- 依存関係が強い複数CSVを一括投入する場合は、投入単位を設計書へ明記\n\n## 25. インポート順\n\n参照されるマスターを先に投入する。\n\n標準順序：\n\n1. 列挙・基礎マスター\n2. 親マスター\n3. 子マスター\n4. 段階CSV\n5. 関連CSV\n6. 条件・アクションCSV\n\n循環依存は禁止する。避けられない場合はNULL許可と後段更新を明文化する。\n\n## 26. エラー報告\n\nエラーには最低限次を含める。\n\n- ファイル名\n- 行番号\n- 列名\n- 入力値\n- エラーコード\n- 人間向け説明\n\n機密情報やプレイヤー個人情報をログへ出力しない。\n\n## 27. 変更管理\n\n- 列追加は原則として末尾追加\n- 列削除または列名変更は破壊的変更として扱う\n- 破壊的変更時は移行手順と対象Versionを記録\n- IDは列名変更や名称変更で変更しない\n- CSV定義変更時は`csv_definitions.csv`と`csv_columns.csv`を同時更新\n\n## 28. 完了条件\n\n各CSVの列定義完了条件：\n\n- 主キー確定\n- 全列名確定\n- 型確定\n- 必須・NULL確定\n- 既定値確定\n- 一意制約確定\n- 外部キー確定\n- 列挙値確定\n- 値範囲確定\n- インポート順確定\n- 正常系・異常系テスト項目確定\n\nAUD-016は共通規則とデータ辞書構造を解決済みとする。56件の個別列定義はPhase7-4の継続作業とする。\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0004","title":"[MASTER] 仕様更新ルール","status":"Approved","summary":"V9ライブラリ v2.0基準文書。マスター・運用 / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 00_マスター/02_運用管理/仕様更新ルール.md\nsha256: c06f84d0dc8eeb3b7bceb9ac563b3c4641efbef142b774e76d68693ab525dbc6\nbytes: 1257\narea: MASTER / マスター・運用\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# 仕様更新ルール\n\n## 正本\n- 採用状態の正本：`00_採用仕様一覧_Version2.0.txt`\n- 全体構造の正本：`01_システム設計書_統合正式版_Version6.0.txt`\n- 数値・DB・アルゴリズムの正本：各最新版の個別仕様書\n\n## 更新手順\n1. 変更対象の個別仕様書を更新する。\n2. 影響範囲マトリクスで参照先を確認する。\n3. 採用仕様一覧のVersion・状態を更新する。\n4. 統合設計書に全体方針の変更がある場合のみ反映する。\n5. INDEX・依存関係・管理台帳を更新する。\n6. CSV・DB・PHP・テストへの反映状況を管理台帳に記録する。\n7. 更新履歴へ日付、Version、変更理由、影響範囲を記録する。\n\n## 禁止事項\n- 旧版を削除しない。\n- 個別仕様の詳細を、根拠なく統合設計書へ上書きしない。\n- Version番号を上げずに仕様内容を変更しない。\n- CSV・DB・PHPの更新確認なしで「実装済み」にしない。\n\n## 状態定義\n- 未着手：作業未開始\n- 作業中：仕様または実装を編集中\n- 仕様確定：仕様レビュー済み\n- 実装済み：コードへ反映済み\n- テスト済み：検証完了\n- 保留：判断材料不足","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0005","title":"[MASTER] 依存関係マップ","status":"Approved","summary":"V9ライブラリ v2.0基準文書。マスター・運用 / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 00_マスター/02_運用管理/依存関係マップ.md\nsha256: f98377c99421540ecaea5c286746eec17fe2778c3cdc4818fe64ce7423814fc2\nbytes: 2248\narea: MASTER / マスター・運用\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# 依存関係マップ\n\n## 基本参照順序\n\n`採用仕様一覧 → 統合設計書Version6.0 → 対象システム設計書 → 個別DB・数値表 → 実装仕様 → テスト`\n\n## システム依存構造\n\n```text\nマスター管理\n└─ ゲーム概要・コア\n   ├─ キャラクター・職業\n   │  ├─ 戦闘\n   │  ├─ スキル\n   │  └─ 装備\n   ├─ 戦闘\n   │  ├─ 戦闘AI\n   │  ├─ スキル\n   │  ├─ BUFF・状態異常・スタック\n   │  └─ 装備\n   ├─ タグ ── スキル／装備／MOD／モンスター\n   ├─ 装備 → MOD・レアリティ\n   ├─ MOD・レアリティ → 石板\n   ├─ 石板 → モンスター\n   ├─ モンスター → クエスト\n   └─ クエスト → イベント → ギルド施設\n```\n\n## 依存関係一覧\n\n| 参照元 | 参照先 | 理由 |\n|---|---|---|\n| マスター管理 | ゲーム概要・コア | 親仕様・採用状態 |\n| ゲーム概要・コア | キャラクター・職業 | ゲーム基本方針 |\n| ゲーム概要・コア | 戦闘 | コアループ |\n| ゲーム概要・コア | クエスト | 依頼受注ループ |\n| キャラクター・職業 | 戦闘 | 能力値・成長 |\n| キャラクター・職業 | スキル | 習得条件 |\n| キャラクター・職業 | 装備 | 装備条件 |\n| 戦闘 | 戦闘AI | 行動判断 |\n| 戦闘 | スキル | 行動効果 |\n| 戦闘 | BUFF・状態異常・スタック | 継続効果・耐性 |\n| 戦闘 | 装備 | 攻撃力・HP等の供給 |\n| 戦闘AI | スキル | 使用可能スキル |\n| スキル | BUFF・状態異常・スタック | 付与・解除効果 |\n| タグ | スキル | スキル分類 |\n| タグ | 装備 | 装備分類 |\n| タグ | MOD・レアリティ | MOD適用条件 |\n| タグ | モンスター | 敵分類 |\n| 装備 | MOD・レアリティ | 装備性能生成 |\n| MOD・レアリティ | 石板 | 敵強化・報酬補正 |\n| 石板 | モンスター | 敵編成・強化 |\n| モンスター | クエスト | 敵配置・難易度 |\n| クエスト | イベント | イベント発生 |\n| クエスト | ギルド施設 | 受注・報酬・施設解放 |\n| イベント | ギルド施設 | 施設解放・進行 |","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0006","title":"[MASTER] 更新履歴","status":"Approved","summary":"V9ライブラリ v2.0基準文書。マスター・運用 / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 00_マスター/02_運用管理/更新履歴.md\nsha256: dd7907c0973fe12c9a00adfc766df27c7fabe272465e47dfdc89cbd671098f09\nbytes: 919\narea: MASTER / マスター・運用\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# 更新履歴\n\n| 日付 | ライブラリ版 | 変更内容 | 影響範囲 | 状態 |\n|---|---|---|---|---|\n| 2026-07-23 | V6 Phase4 | 依存関係マップ、参照順序、更新ルール、実装進捗管理を追加 | 全体 | 完了 |\n| 2026-07-23 | V6 Phase3 | Version6.0中心のフォルダ再構築、正規リネーム、旧版隔離 | 全体 | 完了 |\n| 2026-07-23 | V6 Phase2 | 最新版・統合済み・派生仕様・旧版を判定 | 全体 | 完了 |\n| 2026-07-23 | V6 Phase1 | 全ファイル解析とDB化 | 全体 | 完了 |\n\n## 2026-07-23 AUD-002C / AUD-002D / AUD-016反映\n\n- ギルド施設設計Version1.1を追加。\n- WORLD領域構造設計Version1.0を追加。\n- CSV・DB共通設計ルールVersion1.0を追加。\n- CSVデータ辞書テンプレートを追加。\n- 監査状態、決定ログ、IDプレフィックス、INDEXを更新。\n- 旧ファイルは削除していない。\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0007","title":"[MASTER] 目的別参照順序","st OD | 派生仕様\n- タイトル: レアリティ出現率設計\n- 原文: `03_派生仕様/01_予算_数値表/07_レアリティ出現率設計_Version4.7.txt`\n- チャンク数: 8\n### DOC-039 | MOD | 派生仕様\n- タイトル: MOD重複ルール設計書\n- 原文: `03_派生仕様/04_MOD分冊/07_MOD重複ルール設計書_Version1.0.txt`\n- チャンク数: 5\n### DOC-040 | MOD | 派生仕様\n- タイトル: ユニークMOD詳細_Version3.0\n- 原文: `03_派生仕様/04_MOD分冊/07_ユニークMOD詳細_Version3.0.txt`\n- チャンク数: 25\n### DOC-041 | MOD | 派生仕様\n- タイトル: Unique専用MOD体系\n- 原文: `03_派生仕様/04_MOD分冊/07_ユニーク専用MOD体系_Version2.0_旧版.txt`\n- チャンク数: 55\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0009","title":"[MASTER] AI検索クエリガイド","status":"Approved","summary":"V9ライブラリ v2.0基準文書。マスター・運用 / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 00_マスター/03_AI知識ベース/AI検索クエリガイド.md\nsha256: 77edef6c124a60eb1dff6327899267d59047a01134029fa9af339266969f2454\nbytes: 986\narea: MASTER / マスター・運用\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# AI検索クエリガイド\n\n## 検索の基本\n- 最初に `system_id` で対象を絞る。\n- 次にタイトル、見出し、用語、数値を検索する。\n- 結論を出す前に、同じ用語をMASTERと最新版の両方で確認する。\n\n## system_id\n- MASTER: 採用仕様一覧・統合設計書\n- CORE: コア、バランス、実装工程\n- CHAR: 能力値、成長、転職、パッシブ\n- BATTLE: 戦闘、AI、計算式、RANGE Budget\n- SKILL: スキルDB、スキル予算\n- STATUS: 状態異常、DOT、BUFF、スタック\n- TAG: タグ\n- EQUIP: 装備、装備DB、生成\n- MOD: MOD、Tier、レアリティ、ユニーク\n- STONE: 石板\n- MONSTER: モンスター、Enemy Budget、ボス\n- QUEST: クエスト\n- EVENT: イベント\n- GUILD: ギルド施設\n\n## 例\n- AIの最大ノード数 → `system_id=BATTLE` + `AI` + `ノード`\n- MODの重複条件 → `system_id=MOD` + `重複`\n- 装備条件 → `system_id=EQUIP` + `必要` + `STR` または `VIT`\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0010","title":"[MASTER] AI運用ルール","status":"Approved","summary":"V9ライブラリ v2.0基準文書。マスター・運用 / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 00_マスター/03_AI知識ベース/AI運用ルール.md\nsha256: 543ed9d71a1f63882e22953acd31bd5956208019a29e80b80c8e3965ee4f6811\nbytes: 986\narea: MASTER / マスター・運用\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# AI運用ルール\n\n## 基本原則\n- 仕様に書かれていない事項を、確定事項として補完しない。\n- 原文の用語、数値、Version、状態を保持する。\n- 矛盾がある場合は、優先順位で決め打ちせず、両方の記述と出典を示して「要確認」とする。\n- `未統合・要確認`の資料は提案・比較には使えるが、正式採用とは断定しない。\n- 旧版は、変更履歴や差分比較を求められた場合だけ参照する。\n- システム変更時は、Phase4の更新影響マトリクスを確認する。\n\n## 回答フォーマット\n1. 結論\n2. 根拠となる仕様書\n3. 関連システムへの影響\n4. 未確定・矛盾・不足\n5. 更新が必要なファイル\n\n## 実装時\n- 仕様 → CSV → DB → PHP → テストの順を守る。\n- PHPコードへ直接埋め込む前に、データ化対象か判定する。\n- 数値は原文または正式CSVを唯一の根拠とする。\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0011","title":"[MASTER] 未確定事項台帳","status":"Approved","summary":"V9ライブラリ v2.0基準文書。マスター・運用 / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 00_マスター/03_AI知識ベース/未確定事項台帳.md\nsha256: 4b7dada2a2cfbb8fa998a2adcf1925dadd7400899c22d27db9273b23ac39ba93\nbytes: 632\narea: MASTER / マスター・運用\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# 未確定・要確認事項台帳\n\nこの台帳は内容の正誤を判定したものではなく、Phase3/4で「未統合・要確認」に分類された資料を列挙する。\n\n| 文書ID | システム | タイトル | 原文 | 扱い |\n|---|---|---|---|---|\n| DOC-028 | STATUS | BUFFシステム設計書_Version1.0 | `01_最新版/99_未統合_要確認/04_BUFFシステム設計書_Version1.0.txt` | 正式採用として断定しない |\n| DOC-029 | MONSTER | ボスデータベース_Version1.0 | `01_最新版/99_未統合_要確認/09_ボスデータベース_Version1.0.txt` | 正式採用として断定しない |","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0012","title":"[MASTER] 相互参照ガイド","status":"Approved","summary":"V9ライブラリ v2.0基準文書。マスター・運用 / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 00_マスター/相互参照ガイド.md\nsha256: ad995a7b530b5d2aace9e5f74788c897e1638ef9b2898ec0a07e93db0c755cdb\nbytes: 659\narea: MASTER / マスター・運用\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# 仕様参照順序\n\n1. 採用仕様一覧 Version1.1\n2. システム設計書 統合正式版 Version6.0\n3. 対象システムの最新版または統合済み詳細仕様\n4. データベース・予算表・生成アルゴリズムなどの派生仕様\n5. 旧版は差分確認時だけ参照\n\n## 主な依存関係\n\n- キャラクター・職業 → 戦闘 → AI → スキル\n- スキル → BUFF・状態異常・スタック → タグ\n- 装備 → レアリティ・MOD → 装備生成アルゴリズム\n- 石板 → Enemy Budget → モンスターDB → クエスト・イベント\n- ギルド施設 → クエスト受注・育成・装備更新\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0013","title":"[MASTER] 01_共通前書き_正式採用","status":"Approved","summary":"V9ライブラリ v2.0基準文書。マスター・運用 / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 00_共通/01_共通前書き_正式採用.md\nsha256: 05d86c3309b283b98d083cec99c3c270a179d7f9812902fdb68e960ee9ae4ce2\nbytes: 1378\narea: MASTER / マスター・運用\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# V9ライブラリ 共通前書き（正式採用）\n\n## 本ライブラリについて\n\n本ライブラリは、**設計思想・システム構造・処理仕様を正本**とする。\n\n本ライブラリに記載される数値は、原則としてAIによる誤読防止のための調整用数値であり、バランス調整時に正式決定する。\n\n**ただし、本ライブラリ内で「正式採用事項」「正式仕様」「共通設計原則」と明示された数値は、この限りではなく、構造仕様の一部として扱う。**\n\n## 仕様の優先順位\n\n1. 正式採用事項・共通設計原則\n2. 設計思想\n3. システム構造\n4. 処理仕様\n5. データ構造\n6. バランス調整数値\n\n数値を根拠として構造や仕様を変更してはならない。\n\nただし、正式採用事項として定められた数値は構造仕様の一部として扱い、バランス調整対象とはしない。\n\n## 運用方針\n\n- 構造・仕様・設計思想と数値が矛盾する場合は、構造・仕様・設計思想を優先する。\n- バランス調整数値は将来の調整対象として扱う。\n- 正式採用事項として固定された数値は、ライブラリ全体で共通仕様として扱う。\n- 例：状態異常耐性上限75%は正式採用事項であり、バランス調整対象ではない。\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at" ========================\n\n\n被ダメージ時解除\n\n\n==================================================\n\n■ スタン\n\n\nタグ\n\n\nDEBUFF\n\n\n==================================================\n\n\n完全行動不能\n\n\n==================================================\n\n\n被ダメージでは解除されない\n\n\n==================================================\n\n■ 凍結\n\n\nタグ\n\n\nDEBUFF\n\n\nICE\n\n\n==================================================\n\n\n完全行動不能\n\n\n==================================================\n\n\n被ダメージでは解除されない\n\n\n==================================================\n\n■ 沈黙\n\n\nタグ\n\n\nDEBUFF\n\n\n==================================================\n\n\nスキル使用不可\n\n\n==================================================\n\n\n通常攻撃は可能\n\n\n==================================================\n\n■ 暗闇\n\n\nタグ\n\n\nDEBUFF\n\n\n==================================================\n\n\n命中率低下\n\n\n==================================================\n\n■ 呪い\n\n\nタグ\n\n\nDEBUFF\n\n\nDARK\n\n\n==================================================\n\n\n与ダメージ低下\n\n\n==================================================\n\n\n回復効果低下\n\n\n==================================================\n\n■ 感電\n\n\nタグ\n\n\nDEBUFF\n\n\nLIGHTNING\n\n\n==================================================\n\n\n行動速度低下\n\n\n==================================================\n\n\nAG獲得量低下\n\n\n==================================================\n\n■ 挑発\n\n\nタグ\n\n\nDEBUFF\n\n\n==================================================\n\n\nターゲット変更\n\n\n==================================================\n\n\n挑発対象を優先攻撃する\n\n\n==================================================\n\n■ HEAL阻害\n\n\nタグ\n\n\nDEBUFF\n\n\n==================================================\n\n\n回復量低下\n\n\n==================================================\n\n\n回復を無効化しない\n\n\n==================================================\n\n■ AI連携\n\n\nAI CONDITIONにて判定可能\n\n\n==================================================\n\n\n状態異常判定\n\n\n==================================================\n\n\n味方状態異常判定\n\n\n==================================================\n\n\n敵状態異常判定\n\n\n==================================================\n\n■ 将来拡張予定\n\n\n毒爆破\n\n\n==================================================\n\n\n燃焼変換\n\n\n==================================================\n\n\n出血消費\n\n\n==================================================\n\n\n呪い連携\n\n\n==================================================\n\n\nスタック参照スキル\n\n\n==================================================\n\n\nVersion 1.0\n\n\n正式採用\n\n\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0026","title":"[TAG] 05_タグシステム設計書_Version5.2","status":"Approved","summary":"V9ライブラリ v2.0基準文書。タグ / 最新版。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 01_最新版/05_タグ/05_タグシステム設計書_Version5.2.txt\nsha256: 1e671e4bfb90696d02acacadae7e4f9be184ead95a707a7eb70d6c4f9a67edae\nbytes: 2009\narea: TAG / タグ\nlibrary_status: 最新版\ndocument_id: DOC-015\nmanifest_title: タグシステム設計書\n\n【Original Content】\nギルド冒険物語\n\nタグシステム設計書\n\nVersion 5.2\n\n==================================================\n■ タグ基本方針\n\nタグはスキル、装備、MOD、状態異常、AI判定の共通識別子として使用する。\nタグ名は英大文字とアンダースコアで統一する。\n\n==================================================\n■ 属性タグ\n\nFIRE\nICE\nLIGHTNING\nWIND\nEARTH\nLIGHT\nDARK\n\n==================================================\n■ 効果タグ\n\nHEAL\nBUFF\nDEBUFF\n\n==================================================\n■ 攻撃属性タグ\n\nSLASH\nPIERCE\nSTRIKE\n\n==================================================\n■ 武器・装備タグ\n\nWEAPON_SWORD\nWEAPON_GREATSWORD\nWEAPON_DAGGER\nWEAPON_AXE\nWEAPON_GREATAXE\nWEAPON_SPEAR\nWEAPON_BOW\nWEAPON_GREATBOW\nWEAPON_STAFF\nWEAPON_WAND\nWEAPON_BOOK\nWEAPON_SHIELD\nEQUIP_QUIVER\n\n==================================================\n■ 武器タグ使用例\n\n片手剣\nWEAPON_SWORD\nSLASH\n\n==================================================\n\n大剣\nWEAPON_GREATSWORD\nSLASH\n\n==================================================\n\n短剣\nWEAPON_DAGGER\nSLASH\n\n==================================================\n\n片手斧\nWEAPON_AXE\nSTRIKE\n\n==================================================\n\n大斧\nWEAPON_GREATAXE\nSTRIKE\n\n==================================================\n\n槍\nWEAPON_SPEAR\nPIERCE\n\n==================================================\n\n弓\nWEAPON_BOW\nPIERCE\n\n==================================================\n\n大弓\nWEAPON_GREATBOW\nPIERCE\n\n==================================================\n\n杖\nWEAPON_STAFF\n\n==================================================\n\nワンド\nWEAPON_WAND\n\n==================================================\n\n魔導書\nWEAPON_BOOK\n\n==================================================\n\n盾\nWEAPON_SHIELD\nSTRIKE\n\n==================================================\n\n矢筒\nEQUIP_QUIVER\n\n==================================================\n■ スキルタグ使用例\n\nファイアボルト\nFIRE\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0027","title":"[EQUIP] 06_装備統合仕様書_Version2.1","status":"Approved","summary":"V9ライブラリ v2.0基準文書。装備 / 最新版。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 01_最新版/06_装備/06_装備統合仕様書_Version2.1.txt\nsha256: f76aabfcf1615e3a026f68fabc8ef54a0ab8f4b91e07e561b3da801272dceccc\nbytes: 11016\narea: EQUIP / 装備\nlibrary_status: 最新版\ndocument_id: DOC-016\nmanifest_title: 装備統合仕様書\n\n【Original Content】\nギルド冒険物語\n\n装備統合仕様書\n\nVersion 2.1\n\n==================================================\n■ 本書の構成\n\n本書は以下の既存正式仕様を統合したものである。\n\n・装備システム設計書 Version 5.0\n・装備生成フロー実装仕様書 Version 2.0\n・BaseItem Database アクセサリ編 Version 1.1\n\n==================================================\n■ 装備システム\n■ 装備システム基本方針\n\n装備は本作の主要成長要素である。\n\n能力値による戦闘力上昇は存在せず、\n戦闘力の大部分は装備によって決定される。\n\n装備は\n\n・攻撃性能\n・HP\n・MP\n・耐性\n・特殊効果\n・スタック関連効果\n\nを提供する。\n\n==================================================\n■ 装備スロット\n\n武器1\n武器2\n頭\n鎧\n手袋\n足\nアミュレット\n指輪1\n指輪2\nベルト\n\n合計10スロット\n\n==================================================\n■ ベルト\n\nベルトポーチを搭載する。\n戦闘アイテムを格納可能とする。\n\n==================================================\n■ アイテムレベル\n\nアイテムレベルは iLv と表記する。\nベースアイテムは iLv1 から iLv11 までを持つ。\n\niLvの管理対象\n\n・要求閾値\n・MOD予算\n・装備強度\n・ドロップ品質\n\n==================================================\n■ 装備条件\n\n適性制は採用しない。\n能力値閾値方式を採用する。\n\n==================================================\n■ 武器係数\n\n武器は STR、DEX、INT の武器係数を持つ。\n武器係数は要求閾値と基礎性能の算出に使用する固定値である。\n\n要求閾値 = iLv × 対応する武器係数\n\n武器攻撃力 = STR要求閾値 × 2\n命中力 = DEX要求閾値 × 2\n魔法上昇力 = INT要求閾値 × STR係数\n\n基礎クリティカル率 = 5%\n\n==================================================\n■ 武器係数一覧\n\n片手剣\nSTR6 / DEX3 / INT1\nタグ: WEAPON_SWORD / SLASH\n\n⸻\n\n大剣\nSTR12 / DEX3 / INT1\nタグ: WEAPON_GREATSWORD / SLASH\n\n⸻\n\n短剣\nSTR3 / DEX6 / INT1\nタグ: WEAPON_DAGGER / SLASH\n\n⸻\n\n片手斧\nSTR6 / DEX3 / INT1\nタグ: WEAPON_AXE / STRIKE\n\n⸻\n\n大斧\nSTR12 / DEX3 / INT1\nタグ: WEAPON_GREATAXE / STRIKE\n\n⸻\n\n槍\nSTR6 / DEX3 / INT1\nタグ: WEAPON_SPEAR / PIERCE\n\n⸻\n\n弓\nSTR3 / DEX6 / INT1\nタグ: WEAPON_BOW / PIERCE\n\n⸻\n\n大弓\nSTR6 / DEX3 / INT1\nタグ: WEAPON_GREATBOW / PIERCE\n\n⸻\n\n杖\nSTR3 / DEX1 / INT6\nタグ: WEAPON_STAFF\n\n⸻\n\nワンド\nSTR1 / DEX3 / INT6\nタグ: WEAPON_WAND\n\n⸻\n\n魔導書\nSTR1 / DEX3 / INT6\nタグ: WEAPON_BOOK\n\n⸻\n\n盾\nSTR6 / DEX3 / INT1\nタグ: WEAPON_SHIELD / STRIKE\n\n⸻\n\n矢筒\nSTR3 / DEX6 / INT1\nタグ: EQUIP_QUIVER\n\n==================================================\n■ ベースアイテム\n\nベースアイテムのレアリティはすべて NORMAL 固定とする。\nベースアイテムは武器種ごとに iLv1 から iLv11 まで作成する。\n\n==================================================\n■ iLv共通名称\n\niLv1  木の\niLv2  鉄の\niLv3  鋼鉄の\niLv4  銀の\niLv5  ダイヤの\niLv6  ミスリルの\niLv7  アダマンタイトの\niLv8  オリハルコンの\niLv9  巨人の\niLv10 竜の\niLv11 星鋼の\n\n名称は「iLv共通名称 + 武器名」で統一する。\n\n例\n\n木の剣\n鉄の剣\n鋼鉄の剣\n\n==================================================\n■ 両手持ち\n\n両手持ちに関する判定と処理は、独立した装備ルールを参照する。\n武器係数一覧では武器種と両手持ちを関連付ける一般化を行わない。\n\n==================================================\n■ 防具条件\n\n防具条件は VIT、MND、AGI を使用する。\n武器係数とは別体系として管理する。\n\n==================================================\n■ 防具カテゴリ\n\n重装\nスカウト装備\nローブ\n\n==================================================\n■ 重装\n\nVIT6 / MND3 / AGI1\n\n特徴\n高HP\n低MP\n前列向け\n\n==================================================\n■ スカウト装備\n\nAGI6 / VIT3 / MND1\n\n特徴\n中HP\n中MP\n回避系\n\n==================================================\n■ ローブ\n\nMND6 / INT3 / VIT1\n\n特徴\n低HP\n高MP\n魔法系\n\n==================================================\n■ 正式運用\n\n本書の武器係数、計算式、基礎クリティカル率、ベースアイテム名称を武器データ作成の正本とする。\nStudioへの登録形式はStudio側のスキーマで定義し、本書の値を変更しない。\n\n\n==================================================\n■ 装備生成フロー\n■ 目的\n\n装備生成処理の順序とベースアイテムの抽選対象を定義する。\n\n==================================================\n■ 生成順序\n\nBaseItem決定\n↓\niLv決定\n↓\nレアリティ決定\n↓\nMOD数決定\n↓\nMOD枠決定\n↓\nMOD抽選\n↓\nTier抽選\n↓\n完成\n\n==================================================\n■ ベースアイテム\n\nベースアイテムのレアリティは NORMAL 固定とする。\n武器ベースアイテムは武器種ごとに iLv1 から iLv11 まで存在する。\n名称、武器係数、要求閾値、基礎性能は本書の武器係数・iLv共通名称・計算式を参照する。\n\n==================================================\n■ 武器抽選\n\n片手剣\n大剣\n短剣\n片手斧\n大斧\n槍\n弓\n大弓\n杖\nワンド\n魔導書\n盾\n矢筒\n\n==================================================\n■ 防具抽選\n\n重装\nスカウト\nローブ\n\n==================================================\n■ アクセサリ抽選\n\n護符\n指輪\nベルト\n\n==================================================\n■ 参照規則\n\n武器種と両手持ちの判定を同一概念として扱わない。\n両手持ちの処理は独立した装備ルールを参照する。\n\n\n==================================================\n■ アクセサリーデータベース\n■ 基本方針\n\n\nアクセサリは\n\n\nベースアイテム\n\n\nを持つ\n\n\n==================================================\n\n\nベースアイテムは\n\n\n装備種別\n\n\niLv\n\n\nドロップテーブル\n\n\nを管理する\n\n\n==================================================\n\n\n性能差の大部分は\n\n\nMOD\n\n\nTier\n\n\nレアリティ\n\n\nによって発生する\n\n\n==================================================\n\n■ アミュレット系\n\n\n==================================================\n\n■ 銅の護符\n\n\nITEM_ID\n\n\nAMULET_COPPER\n\n\n==================================================\n\n\n推奨iLv\n\n\n1～5\n\n\n==================================================\n\n■ 銀の護符\n\n\nITEM_ID\n\n\nAMULET_SILVER\n\n\n==================================================\n\n\n推奨iLv\n\n\n6～15\n\n\n==================================================\n\n■ 金の護符\n\n\nITEM_ID\n\n\nAMULET_GOLD\n\n\n==================================================\n\n\n推奨iLv\n\n\n16～30\n\n\n==================================================\n\n■ 白金の護符\n\n\nITEM_ID\n\n\nAMULET_PLATINUM\n\n\n==================================================\n\n\n推奨iLv\n\n\n31～50\n\n\n==================================================\n\n■ 賢者の護符\n\n\nITEM_ID\n\n\nAMULET_SAGE\n\n\n==================================================\n\n\n推奨iLv\n\n\n51+\n\n\n==================================================\n\n■ アミュレット特殊ルール\n\n\n能力値MOD専用\n\n\n==================================================\n\n\nDAMAGE出現なし\n\n\n==================================================\n\n\nCRITICAL出現なし\n\n\n==================================================\n\n\nDEFENSE出現なし\n\n\n==================================================\n\n■ 指輪系\n\n\n==================================================\n\n■ 銅の指輪\n\n\nITEM_ID\n\n\nRING_COPPER\n\n\n==================================================\n\n\n推奨iLv\n\n\n1～5\n\n\n==================================================\n\n■ 銀の指輪\n\n\nITEM_ID\n\n\nRING_SILVER\n\n\n==================================================\n\n\n推奨iLv\n\n\n6～15\n\n\n==================================================\n\n■ 金の指輪\n\n\nITEM_ID\n\n\nRING_GOLD\n\n\n==================================================\n\n\n推奨iLv\n\n\n16～30\n\n\n==================================================\n\n■ 白金の指輪\n\n\nITEM_ID\n\n\nRING_PLATINUM\n\n\n==================================================\n\n\n推奨iLv\n\n\n31～50\n\n\n= nt】\nギルド冒険物語\n\nギルド施設システム設計書\n\nVersion 1.1\n\n==================================================\n■ 採用状態\n\n正式採用\n\n監査判断：AUD-002C\n決定ID：DEC-0007\n\n==================================================\n■ 基本方針\n\nギルド施設はプレイヤーの長期成長、利便性、育成、装備管理を担当する。\n\n施設は戦闘能力を直接上昇させない。\n\n役割分担は次のとおりとする。\n\n施設 ＝ 利便性・管理・育成導線\n装備 ＝ 戦闘性能\nスキル ＝ 戦術\n\n==================================================\n■ ギルドレベル\n\nギルドレベルは次の用途に使用する。\n\n・施設の段階的開放\n・倉庫容量の段階的増加\n・依頼開放条件\n・将来の施設強化上限\n\nギルドレベルの最大値、必要ギルド経験値、上昇条件は未確定とする。\n\n==================================================\n■ 施設開放\n\n施設そのものはギルドレベルによって段階的に開放する。\n\n各施設はrequired_guild_levelを持つ。\n\n具体的な開放レベルはバランス設計時に決定する。\n\n初期施設候補\n\n・酒場\n・訓練所\n・倉庫\n・掲示板\n\n将来施設候補\n\n・鍛冶場\n・研究所\n・図書館\n・宿舎\n\n==================================================\n■ 酒場\n\n酒場は冒険者管理施設とする。\n\n機能\n\n・キャラクター雇用\n・冒険者確認\n・パーティ編成\n・転職\n・冒険者解雇\n\nキャラクター雇用は訓練所では行わない。\n\n雇用可能なキャラクターの種類はゲーム進行度と連動する。\n\nストーリー本文を直接参照せず、共通進行度または共通フラグを参照する。\n\n==================================================\n■ 訓練所\n\n訓練所は育成施設とする。\n\n機能\n\n・レベル確認\n・能力値確認\n・スキル習得\n・AI編集\n\nAI機能は進行度による段階開放に対応できる構造とする。\n\nただし、具体的なAI開放段階、対象機能、ノード上限は現時点では未確定とする。\n\n未確定項目は無効データとして保持できる設計とし、PHPへ固定値を埋め込まない。\n\n==================================================\n■ 倉庫\n\n倉庫はアイテム保管施設とする。\n\n保管対象\n\n・装備\n・石板\n・素材\n\n倉庫容量は倉庫施設レベルではなく、ギルドレベル定義と直接連動する。\n\n容量候補\n\n・500\n・1000\n・2000\n・5000\n・10000\n\n上記数値とギルドレベルの具体的な対応はバランス設計時に決定する。\n\n==================================================\n■ 掲示板\n\n掲示板は依頼管理施設とする。\n\n機能\n\n・クエスト選択\n・クエスト確認\n・報酬確認\n\n==================================================\n■ 雇用可能キャラクターと雇用人数上限\n\n次の2要素を分離して管理する。\n\n雇用可能キャラクターの種類\n＝ゲーム進行度または共通フラグで開放\n\n雇用可能人数の上限\n＝ギルドまたは宿舎側の数値として管理\n\n初期雇用人数上限候補は20人とする。\n\n30人、50人、100人への増加候補は保持するが、対応条件は未確定とする。\n\n==================================================\n■ 共通解放条件\n\n施設、キャラクター、AI機能の解放条件は共通の解放条件データで管理する。\n\n対応条件タイプ候補\n\n・GUILD_LEVEL\n・PROGRESS\n・FLAG\n・QUEST_COMPLETED\n・FACILITY_UNLOCKED\n・FACILITY_LEVEL\n\n条件判定は共通サービスを通し、各施設PHPへ個別条件を固定記述しない。\n\n==================================================\n■ 推奨CSV\n\n・guild_levels.csv\n・guild_facilities.csv\n・guild_facility_levels.csv\n・guild_facility_features.csv\n・guild_upgrade_costs.csv\n・unlock_conditions.csv\n\nAI段階開放を独立管理する場合\n\n・ai_unlocks.csv\n\n==================================================\n■ 推奨セーブDB\n\n・player_guild\n・player_guild_facilities\n\n==================================================\n■ 実装方針\n\nCSVが定義を保持し、PHPが機能を実行する。\n\nPHPは次を担当する。\n\n・GuildService\n・FacilityService\n・CharacterUnlockService\n・UnlockConditionService\n・各Repository\n\n施設開放、雇用可能判定、AI機能開放の具体値をPHPへ直接埋め込まない。\n\n==================================================\n■ 未確定事項\n\n・ギルド経験値\n・ギルドレベル上限\n・施設の具体的な開放レベル\n・施設強化費用\n・強化素材\n・倉庫容量と各ギルドレベルの対応\n・雇用人数上限の増加条件\n・AI機能の具体的な段階開放\n・施設の建設時間および強化時間\n\n未確定事項は正式決定まで補完しない。\n\n\n==================================================\n■ 統合注記\n\n本仕様書は旧Version1.0の内容を確認し、重複を整理した統合版である。\nVersion1.0に含まれていた基本方針・施設の役割・施設強化方針は本書に包含されている。\n以後は本仕様書のみを正式仕様として扱い、旧Version1.0は参照しない。","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0037","title":"[WORLD] 11_WORLD領域構造設計書_Version1.0","status":"Approved","summary":"V9ライブラリ v2.0基準文書。WORLD / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 01_最新版/11_WORLD/11_WORLD領域構造設計書_Version1.0.txt\nsha256: 1e04c1f44f33acbca209d52f0875b2d1672063dfdcd46eb24932ca9ad0c737f9\nbytes: 2048\narea: WORLD / WORLD\nlibrary_status: ライブラリ収録\n\n【Original Content】\nギルド冒険物語\n\nWORLD領域構造設計書\n\nVersion 1.0\n\n==================================================\n■ 採用状態\n\n構造のみ正式採用\n内容は保留\n\n監査判断：AUD-002D\n決定ID：DEC-0008\n\n==================================================\n■ 目的\n\nWORLD領域は、物語進行に依存しない世界の固定定義を管理する。\n\n==================================================\n■ 管理対象\n\n・地域\n・拠点\n・地域接続\n・国家\n・勢力\n・種族\n・世界共通用語\n\n==================================================\n■ STORYとの分離\n\nSTORYは章、節、会話、出来事、加入、進行を管理する。\n\nWORLDは地域、拠点、接続、勢力などの固定定義を管理する。\n\nSTORYはWORLDのIDを参照できる。\n\nWORLDは特定の章または節へ依存しない。\n\n==================================================\n■ 初期データ構造\n\n正式採用\n\n・regions.csv\n・region_connections.csv\n\n==================================================\n■ 将来追加候補\n\n内容確定後に必要性を判断する。\n\n・factions.csv\n・faction_relations.csv\n・world_terms.csv\n・region_tags.csv\n\n==================================================\n■ 参照方針\n\nクエスト、イベント、モンスター、ストーリーは、地域名文字列ではなくregion_idを参照する。\n\n地域の存在と接続\n＝WORLD\n\n現在利用可能または移動可能か\n＝進行度、フラグ、クエスト条件などの共通解放条件\n\n==================================================\n■ 推奨PHP\n\n・RegionRepository\n・RegionConnectionRepository\n・RegionService\n\n==================================================\n■ 内容保留項目\n\n・世界地図\n・地域名\n・国家名\n・勢力名\n・種族設定\n・地域接続内容\n・世界用語\n・地域タグ\n・地域別モンスター\n・地域開放順\n・移動時間\n・ワールドマップUI\n\n元資料に存在しない内容を仕様ライブラリ側で補完しない。","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0038","title":"[MONSTER] 09_Enemy_Budget_Database_統合正式版_Version1.0","status":"Superseded","summary":"V9ライブラリ v2.0基準文書。モンスター / 統合済み。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 02_統合済み/03_データベース/09_Enemy_Budget_Database_統合正式版_Version1.0.txt\nsha256: 303243e14e5ed06fce19693b94530cceb34d73ac7973191bd4300c9a060a2bf6\nbytes: 7810\narea: MONSTER / モンスター\nlibrary_status: 統合済み\ndocument_id: DOC-034\nmanifest_title: Enemy_Budget_Database_統合正式版_Version1.0\n\n【Original Content】\n\\*;;\n\n\n\n\n\\\n\n\n\\\n\n\n\nEnemy Budget Database\n\\\n\n\n\\\n\n\n\nVersion 1.0\n\\\n\n\n\\\n\n\n\n\n\\\n\n\n\\\n\n\n\n==================================================\n\\\n\n \n\\\n\n\n\\\n\n\n\n\n\\\n\n\n\\\n\n\n\n==================================================\n\\\n\n\ n\\\n\n\n\\\n\n\n\n\n\\\n\n\n\\\n\n\n\n==================================================\n\\\n\n\n\\\n\n\n\nVersion 1.0\n\\\n\n\n\\\n\n\n\n\n\\\n\n\n\\\n\n\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0039","title":"[SKILL] 01_スキルシステム仕様_正式仕様ドラフト_v2","status":"Review","summary":"V9ライブラリ v2.0基準文書。スキル / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 03_戦闘_AI/Skill/01_スキルシステム仕様_正式仕様ドラフト_v2.md\nsha256: 2a5a0c80f9f7074cfa7f4a108bf42221d444e283e5c7f486cf1c83a29e333178\nbytes: 13623\narea: SKILL / スキル\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# V9 スキルシステム仕様（正式仕様ドラフト v2）\n\n## 0. 文書の位置付け\n\n本書は、V9ライブラリに現存する次の資料を統合し、正式採用済みの戦闘・AI・RANGE・状態・スタック仕様との整合を確認するためのドラフトである。\n\n- スキルデータベース Version 2.0\n- スキル予算テーブル設計書 Version 1.0\n- タグシステム設計書 Version 5.1\n- パッシブシステム設計書 Version 1.0\n- 戦闘・スキル・AI統合設計書 正式版\n\n原文は `00_現存設計原文/` に収録する。\n\n本書内の数値は、正式採用事項として明示されたものを除き、仮値・参考値・バランス調整対象として扱う。\n\n---\n\n## 1. 基本方針\n\n現存設計から、以下を構造仕様として継承候補とする。\n\n- 全スキルは Skill Budget で管理する。\n- Skill Budget はスキルレベルを基準とする。\n- 全スキルは予算配分を持つ。\n- スキル追加時は、共通予算項目の範囲内で設計する。\n- スキル、装備、パッシブ、MOD、モンスター、耐性は共通タグシステムを利用する。\n- Game、Studio、AI、戦闘計算は同一のスキル定義を参照する。\n- 数値式・係数・テンプレート配分率はバランス仕様へ分離する。\n\n---\n\n## 2. スキルの共通データ構造\n\nスキルは少なくとも次を持つ。\n\n- スキルID\n- 名称\n- スキルレベル\n- Skill Budget\n- 使用条件\n- 使用者条件\n- コスト定義\n- クールダウン定義\n- 基準対象条件\n- RANGE定義\n- タグ\n- 効果一覧\n- 状態付与要求\n- BUFF・DEBUFF要求\n- スタック操作要求\n- 派生ルール\n- AI利用可否\n- 表示情報\n- ルール版\n- データ版\n\n現存資料にある個別スキル名と配分値は、正式スキル一覧ではなく参考例として保持する。\n\n---\n\n## 3. Skill Budget\n\n### 3.1 構造（正式採用事項）\n\n- `Skill Budget = SLv` を構造仕様として固定する。\n- スキルレベル（SLv）を、全スキル共通の予算基準として維持する。\n- 全スキルはSkill Budgetを持ち、その範囲内で効果を構成する。\n- 予算項目名は現存名を正式名称として維持する。\n\n正式採用する予算項目:\n\n- DAMAGE\n- HEAL\n- RANGE\n- STATUS_RATE\n- DURATION\n- MP_EFFICIENCY\n- CD_EFFICIENCY\n\nスキルの効果に応じて、必要な予算項目を組み合わせる。\n\n### 3.2 数値の扱い\n\n`Skill Budget = SLv` という関係自体は正式な構造仕様とする。\n\n以下は現存資料に記載されているが、具体的な効果換算値としてはバランス調整対象とする。\n\n- 1予算あたりの威力・回復量\n- RANGE加算値\n- テンプレート配分率\n- 個別スキルの配分値\n- MP効率・CD効率の具体換算\n\n構造としては、全スキルが同じ予算体系を利用する方針を維持する。\n\n---\n\n## 4. スキル分類\n\n現存資料にある分類を参考分類として保持する。\n\n- 属性攻撃魔法\n- 物理スキル\n- 回復\n- BUFF\n- DEBUFF\n- 状態異常\n- DOT\n- 範囲スキル\n- 上位スキル\n- 蘇生\n- 特殊スキル\n\n分類は検索・整理・Studio表示に利用できる。\n実際の処理はタグ、効果定義、RANGE、使用条件によって決定する。\n\n---\n\n## 5. タグ連携\n\n現存タグ仕様に基づき、スキルは共通タグシステムを利用する。\n\n現存タグ例:\n\n- 武器: `WEAPON_SWORD`, `WEAPON_DAGGER`, `WEAPON_AXE`, `WEAPON_SPEAR`, `WEAPON_BOW`, `WEAPON_WAND`, `WEAPON_STAFF`, `WEAPON_BOOK`, `WEAPON_SHIELD`\n- 物理属性: `SLASH`, `STRIKE`, `PIERCE`\n- 魔法属性: `FIRE`, `ICE`, `LIGHTNING`, `WIND`, `EARTH`, `LIGHT`, `DARK`\n- 効果: `HEAL`, `BUFF`, `DEBUFF`\n\nこれらは現存タグ例であり、タグ仕様の正式化時に整理・更新できる。\n\n### 5.1 タグの役割\n\n- 使用条件の判定\n- パッシブ参照\n- 装備・MOD補正\n- 属性・効果相互作用\n- AI条件評価\n- 状態・BUFF・DEBUFF連携\n- 戦闘ログ分類\n\n---\n\n## 6. スキル実行フロー\n\n正式採用済み戦闘計算インターフェースと整合する実行フロー:\n\n1. 使用者確認\n2. スキル定義確認\n3. 使用条件確認\n4. 基準対象決定\n5. RANGEによる最終対象群生成\n6. 実行直前再検証\n7. コスト消費\n8. クールダウン開始\n9. 効果要求生成\n10. 戦闘計算インターフェースへ引渡し\n11. HP・MP・状態・BUFF・DEBUFF・スタック反映\n12. 派生ルール・パッシブ発火\n13. 戦闘不能判定\n14. ログ記録\n\n実行直前再検証に失敗した場合、原則としてコスト消費・クールダウン開始は行わない。\n\n---\n\n## 7. 対象とRANGE\n\n- プレイヤーまたはAIは基準対象を決定する。\n- RANGEは最終対象群を生成する。\n- AIはRANGE自体を変更しない。\n- 対象条件とRANGEは分離して管理する。\n- RANGEによる効果量補正は、対象生成処理と分離する。\n- RANGEは Skill Budget の構成要素として扱う。\n\n---\n\n## 8. AIとの連携\n\n正式採用済みAI仕様に基づく。\n\n- AIは、各キャラクターのアクションゲージが規定間隔進行するごとに、共通タグルールを再評価する。\n- AIは使用可能なスキルと基準対象を予約する。\n- 予約内容はプレイヤーへアイコン等で表示する。\n- 予約は次の判定地点で更新される。\n- 行動順到達時に最新予約を再検証する。\n- MP不足、クールダウン、対象不在、状態による一時的使用制限等で不成立の場合は即時再思考する。\n- AIは効果量、命中、ダメージ等を決定しない。\n\n---\n\n## 9. コストとクールダウン\n\n現存資料には MP_EFFICIENCY と CD_EFFICIENCY がある。\n\n構造として次を採用候補とする。\n\n- コスト定義と使用可能判定を分離する。\n- 実行成立後にコストを消費する。\n- 実行成立後にクールダウンを開始する。\n- MP以外のコストにも拡張可能な共通構造とする。\n- クールダウンはスキル単位で管理する。\n- コスト値、クールダウン値、減少単位はバランス仕様へ分離する。\n\n---\n\n## 10. 詠唱・チャージ・割込み（正式採用事項）\n\n詠唱、チャージ、割込みはスキル共通仕様に含める。\n\n### 10.1 詠唱\n\n- スキル実行前に必要な準備期間を持てる。\n- 詠唱中の状態を戦闘状態として管理する。\n- 詠唱完了後に実行直前再検証を行う。\n- 詠唱時間の具体値はバランス仕様へ分離する。\n\n### 10.2 チャージ\n\n- 一定期間の蓄積により効果内容または効果量を変化させられる。\n- チャージ段階をデータとして保持できる。\n- チャージ中断時の扱いはスキル定義で指定できる。\n- チャージ時間・段階・補正値はバランス仕様へ分離する。\n\n### 10.3 割込み\n\n- 詠唱中、チャージ中、実行直前等に割込み判定を行える。\n- 割込みの成立条件、優先順位、コスト返却、クールダウン発生は共通インターフェースで扱う。\n- 具体的な優先順位・返却率・発生条件は詳細仕様またはバランス仕様へ分離する。\n\n## 11. コスト拡張（正式採用事項）\n\nスキルコストはMPだけに限定しない。\n\n共通コスト構造として、少なくとも次へ拡張可能とする。\n\n- MP\n- HP\n- アクションゲージ\n- スタック\n- 専用リソース\n- アイテム\n- 複数コストの組合せ\n\n各コストは次を持つ。\n\n- コスト種別\n- 必要量\n- 支払条件\n- 消費タイミング\n- 返却条件\n- 不足時の失敗理由\n\n具体的な必要量・返却率はバランス仕様へ分離する。\n\n## 12. ダメージ・回復\n\nスキルは効果要求を戦闘計算インターフェースへ渡す。\n\n### ダメージ\n\n- DAMAGEまたはPOWER等の基礎効果\n- 物理・魔法・属性タグ\n- 発生源側補正\n- 対象側補正\n- 命中・回避・クリティカル\n- 状態・パッシブ・MOD連携\n\n### 回復\n\n- HEAL等の基礎効果\n- HEALタグ\n- 発生源側回復補正\n- 対象側被回復補正\n- 回復阻害\n- パッシブ・MOD連携\n\n具体式・係数・上限はバランス仕様へ分離する。\n\n---\n\n## 13. BUFF・DEBUFF\n\n正式採用済み状態・スタック仕様に基づく。\n\n- BUFF、DEBUFF、状態異常、スタックは別概念として管理する。\n- BUFF・DEBUFFは付与ごとに個別Tickを持つ。\n- 同系統効果は最も強いものだけを参照する。\n- 同系統効果量は加算しない。\n- 最強効果が終了した場合、残存する次点効果へ引き継ぐ。\n- スキルはBUFF・DEBUFF付与要求を生成する。\n- 効果量、持続Tick、成功性能はバランス仕様へ分離する。\n\n---\n\n## 14. 状態異常・DOT\n\n正式採用済み事項:\n\n- 状態異常耐性上限は75%。\n- 恒久的な完全無効・恒久的な付与禁止は設けない。\n- Tick期間中の沈黙・スタン等の一時的制限は許可する。\n- DOTは固定ダメージ方式。\n- DOTは各付与・各スタックを個別タイマーで管理する。\n\nスキルは状態付与要求またはDOT付与要求を生成する。\n個別状態異常名と具体効果は、現存資料の参考例であり、個別正式採用は別途行う。\n\n---\n\n## 15. スタック\n\n- スタックは状態異常・BUFF・DEBUFFとは独立した汎用リソース。\n- スキルはスタックの生成、加算、減算、消費、移動、複製、消滅を要求できる。\n- スタックを使用条件、効果量入力、派生発火条件として参照できる。\n- 最大値、獲得量、消費量、持続Tickはバランス仕様へ分離する。\n\n---\n\n## 16. パッシブとの連携\n\n現存パッシブ仕様では、パッシブは常時発動効果であり、共通タグを参照する。\n\nスキルとの連携候補:\n\n- 武器タグによる補正\n- 物理属性タグによる補正\n- 魔法属性タグによる補正\n- HEAL補正\n- BUFF補正\n- DEBUFF補正\n- 状態異常・DOT補正\n- MP消費補正\n- AG獲得補正\n\n現存する個別パッシブ名と効果値は参考例として保持する。\nパッシブ仕様そのものの正式化は別工程とする。\n\n---\n\n## 17. Studioの責務\n\nStudioは少なくとも次を編集・検証できる。\n\n- スキルID・名称\n- スキルレベル\n- Skill Budget\n- 予算配分\n- タグ\n- 使用条件\n- コスト\n- クールダウン\n- 対象条件\n- RANGE\n- 効果一覧\n- 状態・BUFF・DEBUFF・スタック要求\n- AI利用可否\n- 派生ルール\n- 表示情報\n\nStudioは正式Gameと同一データ形式、同一ルール版、同一計算基盤を使用する。\n\n---\n\n## 18. Gameの責務\n\nGameは正式スキルデータを読み込み、共通処理へ渡す。\n\n- 使用可能判定\n- 対象・RANGE解決\n- コスト・クールダウン処理\n- 効果要求生成\n- 戦闘計算呼出\n- 状態・BUFF・DEBUFF・スタック反映\n- AI予約表示\n- ログ出力\n\nUIへ計算ロジックを持たせない。\n\n---\n\n## 19. ログと決定性\n\nスキルログは少なくとも次を記録する。\n\n- Tick\n- 処理ID\n- 使用者\n- スキルID\n- 基準対象\n- 最終対象群\n- 使用条件結果\n- コスト変化\n- クールダウン変化\n- 実行タグ\n- 効果要求\n- 最終結果\n- 状態・BUFF・DEBUFF・スタック変化\n- 派生処理\n- Seed\n- ルール版\n\n同一入力、同一Seed、同一ルール版では同じ結果を再現できる構造とする。\n\n---\n\n## 20. 現存資料の参考例\n\n次は削除せず、参考例として原文に保持する。\n\n- ファイアボルト等の属性攻撃魔法\n- パワースラッシュ等の物理スキル\n- ヒール、ハイヒール等の回復\n- ブレス、プロテクト、ヘイスト等のBUFF\n- ポイズン、フリーズ、サイレンス等の状態異常例\n- ファイアストーム等の範囲スキル\n- メテオ等の上位スキル\n- 各Skill Budget配分例\n- 各テンプレート配分率\n\nこれらは現存設計の具体例であり、個別内容・数値を正式採用したものではない。\n\n---\n\n## 21. 正式採用済み事項\n\n- 全スキルを共通Skill Budgetで設計する。\n- `Skill Budget = SLv` を構造仕様として固定する。\n- スキルレベルを全スキル共通の予算基準として維持する。\n- 予算項目名は現存名を維持する。\n- 全スキルが予算配分を持つ。\n- スキルは共通タグシステムを利用する。\n- スキル実行は共通戦闘計算インターフェースへ接続する。\n- AIはスキルと基準対象を予約し、行動直前に再検証する。\n- 対象選択とRANGEを分離する。\n- BUFF・DEBUFF・状態異常・スタックの正式ルールを継承する。\n- 詠唱・チャージ・割込みをスキル共通仕様へ含める。\n- コストをMP以外へ拡張可能な共通構造とする。\n- GameとStudioが同一スキルデータ・同一処理を利用する。\n- 数値・配分率・個別例をバランス仕様へ分離する。\n\n## 22. 判断・保留事項\n\n- 蘇生を通常スキル共通処理に含めるか、特殊処理として分離するかは、バランス・詳細設計で判断する。\n- 同一スキルの複数効果を一つのBudgetで管理するかは、具体的な実装案・作例を作成してから判断する。\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0040","title":"[SKILL] 02_バランス調整項目一覧","status":"Review","summary":"V9ライブラリ v2.0基準文書。スキル / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 03_戦闘_AI/Skill/02_バランス調整項目一覧.md\nsha256: c07307013fa945998d7646cde16398e0bbf288780f81a64bcbd056d14b7a26b6\nbytes: 882\narea: SKILL / スキル\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# スキル バランス調整項目一覧\n\n以下は現存資料に記載されているが、正式採用事項として明示されるまで仮値・参考値として扱う。\n\n- Skill BudgetとSLvの具体換算\n- DAMAGE換算\n- HEAL換算\n- RANGE換算\n- STATUS_RATE換算\n- DURATION換算\n- MP_EFFICIENCY換算\n- CD_EFFICIENCY換算\n- テンプレート配分率\n- 個別スキルBudget\n- 個別スキル威力\n- MPコスト\n- クールダウン\n- 状態成功率\n- 持続Tick\n- RANGE倍率\n- DOT威力・間隔・持続\n- BUFF・DEBUFF効果量\n- 蘇生回復量\n\n## 追加バランス・詳細設計項目\n\n- 蘇生を共通処理または特殊処理として扱う判断\n- 蘇生コスト・回復量・制限\n- 詠唱時間\n- チャージ段階・補正\n- 割込み条件・優先順位\n- 割込み時のコスト返却・クールダウン\n- MP以外の各コスト量\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0041","title":"[SKILL] 03_正式採用・修正判断チェックリスト","status":"Review","summary":"V9ライブラリ v2.0基準文書。スキル / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 03_戦闘_AI/Skill/03_正式採用・修正判断チェックリスト.md\nsha256: 6d59ac3e6eb721812e3d06f3e1745c2ab9dec0210254e22b5dcb73c499018a77\nbytes: 1531\narea: SKILL / スキル\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# 正式採用・修正判断チェックリスト\n\n各項目を「採用」「修正」「保留」で判断する。\n\n1. 全スキルをSkill Budgetで管理する。\n2. 全スキルが予算配分を持つ。\n3. Skill Budgetの基準をSLvとする。\n4. DAMAGE / HEAL / RANGE / STATUS_RATE / DURATION / MP_EFFICIENCY / CD_EFFICIENCYを共通項目とする。\n5. スキルは共通タグシステムを利用する。\n6. スキル実行を共通戦闘計算へ接続する。\n7. 対象選択とRANGEを分離する。\n8. AIはスキルと基準対象を予約する。\n9. BUFF・DEBUFF・状態異常・スタックの正式ルールを継承する。\n10. GameとStudioが同一データ・処理を使用する。\n11. 個別スキル例を参考例として保持する。\n12. 数値・配分率をバランス仕様へ分離する。\n13. 蘇生を共通処理に含めるか。\n14. 詠唱・チャージ・割込みを含めるか。\n15. MP以外のコストへ拡張するか。\n\n16. `Skill Budget = SLv` を構造として固定する。【採用】\n17. SLvを全スキル共通の予算基準とする。【採用】\n18. 予算項目名を現存名のまま維持する。【採用】\n19. 詠唱・チャージ・割込みを共通仕様へ含める。【採用】\n20. MP以外のコストへ拡張する。【採用】\n21. 蘇生の共通・特殊処理区分はバランス・詳細設計で判断する。【保留】\n22. 複数効果を一つのBudgetで管理するかは作例作成後に判断する。【保留】\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0042","title":"[SKILL] 04_レビュー・修正履歴","status":"Review","summary":"V9ライブラリ v2.0基準文書。スキル / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 03_戦闘_AI/Skill/04_レビュー・修正履歴.md\nsha256: a9e9b51d2267612ec3dfc9fddda741a4f425a64ea34a498a27c63600dabf8d20\nbytes: 892\narea: SKILL / スキル\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# レビュー・修正履歴\n\n## Draft v1\n- 現存スキルDB Version 2.0を原文収録。\n- 現存スキル予算表 Version 1.0を原文収録。\n- タグ仕様 Version 5.1を参照。\n- パッシブ仕様 Version 1.0を参照。\n- 正式採用済み戦闘・AI・RANGE・状態・スタック仕様との接続を整理。\n- 個別スキル名・数値・予算配分率は参考例・バランス項目へ分離。\n\n## Draft v2\n- Skill Budget = SLvを構造仕様として正式採用。\n- SLvを全スキル共通の予算基準として正式採用。\n- 予算項目名を現存名のまま維持。\n- 詠唱・チャージ・割込みをスキル共通仕様へ追加。\n- MP以外のコストへ拡張可能な共通構造を追加。\n- 蘇生の処理区分をバランス・詳細設計へ保留。\n- 複数効果のBudget管理は作例作成後に判断する方針へ変更。\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0043","title":"[SKILL] 05_機械可読仕様","status":"Approved","summary":"V9ライブラリ v2.0基準文書。スキル / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 03_戦闘_AI/Skill/05_機械可読仕様.json\nsha256: f6f5b95d7290e42987d932e2f39f39335b6673bd033beb63bfdbf770c06087d9\nbytes: 1538\narea: SKILL / スキル\nlibrary_status: ライブラリ収録\n\n【Original Content】\n{\n  \"document\": \"V9 スキルシステム仕様\",\n  \"version\": \"draft-2\",\n  \"status\": \"PENDING_REVIEW\",\n  \"source_documents\": [\n    \"04_スキルデータベース_Version2.0.txt\",\n    \"04_スキル予算テーブル設計書_Version1.0.txt\",\n    \"05_タグシステム設計書_Version5.2.txt\",\n    \"02_パッシブシステム設計書_Version1.0.txt\",\n    \"01_戦闘・スキル・AI統合設計書_正式版.md\"\n  ],\n  \"preserves_original_sources\": true,\n  \"skill_budget_fields\": [\n    \"DAMAGE\",\n    \"HEAL\",\n    \"RANGE\",\n    \"STATUS_RATE\",\n    \"DURATION\",\n    \"MP_EFFICIENCY\",\n    \"CD_EFFICIENCY\"\n  ],\n  \"uses_common_tags\": true,\n  \"uses_common_battle_calculation\": true,\n  \"uses_latest_ai_reservation\": true,\n  \"uses_formal_range_spec\": true,\n  \"uses_formal_status_stack_spec\": true,\n  \"numeric_examples_are_formal\": false,\n  \"numeric_examples_are_reference\": true,\n  \"review_required\": [\n    \"skill_budget_equals_slv\",\n    \"resurrection_common_or_special\",\n    \"casting_charging_interrupt\",\n    \"non_mp_costs\",\n    \"multi_effect_budget_model\"\n  ],\n  \"adopted_decisions\": {\n    \"skill_budget_equals_slv\": true,\n    \"slv_is_common_budget_basis\": true,\n    \"preserve_existing_budget_field_names\": true,\n    \"casting_in_common_spec\": true,\n    \"charging_in_common_spec\": true,\n    \"interrupt_in_common_spec\": true,\n    \"non_mp_costs_supported\": true\n  },\n  \"deferred_decisions\": {\n    \"resurrection_common_or_special\": \"balance_and_detail_design\",\n    \"multi_effect_single_budget\": \"decide_after_examples_and_implementation_model\"\n  }\n}","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0044","title":"[STATUS] 01_状態・スタック仕様_正式版_v1.0","status":"Approved","summary":"V9ライブラリ v2.0基準文書。BUFF・状態異常・スタック / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 03_戦闘_AI/StatusStack/01_状態・スタック仕様_正式版_v1.0.md\nsha256: d6f10a3f0ed357fc08b535ec483425b32f4551b72ae7f8ddde38b0a7b1040c50\nbytes: 18630\narea: STATUS / BUFF・状態異常・スタック\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# 正式採用\n\n# V9 状態・スタック仕様（正式版 Version 1.0）\n\n## 0. 文書の位置付け\n\n本書は、V9ライブラリに現存する以下の設計を統合し、現在の正式採用済み戦闘仕様との整合性を確認するためのドラフトである。\n\n- 状態異常システム設計書 Version 1.0\n- スタックシステム設計書 Version 1.1\n- スキルデータベース Version 2.0\n- DOT・状態異常予算テーブル Version 1.0\n\n現存設計の内容は本ZIP内の `00_現存設計原文/` に原文のまま収録する。\n本ドラフトでは、現存設計を次の3区分で扱う。\n\n1. 構造仕様として継承する内容\n2. 最新の正式仕様に合わせて表現を更新する候補\n3. 数値・推奨値としてバランス仕様へ分離する内容\n\n---\n\n\n## 全システム共通原則（正式採用事項）\n\n以下は状態異常に限らず、戦闘・スキル・装備・MOD・AI・ビルド全体へ適用する。\n\n- 耐性・軽減・抑制等の上限は、原則として **75%** とする。\n- 恒久的な完全無効は採用しない。\n- 恒久的な使用禁止、発動禁止、付与禁止、対象禁止等の完全封鎖は採用しない。\n- 特定のスキル、装備、MOD、AI構成、ビルドを恒久的に機能停止させる設計は採用しない。\n- 対策は、効果低減、持続短縮、成功性能低下、コスト増加、条件変更等で表現する。\n- すべての正式要素に、少なくとも一つ以上の有効な使用場面または役割を持たせる。\n- 「死にスキル」「死に装備」「死にMOD」「死にビルド」を作らない。\n\n### 期間限定制限の例外\n\n状態異常、BUFF、DEBUFF、ギミック等による **Tick期間中だけの一時的な禁止・制限** は許可する。\n\n例:\n\n- 沈黙中のスキル使用禁止\n- スタン・睡眠・凍結中の行動禁止\n- 挑発中の対象選択制限\n\nこれらは持続終了または解除によって解消され、耐性によって実効期間を短縮できる。\n恒久的な完全封鎖とは区別する。\n\n\n## 1. 基本方針\n\n### 1.1 状態異常\n\n現存設計では、状態異常を戦闘中に付与される特殊効果とし、タグシステムで管理する。\n\n\n### 1.2 スタック\n\n現存設計では、スタックを戦闘中に蓄積される特殊リソースとする。\n\nスタックは能力値とは独立し、装備、MOD、スキル、石板、モンスター等から獲得できる。\n\n### 1.3 Tick基準\n\n現存設計では、スタック、BUFF、DEBUFF、DOT、状態異常、CooldownをTick基準で管理する。\n\nこの構造は、正式採用済みのTick・アクションゲージ戦闘構造と両立する。\n\n---\n\n## 2. 状態異常の分類と参考例\n\n状態異常、BUFF、DEBUFF、スタックは、同一のものとして扱わず、それぞれ独立した管理概念とする。\n\n現存資料に記載されていた以下の分類・個別効果は、正式採用済み一覧ではなく、**設計検討時の参考例**として保持する。\n\n### 参考例\n\n- DOT系: 毒、燃焼、出血\n- 行動阻害系: 睡眠、スタン、凍結\n- 能力阻害系: 沈黙、暗闇、呪い\n- 特殊系: 感電、挑発、HEAL阻害\n\nこれらの名称、分類、個別効果は、そのまま正式採用されたものではない。\n将来、個別状態異常を正式化する際に、各項目を個別にレビュー・採用する。\n\n参考例は削除せず、設計履歴および候補例として保持する。\n---\n\n## 3. 状態異常の共通データ\n\n現存設計および正式採用済み戦闘計算インターフェースとの接続に必要な項目をまとめる。\n\n- 状態ID\n- 名称\n- 分類\n- 付与者ID\n- 対象ID\n- タグ\n- 付与Tick\n- 残り持続時間または残り回数\n- 強度\n- スタック情報\n- 発火タイミング\n- 上書き規則\n- 延長規則\n- 独立管理規則\n- 解除条件\n- 付与時ルール\n- 継続時ルール\n- 解除時ルール\n- ルール版\n\n強度、持続値、成功率、最大数等の具体値はバランス仕様へ分離する。\n\n---\n\n## 4. 状態異常耐性（正式採用事項）\n\n- 状態異常耐性の上限は **75%** とする。\n- 状態異常を恒久的に完全無効化する仕様は存在しない。\n- 状態異常の恒久的な付与禁止は存在しない。\n- 耐性は主として、状態異常の実効持続時間や有効性能を低減する。\n- 耐性が上限に達していても、状態異常そのものは成立し得る。\n- 沈黙、スタン、睡眠、凍結等によるTick期間中の一時的な行動・使用制限は許可する。\n- 具体的な持続時間計算式、最低有効期間、丸め方法は詳細仕様で定義する。\n---\n\n## 5. DOT共通仕様\n\n現存設計では、DOTに次の共通仕様がある。\n\n- 固定ダメージ方式\n- 割合ダメージは採用しない\n- スタック可能\n- 各スタックを個別タイマーで管理\n- DOT耐性はダメージ量を減少させず、持続時間を短縮する\n\n現存パラメータ名:\n\n- `DOT_POWER`\n- `DOT_INTERVAL`\n- `DOT_DURATION`\n- `DOT_MAX_STACK`\n- `DOT_STACK`\n\nこれらの項目名は、Studio・Game・戦闘計算間のデータ項目候補として維持する。\n具体値はバランス仕様へ分離する。\n\n---\n\n## 6. 個別状態異常の参考例（未採用）\n\n以下は現存資料由来の参考例であり、個別仕様として正式採用されたものではない。\n\n\n### 6.1 毒\n\n- タグ: `DEBUFF`\n- 継続ダメージ\n- スタック可能\n- 個別タイマー管理\n\n### 6.2 燃焼\n\n- タグ: `DEBUFF`, `FIRE`\n- 継続ダメージ\n- スタック可能\n- 個別タイマー管理\n\n### 6.3 出血\n\n- タグ: `DEBUFF`\n- 継続ダメージ\n- スタック可能\n- 個別タイマー管理\n\n### 6.4 睡眠\n\n- タグ: `DEBUFF`\n- 行動不能\n- 被ダメージ時解除\n\n### 6.5 スタン\n\n- タグ: `DEBUFF`\n- 完全行動不能\n- 被ダメージでは解除されない\n\n### 6.6 凍結\n\n- タグ: `DEBUFF`, `ICE`\n- 完全行動不能\n- 被ダメージでは解除されない\n\n### 6.7 沈黙\n\n- タグ: `DEBUFF`\n- スキル使用不可\n- 通常攻撃は可能\n\n### 6.8 暗闇\n\n- タグ: `DEBUFF`\n- 命中性能を低下させる\n\n具体的な低下値はバランス仕様へ分離する。\n\n### 6.9 呪い\n\n- タグ: `DEBUFF`, `DARK`\n- 与ダメージ性能を低下させる\n- 回復効果を低下させる\n\n### 6.10 感電\n\n- タグ: `DEBUFF`, `LIGHTNING`\n- 行動速度またはAG獲得性能を低下させる\n\n具体的な作用量と実装項目はバランス・詳細仕様で決定する。\n\n### 6.11 挑発\n\n- タグ: `DEBUFF`\n- 対象選択へ作用する\n- 挑発元を優先対象とする\n\n挑発はRANGEを変更せず、AIまたは対象選択処理の基準対象決定へ作用する。\n\n### 6.12 HEAL阻害\n\n- タグ: `DEBUFF`\n- 回復性能を低下させる\n- 回復を完全無効化しない\n\n---\n\n## 7. 状態異常・BUFF・DEBUFF・スタックの分離\n\n- 状態異常: 特殊な状態変化を管理する。\n- BUFF: 有利な一時効果を管理する。\n- DEBUFF: 不利な一時効果を管理する。\n- スタック: 数量を蓄積・消費する汎用リソースを管理する。\n\nBUFF・DEBUFFの重ねがけは「最強効果のみ参照する個別Tick方式」であり、スタックの加算・消費とは別処理である。\n\n## 7. スタックの共通データ\n\n現存設計に基づく共通項目:\n\n- スタックIDまたはスタック名\n- 所有者ID\n- 発生源ID\n- 現在値\n- 最大値\n- 持続時間\n- 獲得量\n- 消費量\n- 発火条件\n- 親タグ\n- 付与Tick\n- 残りTick\n- 消滅条件\n- ルール版\n\n現存パラメータ名:\n\n- `STACK_GAIN`\n- `STACK_DURATION`\n- `MAX_STACK`\n- `STACK_CONSUME`\n- `STACK_TRIGGER`\n\n基本的な増減構造は次のとおり。\n\n```text\n更新後スタック\n=\n現在値\n+ 獲得量\n- 消費量\n```\n\n最大値を超える場合の上限制御を持つ。\n具体的な最大値や獲得量はバランス仕様へ分離する。\n\n---\n\n## 8. スタックの持続管理\n\n現存設計では、スタック持続時間をTickで管理する。\n\n- 残存Tickを保持する。\n- Tick進行により残存時間を減少させる。\n- 0以下で消滅する。\n\nDOTスタックについては、状態異常設計に基づき各スタックが独立したタイマーを持つ。\n\n通常の汎用スタックについて、全量共有タイマーと個別タイマーのどちらを採用するかは、スタック定義ごとに明示する構造が安全である。\n\n---\n\n## 9. スタックカテゴリ\n\n現存設計に記載されたカテゴリ:\n\n- 攻撃系\n- 防御系\n- 支援系\n- 状態異常系\n- 特殊系\n\n現存例:\n\n- 攻撃系: `BURN_STACK`, `FURY_STACK`, `BLOOD_STACK`\n- 防御系: `GUARD_STACK`, `FORTIFY_STACK`\n- 支援系: `HOLY_STACK`, `ARCANE_STACK`\n- 状態異常系: `POISON_STACK`, `CURSE_STACK`\n- 特殊系: `SOUL_STACK`, `CHAOS_STACK`\n\nカテゴリは整理・検索・Studio表示に使用できる。\nゲーム内の判定はタグとルールを基準にする。\n\n---\n\n## 10. スタック獲得・消費・発火\n\n### 10.1 獲得契機\n\n現存設計に記載された例:\n\n- スキル命中\n- クリティカル発生\n- 状態異常付与\n- 被弾\n- 回復\n- 条件達成\n\n### 10.2 発火\n\n一定値到達時に自動発動できる。\n\n発火処理は共通タグルールとして定義し、発火後のスタック消費、維持、全消費等を設定できる構造とする。\n\n### 10.3 消費\n\n- 任意量消費\n- 全消費\n- 条件付き消費\n- スキル実行による消費\n\n具体的な消費量はスキルまたはバランスデータで定義する。\n\n### 10.4 同時発生と優先順位\n\n現存設計にはトリガー優先順位および同時発生の章がある。\n最新の戦闘計算インターフェースでは、派生処理を独立した処理IDとして記録し、決定可能な順序で処理する。\n\n具体的な同順位規則と発火上限は安全・詳細仕様として保留する。\n\n---\n\n## 11. 他システムとの関係\n\n### 11.1 スキル\n\nスキルは状態付与、状態解除、スタック獲得、スタック消費、スタック参照を実行できる。\n\nスキルデータベースに現存する状態異常・BUFF・範囲等の定義は、状態・スタック処理の呼出元となる。\n\n### 11.2 BUFF・DEBUFF（正式採用事項）\n\nBUFFとDEBUFFは、状態異常およびスタックとは分離して管理する。\n\n#### 共通重ねがけルール\n\n- 同系統のBUFFまたはDEBUFFは、付与ごとに個別の残存Tickを持つ。\n- 複数付与されても、効果量を加算しない。\n- 同時に存在する同系統効果のうち、最も効果が強いものだけを実効値として参照する。\n- 最も強い効果が終了・解除された場合、残っている効果の中で次に強いものへ自動的に引き継ぐ。\n- 弱い効果も消去せず、それぞれの残存Tickを個別に進行させる。\n- 同値の場合の参照優先順位は、決定可能な共通規則で処理する。\n- BUFFとDEBUFFは互いに別系統として管理し、同じ系統内で上記ルールを適用する。\n\n#### 処理例\n\n```text\n同系統効果A: 効果30 / 残り20Tick\n同系統効果B: 効果20 / 残り50Tick\n\n現在参照する効果: Aの30\n↓\nAが終了\n↓\n現在参照する効果: Bの20\n```\n\nこの仕組みは「加算スタック」ではない。\nスタックシステムは別の汎用蓄積機構として管理する。\n\n状態異常にBUFFまたはDEBUFFのタグを必須付与する共通規則は設けない。\n状態異常、BUFF、DEBUFFの関係は個別仕様またはタグ定義で明示する。\n### 11.3 MOD・装備・石板\n\n現存設計では、スタックは装備、MOD、石板等から獲得できる。\nこれらは共通タグルールを通してスタック操作要求を発生させる。\n\n### 11.4 モンスター・ボス\n\nモンスターおよびボスも、プレイヤーユニットと同じ状態・スタック基盤を使用する。\n専用効果は個別タグルールとデータで表現する。\n\n### 11.5 Enemy Budget / Skill Budget\n\n現存するDOT・状態異常予算テーブルでは、全状態異常をSkill Budgetで管理する。\n\n構造として次を継承候補とする。\n\n- 状態異常スキルも通常スキルと同一のBudget設計を使用する。\n- 成功性能、持続性能、DOT効果、MP効率、Cooldown効率等をBudget配分要素として扱える。\n- 具体的配分率、Budget例、成功率、持続値等はバランス仕様へ分離する。\n\n---\n\n## 12. AIとの関係（正式採用事項）\n\n現存設計には「AI CONDITIONにて判定可能」と記載されている。\n\n最新の正式採用済みAI仕様では、AI専用の旧 `CONDITION` 表現ではなく、共通タグルールを評価して行動を予約する。\n\n正式仕様として、次の表現へ更新する。\n\n- AIは自身、味方、敵の状態タグを共通タグルールの条件として参照できる。\n- AIはスタックの有無、現在数、閾値到達を条件として参照できる。\n- 状態・スタックの変化は、各キャラクターのAG進行に伴う次回AI判定で予約内容へ反映される。\n- 行動順到達時の予約再検証でも、状態・スタック条件を確認する。\n- 行動不能、沈黙、対象不在等で予約が不成立になった場合、AIは即時再思考する。\n\nこれは正式採用済みのAI行動予約仕様との整合を取る更新であり、正式採用事項とする。\n\n---\n\n## 13. 戦闘計算インターフェースとの接続\n\n正式採用済み戦闘計算インターフェースに基づき、状態・スタック処理は次の責務を持つ。\n\n### 13.1 状態付与要求\n\n入力:\n\n- 状態ID\n- 付与者\n- 対象\n- 付与側補正\n- 対象側耐性\n- タグ相互作用\n- 強度\n- 持続定義\n- スタック定義\n- Seed\n\n処理:\n\n1. 状態定義確認\n2. 対象適格性確認\n3. 付与成功判定\n4. 状態異常耐性による実効持続時間調整\n5. 上書き・延長・独立スタック規則\n6. 持続・強度設定\n7. 付与時ルール発火\n8. ログ記録\n\n### 13.2 スタック操作要求\n\n操作種別:\n\n- 生成\n- 加算\n- 減算\n- 消費\n- 移動\n- 複製\n- 消滅\n\n各操作は処理IDを持ち、入力・結果・派生処理をログへ記録する。\n\n---\n\n## 14. Studioの責務\n\nStudioは少なくとも次を編集・検証できる構造を持つ。\n\n### 状態\n\n- 状態ID・名称\n- 分類\n- タグ\n- 付与条件\n- 持続方式\n- 上書き・延長規則\n- 個別タイマー設定\n- 発火タイミング\n- 解除条件\n- 付与・継続・解除時アクション\n\n### スタック\n\n- スタックID・名称\n- カテゴリ\n- 親タグ\n- 最大値\n- 持続方式\n- 獲得・消費・消滅条件\n- 閾値トリガー\n- 発火アクション\n\nStudioはGameと同一のデータ形式とルール版でプレビュー・検証する。\n\n---\n\n## 15. Gameの責務\n\nGameは正式データを読み込み、次を実行する。\n\n- Tick進行に伴う持続更新\n- 状態付与・解除\n- スタック増減・消費\n- DOT等の周期発火\n- タグルール発火\n- AI予約再評価に必要な状態の公開\n- 戦闘ログ出力\n- 戦闘不能・勝敗処理への結果反映\n\nGameは仕様値をUIへ直接埋め込まず、正式データと共通処理を使用する。\n\n---\n\n## 16. ログと決定性\n\n状態・スタックログは少なくとも次を記録する。\n\n- Tick\n- 処理ID\n- 親処理ID\n- 状態またはスタックID\n- 発生源\n- 所有者\n- 操作種別\n- 変更前\n- 変更後\n- 持続時間変化\n- 発火ルールID\n- 解除・消滅理由\n- Seed\n- ルール版\n\n同一入力、同一Seed、同一ルール版では同一結果を再現できるよう、評価順と発火順を決定可能にする。\n\n---\n\n## 17. バランス仕様へ分離する現存数値\n\n現存資料に記載されている以下は削除せず、別紙のバランス項目として保持する。\n\n- 状態異常耐性上限75%を前提とした実効持続時間の具体式\n- DOT_POWER\n- DOT_INTERVAL\n- DOT_DURATION\n- DOT_MAX_STACK\n- STACK_GAIN推奨値\n- MAX_STACK標準値・高性能値\n- STACK_DURATION短期・標準・長期値\n- STACK_CONSUME推奨値\n- 状態異常Budget配分率\n- 個別状態異常のBudget例\n- 状態付与成功率\n- 持続値\n- DOT効果量\n- MP効率\n- Cooldown効率\n\nこれらは現存設計の一部だが、正式構造仕様ではなく、将来のバランス調整時に採否・更新を判断する。\n\n---\n\n## 18. 現存設計からの更新候補一覧\n\n正式採用前に判断が必要な更新候補:\n\n1. `AI CONDITION` は「共通タグルールによるAI判定」へ正式更新する。\n2. 状態異常耐性上限は75%として正式採用する。\n3. 状態異常の完全無効・付与禁止は正式仕様から排除する。\n4. 状態異常耐性の具体的な持続時間計算式はバランス・詳細仕様へ分離する。\n5. スタック推奨値・標準値をバランス仕様へ移す。\n6. DOT・状態異常予算テーブルの配分率と例をバランス仕様へ移す。\n7. 挑発はRANGEではなく基準対象選択へ作用すると明記する。\n8. 感電の「行動速度低下」を、AG獲得性能への作用として正式に統一するか判断する。\n9. 状態異常と通常DEBUFFの分類表示をタグで区別するか判断する。\n10. 汎用スタックの持続方式を、共有タイマー・個別タイマーから定義ごとに選択可能とするか判断する。\n\n---\n\n## 19. 採用判断\n\n本ドラフトは、現存設計を削除せず統合した上で、最新正式仕様と矛盾する表現のみを更新候補として提示している。\n\n確認時には次を判断する。\n\n- 現存する個別状態異常例は参考例として保持し、個別採用は別途判断する\n- 状態異常耐性上限75%と、完全無効・付与禁止を設けない原則は正式採用済み\n- DOTの固定ダメージ・個別タイマー方式を正式継承するか\n- スタックを独立リソースとして正式継承するか\n- AI連携表現は最新仕様へ更新済み・正式採用\n- 数値・推奨値をバランス仕様へ分離するか\n- 更新候補6～8を採用・修正・保留のどれにするか\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0045","title":"[STATUS] 02_バランス調整項目一覧","status":"Review","summary":"V9ライブラリ v2.0基準文書。BUFF・状態異常・スタック / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 03_戦闘_AI/StatusStack/02_バランス調整項目一覧.md\nsha256: 18cb766f9d86b82844aadb159cb9f85517426d213314389e70828a0785b725e4\nbytes: 1178\narea: STATUS / BUFF・状態異常・スタック\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# 状態・スタック バランス調整項目一覧\n\n## 現存資料から分離する項目\n\n### 状態異常耐性\n- 耐性上限は75%として正式採用済み\n- 75%上限を前提とした実効持続時間の計算式\n- 最小持続時間\n- 丸め方法\n- 完全無効・付与禁止は採用しない\n\n### DOT\n- DOT_POWER\n- DOT_INTERVAL\n- DOT_DURATION\n- DOT_MAX_STACK\n- 個別DOTの威力\n- 個別DOTの間隔\n- 個別DOTの持続\n- 個別DOTの最大スタック\n\n### スタック\n- STACK_GAIN推奨値\n- MAX_STACK標準値\n- MAX_STACK高性能値\n- STACK_DURATION短期値\n- STACK_DURATION標準値\n- STACK_DURATION長期値\n- STACK_CONSUME推奨値\n- 発火閾値\n- 発火後の消費量\n\n### 状態異常Budget\n- STATUS_RATE配分\n- DURATION配分\n- DAMAGE配分\n- MP_EFFICIENCY配分\n- CD_EFFICIENCY配分\n- DOT系テンプレート配分\n- 行動阻害系テンプレート配分\n- 能力阻害系テンプレート配分\n- 特殊系テンプレート配分\n- 個別状態異常のBudget例\n\n## 扱い\n\nこれらは破損・廃止扱いではない。\n現存設計値として保存し、バランス調整時に正式採用、修正、破棄を判断する。\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0046","title":"[STATUS] 03_採用記録","status":"Review","summary":"V9ライブラリ v2.0基準文書。BUFF・状態異常・スタック / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 03_戦闘_AI/StatusStack/03_採用記録.md\nsha256: c7be546100fbfa8ff80afe454da8ba90760279f0b0b429d66502a2c5fdaa554b\nbytes: 2836\narea: STATUS / BUFF・状態異常・スタック\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# 正式採用・修正判断チェックリスト\n\n各項目を「採用」「修正」「保留」で判定する。\n\n1. 状態異常はタグシステムで管理する。\n2. 全状態異常へのDEBUFFタグ必須付与は採用しない。【修正済み】\n3. 現存する状態異常分類を維持する。\n4. DOTは固定ダメージ方式とし、割合ダメージを採用しない。\n5. DOTはスタック可能とし、各スタックを個別タイマーで管理する。\n6. 状態異常耐性は完全無効ではなく、持続時間へ作用する。【採用】\n7. 状態異常耐性上限は75%とする。【採用】\n8. 状態異常の完全無効・付与禁止は存在させない。【採用】\n9. 状態異常耐性の具体的な持続時間式はバランス・詳細仕様へ分離する。\n8. スタックは能力値と独立した特殊リソースとする。\n9. スタックはTick基準で持続管理する。\n10. スタックは装備、MOD、スキル、石板、モンスター等から獲得可能とする。\n11. スタックの数値推奨値をバランス仕様へ分離する。\n12. 状態異常・スタックは共通タグルールで発火・条件評価する。\n13. 旧AI CONDITION表現を最新AI予約仕様へ更新する。【採用】\n14. 挑発は基準対象選択へ作用し、RANGEを変更しない。\n15. 感電の作用をAG獲得性能低下へ統一するか。\n16. 通常DEBUFFと状態異常を分類タグで区別するか。\n17. 汎用スタックのタイマー方式を定義ごとに選択可能とするか。\n18. 状態異常BudgetをSkill Budget内で管理する。\n19. Budget配分率と個別例をバランス仕様へ分離する。\n20. GameとStudioが同一データ・同一処理を利用する。\n\n27. 状態異常、BUFF、DEBUFF、スタックを独立概念として管理する。【採用】\n28. BUFF・DEBUFFは付与ごとに個別Tickを管理する。【採用】\n29. 同系統BUFF・DEBUFFは最も強い効果だけを参照する。【採用】\n30. 同系統BUFF・DEBUFFの効果量は加算しない。【採用】\n31. 最強効果の終了後は、残存する次点の効果へ引き継ぐ。【採用】\n32. 個別DEBUFF・状態異常の現存例は参考例として保持し、正式採用一覧にはしない。【採用】\n\n33. 状態異常耐性上限75%を正式採用する。【採用】\n34. 恒久的な完全無効・恒久的な付与禁止を設けない。【採用】\n35. DOT固定ダメージ方式を継承する。【採用】\n36. DOTの個別タイマー方式を継承する。【採用】\n37. スタックを独立リソースとして継承する。【採用】\n38. AI連携表現を最新正式仕様へ更新する。【採用】\n39. 数値・推奨値をバランス仕様へ分離する。【採用】\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0047","title":"[STATUS] 04_レビュー・修正履歴","status":"Review","summary":"V9ライブラリ v2.0基準文書。BUFF・状態異常・スタック / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 03_戦闘_AI/StatusStack/04_レビュー・修正履歴.md\nsha256: 404595deb19a449297e7cab5d8ec89536cb6b3edfe5b2d707a919988b67f505f\nbytes: 2448\narea: STATUS / BUFF・状態異常・スタック\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# レビュー・修正履歴\n\n## Draft v1\n\n- V9ライブラリ現存資料4点を原文のまま収録。\n- 状態異常システム Version 1.0を統合。\n- スタックシステム Version 1.1を統合。\n- スキルデータベース Version 2.0との接続を整理。\n- DOT・状態異常予算テーブル Version 1.0を構造と数値へ分離。\n- 最新正式AI行動予約仕様との更新候補を追加。\n- 正式採用済み戦闘計算インターフェースとの接続を追加。\n- 数値・推奨値は削除せず、バランス項目として別紙へ移した。\n\n## Draft v2\n\n- AI関連の最新正式仕様への更新を採用。\n- AIは共通タグルールで状態・スタックを参照し、予約更新・直前再検証・不成立時再思考を行う。\n- 状態異常耐性上限75%を正式採用事項として反映。\n- 状態異常の完全無効・付与禁止・完全耐性を正式仕様から除外。\n- 状態付与処理から「付与禁止・無効タグ確認」を削除。\n- 耐性は実効持続時間へ作用する構造に統一。\n\n## Draft v3\n- AI関連の最新仕様を正式採用事項として反映。\n- 耐性上限75%を全システム共通原則として反映。\n- 恒久的な完全無効・完全禁止・完全封鎖を禁止。\n- 沈黙、スタン等のTick期間中の一時的制限を正式な例外として明記。\n- 死にスキル・死にビルドを作らない原則を明記。\n\n## Draft v4\n\n- 「全状態異常はDEBUFFタグを持つ」を削除。\n- 状態異常、BUFF、DEBUFF、スタックを独立概念として分離。\n- 現存する個別状態異常・DEBUFF例を正式採用事項から参考例へ変更。\n- BUFF・DEBUFFの共通重ねがけルールを正式採用事項として追加。\n- BUFF・DEBUFFは付与ごとに個別Tick管理。\n- 同系統効果は最強効果のみ参照し、加算しない。\n- 最強効果終了後は残存する次点効果へ自動引き継ぎ。\n\n## Draft v5\n\n- 状態異常耐性上限75%を正式採用済みとして確定。\n- 恒久的な完全無効・付与禁止を設けない原則を確定。\n- DOT固定ダメージ方式を正式継承。\n- DOT個別タイマー方式を正式継承。\n- スタックを独立リソースとして正式継承。\n- AI連携表現の最新正式仕様への更新を確定。\n- 数値・推奨値をバランス仕様へ分離する方針を確定。\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0048","title":"[STATUS] 05_機械可読仕様","status":"Approved","summary":"V9ライブラリ v2.0基準文書。BUFF・状態異常・スタック / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 03_戦闘_AI/StatusStack/05_機械可読仕様.json\nsha256: f22de30e140401c6dd2dc05675b6c7aab7ff3b23c9a048123ee7abc6142dd72f\nbytes: 2771\narea: STATUS / BUFF・状態異常・スタック\nlibrary_status: ライブラリ収録\n\n【Original Content】\n{\n  \"document\": \"V9 状態・スタック仕様\",\n  \"version\": \"draft-5\",\n  \"status\": \"REVIEW_IN_PROGRESS_WITH_ADOPTED_DECISIONS\",\n  \"source_documents\": [\n    \"04_DOT・状態異常予算テーブル_Version1.0.txt\",\n    \"04_スキルデータベース_Version2.0.txt\",\n    \"04_スタックシステム設計書_Version1.1.txt\",\n    \"04_状態異常システム設計書_Version1.0.txt\"\n  ],\n  \"preserves_source_d udget編集\n- Game：Budget読込\n\n## 6. 正式保留（バランス）\n- 総Budget\n- 配分率\n- 換算係数\n- 難易度補正\n- レベル補正\n- ランク補正\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0050","title":"[BATTLE] 02_バランス調整項目一覧","status":"Review","summary":"V9ライブラリ v2.0基準文書。戦闘・AI / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 03_戦闘_AI/V9_EnemyBudget_正式版_v1.0/02_バランス調整項目一覧.md\nsha256: 779068e0b749c73f9635e1f26a4acc73ac48e9aced64f0273a9ca97c5211bd75\nbytes: 182\narea: BATTLE / 戦闘・AI\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# バランス調整項目\n- Budget総量\n- HP配分率\n- Attack Performance配分率\n- Defense Performance配分率\n- Skill配分率\n- AI配分率\n- Utility配分率\n- 換算係数\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0051","title":"[BATTLE] 03_正式採用チェック","status":"Review","summary":"V9ライブラリ v2.0基準文書。戦闘・AI / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 03_戦闘_AI/V9_EnemyBudget_正式版_v1.0/03_正式採用チェック.md\nsha256: 87d9ee98ff451fdd3ec53ec84e446fc05a802a42460018543fd999912a63faff\nbytes: 149\narea: BATTLE / 戦闘・AI\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# 採用チェック\n1. Budget分類\n2. 各責務\n3. 配分フロー\n4. AI Budget定義\n5. Skill BudgetとRANGEの関係\n6. バランス項目分離\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0052","title":"[BATTLE] 04_機械可読仕様","status":"Approved","summary":"V9ライブラリ v2.0基準文書。戦闘・AI / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath
