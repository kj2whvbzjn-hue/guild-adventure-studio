<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<title>ギルド冒険物語 最小プレイ版</title>
<style>
:root{--bg:#101827;--panel:#1b263b;--line:#33445f;--text:#f5f7fb;--muted:#aab6c8;--accent:#f0b84b;--good:#56c596;--bad:#ef7373;--mp:#70a7ff;--flash:#fff1a8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh}.app{min-height:100vh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:#141f32}.brand{font-weight:800}.small{font-size:12px;color:var(--muted)}
main{flex:1;display:grid;place-items:center;padding:16px}.screen{display:none;width:min(100%,980px)}.screen.active{display:block}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 30px #0005}.title{text-align:center;padding:36px 18px}.title h1{font-size:clamp(28px,6vw,52px);margin:0 0 10px;color:var(--accent)}
button{font:inherit;border:1px solid var(--line);border-radius:12px;padding:12px 18px;background:#263650;color:var(--text);cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#241b0a;font-weight:800}button:disabled{opacity:.45}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.unit{padding:12px;border:1px solid var(--line);border-radius:12px;background:#152238}.unit{position:relative;transition:transform .18s,opacity .18s}.unit.hit{transform:translateX(4px);filter:brightness(1.5)}.unit.down{opacity:.42}.unit b{display:block}.unit .meta{font-size:12px;color:var(--muted)}.bar{height:8px;background:#0c1422;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--good);transition:width .2s}.bar.mp i{background:var(--mp)}
.quest{padding:16px;border:1px solid var(--accent);border-radius:14px;background:#1c2940}.quest-list{display:grid;gap:10px}.quest-row{padding:14px;border:1px solid var(--line);border-radius:12px;background:#152238}.quest-row.locked{opacity:.48}.quest-row h3{margin:0 0 6px}.quest-row .row{display:flex;justify-content:space-between;gap:10px;align-items:center}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.statline{display:flex;justify-content:space-between;gap:10px}.inventory{display:grid;gap:8px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:#152238}.form-row select{width:100%;font:inherit;padding:9px;border-radius:9px;border:1px solid var(--line);background:#101827;color:var(--text)}.town-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.town-card{padding:14px;border:1px solid var(--line);border-radius:12px;background:#152238}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#263650;color:var(--muted);font-size:12px}.item{display:flex;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#152238}.battle{display:grid;grid-template-columns:1fr 1fr;gap:12px}.log{height:230px;overflow:auto;white-space:pre-wrap;background:#09111f;border-radius:12px;padding:12px;font-size:13px;line-height:1.55}.result{text-align:center}.result.win{animation:winPulse .65s ease}.result.lose{animation:loseShake .45s ease}.reward{font-size:20px;color:var(--accent);font-weight:800}.reward-list{margin:14px auto 0;max-width:430px;text-align:left;display:grid;gap:8px}.reward-item{display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#152238}.wave{display:inline-block;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.skill-pop{min-height:24px;text-align:center;color:var(--flash);font-weight:800;margin:8px 0}@keyframes winPulse{50%{transform:scale(1.025);filter:brightness(1.3)}}@keyframes loseShake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.notice{padding:10px 12px;border:1px solid #735;border-radius:10px;background:#321b28;color:#ffd8df;margin-bottom:12px}.footer{text-align:center;padding:8px;color:var(--muted);font-size:12px}@media(max-width:700px){main{padding:8px}.town-grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}.card{padding:12px;border-radius:12px}.grid{grid-template-columns:repeat(2,1fr)}.battle{grid-template-columns:1fr}.log{height:180px}.top{padding:7px 10px}}
@media(orientation:portrait) and (max-width:700px){body:before{content:"横画面にすると遊びやすくなります";display:block;text-align:center;background:#6a4b17;padding:5px;font-size:12px}}
</style>
</head>
<body><div class="app">
<header class="top"><div><div class="brand">ギルド冒険物語</div><div class="small">最小プレイ版 0.6</div></div><button onclick="location.href='./studio/'">開発Studio</button></header>
<main>
<section id="title" class="screen active"><div class="card title"><h1>ギルド冒険物語</h1><p>6人の冒険者と、最初の依頼へ。</p><div id="loadNotice"></div><div class="actions"><button class="primary" onclick="startGame()">ゲーム開始</button><button onclick="resetSave()">セーブ削除</button></div></div></section>
<section id="guild" class="screen"><div class="card"><h2>冒険者ギルド</h2><p id="guildText"></p><h3>パーティー</h3><div id="party" class="grid"></div><div class="actions"><button class="primary" onclick="showQuestList()">依頼を見る</button><button onclick="showPartySetup()">編成・転職</button><button onclick="showEquipment()">装備</button><button onclick="showInventory()">持ち物</button><button onclick="showTown()">町</button></div></div></section>
<section id="questList" class="screen"><div class="card"><h2>依頼一覧</h2><div id="questListBody" class="quest-list"></div><div class="actions"><button onclick="show('guild')">ギルドへ戻る</button></div></div></section>
<section id="quest" class="screen"><div class="card"><h2>クエスト確認</h2><div class="quest"><h3 id="questTitle"></h3><p id="questSummary"></p><p><b>報酬：</b><span id="questReward"></span></p></div><div class="actions"><button onclick="show('guild')">戻る</button><button class="primary" onclick="beginBattle()">出発する</button></div></div></section>

<section id="partySetup" class="screen"><div class="card"><h2>編成・転職</h2><p>出撃順と職業を変更できます。変更は自動保存されます。</p><div id="partySetupBody" class="inventory"></div><div class="actions"><button onclick="show('guild')">ギルドへ戻る</button></div></div></section>
<section id="town" class="screen"><div class="card"><h2>町</h2><div class="town-grid"><div class="town-card"><h3>宿屋</h3><p>冒険者を休ませ、次の戦闘に備えます。</p><button class="primary" onclick="useInn()">30Gで休む</button></div><div class="town-card"><h3>道具屋</h3><p>回復薬を購入します。</p><button onclick="buyPotion()">回復薬を20Gで買う</button></div><div class="town-card"><h3>武器屋</h3><p>基本装備を購入できます。</p><button onclick="buyEquipment('鉄の剣',120)">鉄の剣 120G</button> <button onclick="buyEquipment('魔導の杖',140)">魔導の杖 140G</button></div><div class="town-card"><h3>訓練所</h3><p>全員に20EXPを与えます。</p><button onclick="trainParty()">80Gで訓練</button></div></div><div class="actions"><button onclick="show('guild')">ギルドへ戻る</button></div></div></section>
<section id="equipment" class="screen"><div class="card"><h2>装備</h2><p>現在の装備と冒険者の成長を確認します。</p><div id="equipmentBody" class="inventory"></div><div class="actions"><button onclick="show('guild')">ギルドへ戻る</button></div></div></section>
<section id="inventory" class="screen"><div class="card"><h2>持ち物</h2><div id="inventoryBody" class="inventory"></div><div class="actions"><button onclick="show('guild')">ギルドへ戻る</button></div></div></section>
<section id="battle" class="screen"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 id="battleTitle">自動戦闘</h2><span id="waveLabel" class="wave">Wave 1 / 3</span></div><div class="battle"><div><h3>味方</h3><div id="allies" class="grid"></div></div><div><h3>敵</h3><div id="enemies" class="grid"></div></div></div><div id="skillPop" class="skill-pop"></div><h3>戦闘ログ</h3><div id="battleLog" class="log"></div><div class="actions"><button id="speedBtn" onclick="toggleSpeed()">速度：1倍</button><button id="pauseBtn" onclick="togglePause()">一時停止</button></div></div></section>
<section id="result" class="screen"><div class="card result"><h2 id="resultTitle"></h2><p id="resultMessage"></p><div id="reward" class="reward"></div><div id="rewardList" class="reward-list"></div><div class="actions"><button class="primary" onclick="returnGuild()">ギルドへ戻る</button></div></div></section>
</main><div class="footer">Studioデータがない端末では内蔵データを使用します</div></div>
<script>
const BUILTIN_PROJECT={
 project:{id:'PRJ-GUILD-ADVENTURE-BUILTIN',name:'ギルド冒険物語 内蔵版'},
 characters:[
  {id:'CHR-0001',name:'レオン',job_id:'JOB-0001',job:'騎士'},{id:'CHR-0002',name:'ガルド',job_id:'JOB-0002',job:'戦士'},
  {id:'CHR-0003',name:'ミリア',job_id:'JOB-0003',job:'僧侶'},{id:'CHR-0004',name:'セラ',job_id:'JOB-0004',job:'魔法使い'},
  {id:'CHR-0005',name:'フィン',job_id:'JOB-0005',job:'弓使い'},{id:'CHR-0006',name:'リオ',job_id:'JOB-0006',job:'盗賊'}],
 quests:[
  {id:'QST-0001',title:'薬草の森と迷子の冒険者',summary:'新人冒険者を救出する最初の依頼。',rewards:'100G・回復薬2・初心者の剣',gold:100,xp:50,item:'初心者の剣',battle_sequence:[{wave:1,monster_ids:['MON-0001','MON-0001','MON-0002']},{wave:2,monster_ids:['MON-0003','MON-0004']},{wave:3,monster_ids:['MON-0006']}]},
  {id:'QST-0002',title:'森に残る毒胞子',summary:'毒キノコの群れを討伐する。',rewards:'130G・回復薬1',gold:130,xp:65,battle_sequence:[{wave:1,monster_ids:['MON-0005','MON-0005']},{wave:2,monster_ids:['MON-0005','MON-0003','MON-0005']}]},
  {id:'QST-0003',title:'街道のオオカミ',summary:'商隊を襲うオオカミを退治する。',rewards:'160G・旅人の服',gold:160,xp:80,item:'旅人の服',battle_sequence:[{wave:1,monster_ids:['MON-0002','MON-0002']},{wave:2,monster_ids:['MON-0002','MON-0002','MON-0002']}]},
  {id:'QST-0004',title:'ゴブリンの斥候隊',summary:'町を偵察する斥候隊を追い払う。',rewards:'190G・回復薬2',gold:190,xp:95,battle_sequence:[{wave:1,monster_ids:['MON-0003','MON-0004']},{wave:2,monster_ids:['MON-0003','MON-0003','MON-0004']}]},
  {id:'QST-0005',title:'森の夜襲',summary:'夜間に現れた魔物の混成部隊を倒す。',rewards:'230G・森人の弓',gold:230,xp:115,item:'森人の弓',battle_sequence:[{wave:1,monster_ids:['MON-0002','MON-0005']},{wave:2,monster_ids:['MON-0003','MON-0004','MON-0005']},{wave:3,monster_ids:['MON-0006']}]},
  {id:'QST-0006',title:'薬草採取の護衛',summary:'薬草師を護衛しながら森を進む。',rewards:'260G・回復薬3',gold:260,xp:130,battle_sequence:[{wave:1,monster_ids:['MON-0001','MON-0001','MON-0005']},{wave:2,monster_ids:['MON-0002','MON-0003']}]},
  {id:'QST-0007',title:'弓兵の待ち伏せ',summary:'高台に陣取るゴブリン弓兵を排除する。',rewards:'300G・盗賊の短剣',gold:300,xp:150,item:'盗賊の短剣',battle_sequence:[{wave:1,monster_ids:['MON-0004','MON-0004']},{wave:2,monster_ids:['MON-0003','MON-0004','MON-0004']}]},
  {id:'QST-0008',title:'毒沼の突破',summary:'毒の魔物が集まる区域を突破する。',rewards:'340G・回復薬3',gold:340,xp:170,battle_sequence:[{wave:1,monster_ids:['MON-0005','MON-0005','MON-0005']},{wave:2,monster_ids:['MON-0006','MON-0005']}]},
  {id:'QST-0009',title:'森の砦攻略',summary:'ゴブリンが築いた小砦を攻略する。',rewards:'400G・鉄の大剣',gold:400,xp:200,item:'鉄の大剣',battle_sequence:[{wave:1,monster_ids:['MON-0003','MON-0003','MON-0004']},{wave:2,monster_ids:['MON-0004','MON-0004','MON-0005']},{wave:3,monster_ids:['MON-0006','MON-0003']}]},
  {id:'QST-0010',title:'森の王との決戦',summary:'強大になったゴブリンリーダーを討つ。',rewards:'600G・守護の盾',gold:600,xp:300,item:'守護の盾',battle_sequence:[{wave:1,monster_ids:['MON-0002','MON-0003','MON-0004']},{wave:2,monster_ids:['MON-0005','MON-0005','MON-0004']},{wave:3,monster_ids:['MON-0006','MON-0006']}]}],
 masters:{jobs:[
  {id:'JOB-0001',name:'騎士',params:{base_stats:{hp:520,mp:45,attack:42,defense:34,agi:8},battle_skill:{name:'シールドバッシュ',type:'attack',power:1.35,cost:12}}},
  {id:'JOB-0002',name:'戦士',params:{base_stats:{hp:470,mp:40,attack:62,defense:22,agi:10},battle_skill:{name:'強撃',type:'attack',power:1.65,cost:12}}},
  {id:'JOB-0003',name:'僧侶',params:{base_stats:{hp:340,mp:130,attack:28,defense:16,agi:9},battle_skill:{name:'ヒール',type:'heal',power:105,cost:18}}},
  {id:'JOB-0004',name:'魔法使い',params:{base_stats:{hp:300,mp:150,attack:52,defense:12,agi:11},battle_skill:{name:'火炎波',type:'aoe',power:.72,cost:24}}},
  {id:'JOB-0005',name:'弓使い',params:{base_stats:{hp:370,mp:70,attack:48,defense:17,agi:14},battle_skill:{name:'狙い撃ち',type:'attack',power:1.45,cost:14}}},
  {id:'JOB-0006',name:'盗賊',params:{base_stats:{hp:350,mp:65,attack:44,defense:15,agi:18},battle_skill:{name:'急所突き',type:'attack',power:1.35,cost:12,crit:30}}}],
 monsters:[
  {id:'MON-0001',name:'森スライム',params:{stats:{hp:120,attack:18,defense:5,agi:7}}},{id:'MON-0002',name:'森オオカミ',params:{stats:{hp:180,attack:28,defense:8,agi:15}}},
  {id:'MON-0003',name:'ゴブリン',params:{stats:{hp:210,attack:31,defense:10,agi:11}}},{id:'MON-0004',name:'ゴブリン弓兵',params:{stats:{hp:170,attack:29,defense:7,agi:13}}},
  {id:'MON-0005',name:'毒キノコ',params:{stats:{hp:150,attack:20,defense:12,agi:6}}},{id:'MON-0006',name:'ゴブリンリーダー',params:{stats:{hp:980,attack:48,defense:20,agi:12}}}]}
};
const CURRENT_KEY='gas_v4_current_project_v060', PREFIX='gas_v4_project_v060_', SAVE_KEY='guild_adventure_game_save_v002';
let project=null,save={gold:0,potions:0,equipment:[],completed:[],plays:0,partyProgress:{},partyOrder:[],jobOverrides:{},equipped:{}},party=[],enemies=[],timer=null,speedIndex=0,speeds=[650,300,130],paused=false,quest=null,waveIndex=0;
const $=id=>document.getElementById(id),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function loadProject(){try{const id=localStorage.getItem(CURRENT_KEY);if(id)project=JSON.parse(localStorage.getItem(PREFIX+id)||'null')}catch(e){}try{save={...save,...(JSON.parse(localStorage.getItem(SAVE_KEY))||{})};save.partyOrder=save.partyOrder||[];save.jobOverrides=save.jobOverrides||{};save.equipped=save.equipped||{}}catch(e){}}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
function hasPlayableData(p){return !!(p&&(p.characters||[]).length>0&&(p.quests||[]).length>0&&(p.masters?.jobs||[]).length>0&&(p.masters?.monsters||[]).length>0)}
function startGame(){loadProject();let usingBuiltin=false;if(!hasPlayableData(project)){project=structuredClone(BUILTIN_PROJECT);usingBuiltin=true}$('loadNotice').innerHTML=usingBuiltin?'<div class="notice" style="border-color:#385f55;background:#16362f;color:#d9fff2">端末内のStudioデータが不完全なため、内蔵ゲームデータで開始します。</div>':'';renderGuild();show('guild')}
function resetSave(){if(confirm('ゲームのセーブデータを削除しますか？')){localStorage.removeItem(SAVE_KEY);save={gold:0,potions:0,equipment:[],completed:[],plays:0,partyProgress:{},partyOrder:[],jobOverrides:{},equipped:{}};alert('削除しました')}}
function jobById(id){return(project.masters?.jobs||[]).find(x=>x.id===id)}
function characterJobId(c){return save.jobOverrides?.[c.id]||c.job_id}
function orderedCharacters(){const chars=[...(project.characters||[])];if(!save.partyOrder?.length)return chars.slice(0,6);return save.partyOrder.map(id=>chars.find(c=>c.id===id)).filter(Boolean).concat(chars.filter(c=>!save.partyOrder.includes(c.id))).slice(0,6)}
function persist(){localStorage.setItem(SAVE_KEY,JSON.stringify(save))}
function progressFor(id){save.partyProgress=save.partyProgress||{};return save.partyProgress[id]||(save.partyProgress[id]={level:1,xp:0})}
function xpToNext(level){return 80+level*40}
function addXp(amount){const ups=[];for(const c of (project.characters||[]).slice(0,6)){const p=progressFor(c.id);p.xp+=amount;while(p.xp>=xpToNext(p.level)){p.xp-=xpToNext(p.level);p.level++;ups.push(`${c.name} Lv.${p.level}`)}}return ups}
function renderGuild(){$('guildText').textContent=`所持金 ${save.gold}G　回復薬 ${save.potions||0}個　冒険回数 ${save.plays}回　完了依頼 ${save.completed.length}件`;const chars=orderedCharacters();$('party').innerHTML=chars.map(c=>{const j=jobById(characterJobId(c)),p=progressFor(c.id);return`<div class="unit"><b>${esc(c.name)}　Lv.${p.level}</b><span>${esc(j?.name||c.job||'冒険者')}</span><div class="meta">${esc(j?.params?.battle_skill?.name||'通常攻撃')}　EXP ${p.xp}/${xpToNext(p.level)}</div></div>`}).join('')}
function showQuestList(){const qs=project.quests||[];$('questListBody').innerHTML=qs.map((q,i)=>{const unlocked=i===0||save.completed.includes(qs[i-1]?.id);const done=save.completed.includes(q.id);return`<div class="quest-row ${unlocked?'':'locked'}"><div class="row"><div><h3>${esc(q.title)} ${done?'✓':''}</h3><div class="small">${esc(q.summary||'')}</div><div class="small">報酬：${esc(q.rewards||'')}</div></div><button ${unlocked?'':'disabled'} onclick="chooseQuest('${esc(q.id)}')">${done?'再挑戦':'受注'}</button></div></div>`}).join('');show('questList')}
function chooseQuest(id){quest=(project.quests||[]).find(q=>q.id===id);if(!quest)return;$('questTitle').textContent=quest.title;$('questSummary').textContent=quest.summary||'';$('questReward').textContent=quest.rewards||'報酬あり';show('quest')}
function equipmentBonus(name){const map={'初心者の剣':{attack:8},'旅人の服':{hp:35,defense:4},'森人の弓':{attack:12,agi:2},'盗賊の短剣':{attack:10,agi:3},'鉄の大剣':{attack:18},'守護の盾':{hp:45,defense:10},'鉄の剣':{attack:14},'魔導の杖':{attack:12,mp:20}};return map[name]||{}}
function showEquipment(){const chars=orderedCharacters(),owned=['装備なし',...new Set(save.equipment||[])];$('equipmentBody').innerHTML=chars.map(c=>{const p=progressFor(c.id),current=save.equipped?.[c.id]||'装備なし';return`<div class="form-row"><div><b>${esc(c.name)} Lv.${p.level}</b><div class="small">現在：${esc(current)}</div></div><select onchange="equipItem('${esc(c.id)}',this.value)">${owned.map(x=>`<option ${x===current?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}).join('');show('equipment')}
function equipItem(id,item){save.equipped[id]=item;persist();showEquipment()}
function showPartySetup(){const chars=orderedCharacters(),jobs=project.masters?.jobs||[];$('partySetupBody').innerHTML=chars.map((c,i)=>{const jid=characterJobId(c),j=jobById(jid);return`<div class="form-row"><div><b>${i+1}. ${esc(c.name)}</b><div class="small">${esc(j?.name||c.job)}</div><div class="actions" style="justify-content:flex-start;margin-top:6px"><button ${i===0?'disabled':''} onclick="moveParty('${esc(c.id)}',-1)">↑</button><button ${i===chars.length-1?'disabled':''} onclick="moveParty('${esc(c.id)}',1)">↓</button></div></div><select onchange="changeJob('${esc(c.id)}',this.value)">${jobs.map(x=>`<option value="${esc(x.id)}" ${x.id===jid?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`}).join('');show('partySetup')}
function moveParty(id,dir){const ids=orderedCharacters().map(c=>c.id),i=ids.indexOf(id),n=i+dir;if(i<0||n<0||n>=ids.length)return;[ids[i],ids[n]]=[ids[n],ids[i]];save.partyOrder=ids;persist();showPartySetup()}
function changeJob(id,jid){save.jobOverrides[id]=jid;persist();showPartySetup()}
function showTown(){show('town')}
function useInn(){if(save.gold<30)return alert('金貨が足りません');save.gold-=30;save.innRested=true;persist();renderGuild();alert('ゆっくり休みました')}
function buyPotion(){if(save.gold<20)return alert('金貨が足りません');save.gold-=20;save.potions=(save.potions||0)+1;persist();renderGuild();alert('回復薬を1個購入しました')}
function buyEquipment(name,cost){if(save.gold<cost)return alert('金貨が足りません');if((save.equipment||[]).includes(name))return alert('すでに持っています');save.gold-=cost;save.equipment.push(name);persist();renderGuild();alert(name+'を購入しました')}
function trainParty(){if(save.gold<80)return alert('金貨が足りません');save.gold-=80;const ups=addXp(20);persist();renderGuild();alert(ups.length?'レベルアップ：'+ups.join('、'):'訓練を終えました')}
function showInventory(){const items=[];items.push(`<div class="item"><span>金貨</span><b>${save.gold}G</b></div>`);items.push(`<div class="item"><span>回復薬</span><b>${save.potions||0}個</b></div>`);for(const e of save.equipment)items.push(`<div class="item"><span>装備</span><b>${esc(e)}</b></div>`);$('inventoryBody').innerHTML=items.join('');show('inventory')}
function buildParty(){return orderedCharacters().map(c=>{const j=jobById(characterJobId(c)),s=j?.params?.base_stats||{},skill=j?.params?.battle_skill||{name:'通常攻撃',type:'attack',power:1,cost:0};const p=progressFor(c.id),mul=1+(p.level-1)*.08,bonus=equipmentBonus(save.equipped?.[c.id]);return{id:c.id,name:c.name,job:j?.name||c.job,maxHp:Math.round((+s.hp||350)*mul+(bonus.hp||0)),hp:Math.round((+s.hp||350)*mul+(bonus.hp||0)),maxMp:Math.round((+s.mp||50)*(1+(p.level-1)*.04)+(bonus.mp||0)),mp:Math.round((+s.mp||50)*(1+(p.level-1)*.04)+(bonus.mp||0)),attack:Math.round((+s.attack||35)*mul+(bonus.attack||0)),defense:Math.round((+s.defense||12)*mul+(bonus.defense||0)),agi:(+s.agi||10)+(p.level-1)+(bonus.agi||0),skill,alive:true}})}
function monsterById(id){return(project.masters?.monsters||[]).find(x=>x.id===id)}
function buildWave(i){let ids=quest?.battle_sequence?.[i]?.monster_ids||[];let list=ids.map(monsterById).filter(Boolean);if(!list.length&&i===0)list=(project.masters?.monsters||[]).slice(0,3);const qi=Math.max(0,(project.quests||[]).findIndex(q=>q.id===quest?.id)),mul=1+qi*.12;return list.map((m,n)=>{const s=m.params?.stats||{};return{id:m.id+'-'+i+'-'+n,name:m.name,maxHp:Math.round((+s.hp||120)*mul),hp:Math.round((+s.hp||120)*mul),attack:Math.round((+s.attack||18)*mul),defense:Math.round((+s.defense||5)*mul),agi:(+s.agi||7)+Math.floor(qi/2),alive:true}})}
function beginBattle(){party=buildParty();waveIndex=0;enemies=buildWave(waveIndex);if(!enemies.length){alert('モンスターデータがありません');return}show('battle');$('battleLog').textContent='戦闘開始！\n';paused=false;$('pauseBtn').textContent='一時停止';startWave()}
function startWave(){enemies=buildWave(waveIndex);$('waveLabel').textContent=`Wave ${waveIndex+1} / ${quest?.battle_sequence?.length||1}`;log(`--- Wave ${waveIndex+1} 開始 ---`);renderBattle();restartTimer()}
function renderUnits(list,id){$(id).innerHTML=list.map(u=>`<div class="unit ${u.hp<=0?'down':''}" data-unit="${esc(u.id)}"><b>${esc(u.name)}</b><div class="meta">${esc(u.job||'敵')}</div><span>HP ${Math.max(0,u.hp)} / ${u.maxHp}</span><div class="bar"><i style="width:${clamp(u.hp/u.maxHp*100,0,100)}%"></i></div>${u.maxMp?`<span class="meta">MP ${u.mp} / ${u.maxMp}</span><div class="bar mp"><i style="width:${clamp(u.mp/u.maxMp*100,0,100)}%"></i></div>`:''}</div>`).join('')}
function renderBattle(){renderUnits(party,'allies');renderUnits(enemies,'enemies')}
function living(a){return a.filter(x=>x.hp>0)}
function damage(attacker,target,power=1,critBonus=0){const variance=.88+Math.random()*.24;const crit=Math.random()<(0.08+critBonus/100);let dmg=Math.max(1,Math.round((attacker.attack*power-target.defense*.45)*variance*(crit?1.6:1)));target.hp=Math.max(0,target.hp-dmg);flashUnit(target.id);return{dmg,crit}}
function allyAct(a){const skill=a.skill||{};const useSkill=a.mp>=(skill.cost||0)&&Math.random()<.48;if(useSkill&&skill.type==='heal'){const target=living(party).sort((x,y)=>x.hp/x.maxHp-y.hp/y.maxHp)[0];if(target&&target.hp<target.maxHp*.82){a.mp-=skill.cost;const amount=Math.min(target.maxHp-target.hp,Math.round(skill.power+a.attack*.35));target.hp+=amount;announce(`${a.name}「${skill.name}」`);log(`${a.name}の${skill.name} → ${target.name}のHPを${amount}回復`);return}}
 if(useSkill&&skill.type==='aoe'){a.mp-=skill.cost;announce(`${a.name}「${skill.name}」`);for(const t of living(enemies)){const r=damage(a,t,skill.power||.7);log(`${skill.name} → ${t.name}に${r.dmg}ダメージ${t.hp<=0?'　撃破！':''}`)}return}
 const target=living(enemies)[Math.floor(Math.random()*living(enemies).length)];if(!target)return;if(useSkill){a.mp-=skill.cost;announce(`${a.name}「${skill.name}」`);const r=damage(a,target,skill.power||1,skill.crit||0);log(`${a.name}の${skill.name} → ${target.name}に${r.dmg}ダメージ${r.crit?'（会心）':''}${target.hp<=0?'　撃破！':''}`)}else{const r=damage(a,target);log(`${a.name}の通常攻撃 → ${target.name}に${r.dmg}ダメージ${r.crit?'（会心）':''}${target.hp<=0?'　撃破！':''}`)}a.mp=Math.min(a.maxMp,a.mp+3)}
function enemyAct(a){const targets=living(party);if(!targets.length)return;const target=targets[Math.floor(Math.random()*targets.length)],r=damage(a,target);log(`${a.name}の攻撃 → ${target.name}に${r.dmg}ダメージ${target.hp<=0?'　戦闘不能！':''}`)}
function tick(){if(paused)return;const actors=[...living(party).map(x=>({side:'a',u:x})),...living(enemies).map(x=>({side:'e',u:x}))].sort((a,b)=>b.u.agi-a.u.agi);for(const a of actors){if(a.u.hp<=0)continue;if(a.side==='a')allyAct(a.u);else enemyAct(a.u);if(!living(enemies).length||!living(party).length)break}renderBattle();if(!living(enemies).length){clearInterval(timer);if(waveIndex<(quest?.battle_sequence?.length||1)-1){waveIndex++;log('敵を退けた。次の敵が現れた！');setTimeout(startWave,700)}else finish(true)}else if(!living(party).length)finish(false)}
function announce(s){$('skillPop').textContent=s;setTimeout(()=>{if($('skillPop').textContent===s)$('skillPop').textContent=''},700)}
function flashUnit(id){requestAnimationFrame(()=>{const el=document.querySelector(`[data-unit="${CSS.escape(id)}"]`);if(el){el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),180)}})}
function log(s){const el=$('battleLog');el.textContent+=s+'\n';el.scrollTop=el.scrollHeight}
function finish(win){clearInterval(timer);timer=null;save.plays++;const card=$('result').querySelector('.card');card.classList.remove('win','lose');card.classList.add(win?'win':'lose');if(win){const gold=quest?.gold||100,xp=quest?.xp||50,item=quest?.item||null;save.gold+=gold;save.potions=(save.potions||0)+(quest?.id==='QST-0001'?2:1);if(item&&!save.equipment.includes(item))save.equipment.push(item);if(quest&&!save.completed.includes(quest.id))save.completed.push(quest.id);const ups=addXp(xp);$('resultTitle').textContent='クエスト成功！';$('resultMessage').textContent=ups.length?'レベルアップ：'+ups.join('、'):'冒険者たちは経験を積みました。';$('reward').textContent='報酬を獲得しました';$('rewardList').innerHTML=`<div class="reward-item"><span>金貨</span><b>${gold}G</b></div><div class="reward-item"><span>経験値</span><b>${xp}EXP</b></div><div class="reward-item"><span>回復薬</span><b>${quest?.id==='QST-0001'?2:1}個</b></div>${item?`<div class="reward-item"><span>装備</span><b>${esc(item)}</b></div>`:''}` }else{$('resultTitle').textContent='クエスト失敗';$('resultMessage').textContent='パーティーはギルドへ撤退しました。';$('reward').textContent='報酬なし';$('rewardList').innerHTML=''}persist();setTimeout(()=>show('result'),450)}
function toggleSpeed(){speedIndex=(speedIndex+1)%speeds.length;$('speedBtn').textContent=`速度：${[1,2,4][speedIndex]}倍`;restartTimer()}
function togglePause(){paused=!paused;$('pauseBtn').textContent=paused?'再開':'一時停止';announce(paused?'一時停止中':'戦闘再開')}
function restartTimer(){if(timer)clearInterval(timer);timer=setInterval(tick,speeds[speedIndex])}
function returnGuild(){renderGuild();show('guild')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
loadProject();
</script></body></html>
