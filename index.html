<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guild Adventure — Project Home</title>
<meta name="description" content="Guild Adventure のゲーム、GK Studio、検証、開発資料への入口">
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;--bg:#0b1020;--panel:#151d31;--line:#334155;--text:#f8fafc;--muted:#a8b3c7;--primary:#2563eb;--secondary:#334155;--dev:#7c3aed}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#172554 0,#0b1020 48%);color:var(--text)}main{width:min(94vw,760px);margin:0 auto;padding:48px 0 64px}.panel{padding:30px;border:1px solid var(--line);border-radius:22px;background:rgba(21,29,49,.96);box-shadow:0 24px 70px #0008}h1{margin:0;font-size:clamp(1.8rem,5vw,2.7rem)}.lead{margin:10px 0 28px;color:var(--muted);line-height:1.7}.primary{display:block;padding:20px;border-radius:14px;background:var(--primary);color:white;text-decoration:none;text-align:center;font-size:1.1rem;font-weight:800}.section{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}h2{margin:0 0 14px;font-size:1rem;color:#dbeafe}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{display:block;padding:16px;border:1px solid var(--line);border-radius:13px;background:var(--secondary);color:white;text-decoration:none;font-weight:700}.card.dev{background:#312e81}.card span{display:block;margin-top:6px;color:#cbd5e1;font-size:.8rem;font-weight:400;line-height:1.45}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}.badge{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:#cbd5e1;font-size:.78rem}.note{margin-top:20px;color:#94a3b8;font-size:.82rem;line-height:1.6}@media(max-width:520px){main{padding:20px 0}.panel{padding:20px;border-radius:0;border-left:0;border-right:0}}
</style>
</head>
<body>
<main><section class="panel">
<h1>Guild Adventure</h1>
<p class="lead">正式ゲームを主入口とし、制作・検証・資料を開発者向け領域として分離しています。</p>
<a class="primary" href="./game/">ゲームを開く</a>
<div class="section">
<h2>制作・開発</h2>
<div class="grid">
<a class="card" href="./studio/">GK Studio<span>ゲームデータの制作・編集・Export</span></a>
<a class="card" href="./docs/">開発資料<span>構成、仕様、実装記録、公開入口</span></a>
</div></div>
<div class="meta"><span class="badge">Game GA-B486.181</span><span class="badge">Studio GKS-B584</span><span class="badge">Formal canonical</span></div>
<p class="note">Build識別子は package-build.json / runtime-config.js を正本として管理します。</p>
</section></main>
</body></html>
