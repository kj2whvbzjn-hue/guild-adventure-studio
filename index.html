urce】\npath: 03_戦闘_AI/V9_RANGE設計書_正式版_v1.0/05_機械可読仕様.json\nsha256: 75abf15a8e02488802f43867fa1889c6fbb4625ce5adc3c74458a4ef7444ec81\nbytes: 75\narea: BATTLE / 戦闘・AI\nlibrary_status: ライブラリ収録\n\n【Original Content】\n{\n  \"document\": \"RANGE\",\n  \"version\": \"draft-1\",\n  \"structure_only\": true\n}","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0058","title":"[BATTLE] 01_戦闘計算インターフェース仕様_正式版_v1.0","status":"Approved","summary":"V9ライブラリ v2.0基準文書。戦闘・AI / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 03_戦闘_AI/V9_戦闘計算インターフェース仕様_正式版_v1.0/01_戦闘計算インターフェース仕様_正式版_v1.0.md\nsha256: f000974c3ccceec717d221d6ece8705997ccf422183ecf62a38e766574a21fdf\nbytes: 10780\narea: BATTLE / 戦闘・AI\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# V9 戦闘計算インターフェース仕様（正式版 Version 1.0）\n\n## 0. 文書の位置付け\n\n本書は、戦闘中のダメージ・回復・命中・状態付与などについて、具体的な数式や係数ではなく、計算処理の責務、入力、処理段階、出力、ログおよび他システムとの境界を定義する。\n\n数式、倍率、上限値、下限値、確率、丸め規則などはバランス調整仕様へ分離し、本書では確定しない。\n\n## 1. 基本原則\n\n- 戦闘計算はGame、Studio、AI、UIから独立した共通計算基盤とする。\n- GameとStudioは同じ入力形式、同じルール版、同じ計算処理を利用する。\n- AIは計算結果を決定せず、行動と対象を予約・選択する。\n- UIは結果を表示するだけで、計算ロジックを持たない。\n- タグルールは計算処理へ補正・条件・派生効果を提供する。\n- 同一入力、同一Seed、同一ルール版では同じ結果を再現できるようにする。\n- 各処理段階の中間結果を検証ログへ出力できるようにする。\n- 係数や式をコードへ直接固定せず、バランスデータとして外部管理できる構造にする。\n\n## 2. 共通入力\n\n戦闘計算要求は、少なくとも以下を受け取る。\n\n### 2.1 実行情報\n\n- 戦闘ID\n- Tick\n- 行動ID\n- 使用者ID\n- 行動またはスキルID\n- 基準対象ID\n- 最終対象候補\n- ルール版\n- データ版\n- Seed\n\n### 2.2 使用者情報\n\n- 基礎能力値\n- 現在HP・MP\n- 装備\n- MOD\n- パッシブ\n- 状態効果\n- スタック\n- タグ\n- 陣営\n- 配置\n\n### 2.3 対象情報\n\n- 基礎能力値\n- 現在HP・MP\n- 装備\n- MOD\n- パッシブ\n- 状態効果\n- スタック\n- タグ\n- 陣営\n- 配置\n\n### 2.4 行動・スキル情報\n\n- 効果種別\n- 基礎効果定義\n- 属性\n- RANGE\n- 対象条件\n- 使用条件\n- コスト定義\n- クールダウン定義\n- 付与状態\n- 付与スタック\n- 実行タグ\n- 派生ルール\n\n### 2.5 戦闘環境情報\n\n- 戦闘全体タグ\n- 地形・天候等の環境タグ\n- 特殊ルール\n- 難易度\n- イベント効果\n- 現在の戦闘状態\n\n## 3. 共通事前検証\n\n計算前に以下を検証する。\n\n1. 使用者が存在する。\n2. 使用者が行動可能である。\n3. 行動またはスキル定義が存在する。\n4. 対象候補が存在する。\n5. 使用条件が成立する。\n6. MP等の必要資源を満たす。\n7. クールダウン等の使用制限を満たす。\n8. 沈黙、行動不能、使用禁止等に抵触しない。\n9. RANGEと対象条件から有効な対象を生成できる。\n10. 実行直前のタグ条件が成立する。\n\n事前検証で不成立の場合、効果計算は行わず、失敗理由を返す。\n\nAI行動予約の場合は、行動順到達時に本検証を再実行し、不成立ならAIへ即時再思考を要求する。\n\n## 4. コストとクールダウンの境界\n\n- 使用可能判定と実際の消費処理を分離する。\n- コスト消費およびクールダウン開始は、実行直前の再検証に成功した後に行う。\n- 再検証前に不成立となった行動では、原則としてコストを消費せず、クールダウンも開始しない。\n- 実行開始後に割込み等で失敗した場合の扱いは、割込み仕様で別途定義する。\n- コスト値、クールダウン値、減少単位はバランス調整項目とする。\n\n## 5. 対象確定とRANGE\n\n対象処理は以下へ分離する。\n\n1. 基準対象の選択\n2. 対象条件の評価\n3. RANGEによる対象候補生成\n4. 陣営・生存状態・配置・タグ条件による除外\n5. 最終対象群の確定\n\nAIまたはプレイヤーは基準対象を選択する。単体、列、前列、後列、範囲、全体等の最終範囲はスキル側のRANGE定義が決定する。\n\nRANGEによる効果量補正は、対象生成とは別のバランス処理として扱う。\n\n## 6. 効果解決の共通パイプライン\n\n各対象に対して、原則として以下の順で処理する。\n\n1. 基礎効果生成\n2. 発生源側タグ・能力補正\n3. 行動・スキル側タグ補正\n4. 対象側タグ・防御・耐性補正\n5. 戦闘環境・全体状態補正\n6. 属性・タグ・状態の相互作用\n7. 命中・回避・無効等の成立判定\n8. クリティカル等の追加判定\n9. 乱数分散\n10. 丸め\n11. 上限・下限・最小値制約\n12. 最終効果量確定\n13. HP・MP・ゲージ等への反映\n14. 状態・BUFF・DEBUFF・DOT・HOT・スタックの付与\n15. パッシブ・反応・派生タグルールの発火\n16. 戦闘不能判定\n17. 結果と中間値のログ出力\n\n具体的な判定順のうち、数式へ依存する部分はバランス仕様で定義する。ただし処理段階そのものは本書の構造を基準とする。\n\n## 7. ダメージ計算インターフェース\n\n### 入力\n\n- 使用者の攻撃系能力\n- スキル基礎効果\n- スキル種別・属性・タグ\n- 対象の防御系能力\n- 使用者・対象の状態、BUFF、DEBUFF、スタック\n- 装備、MOD、パッシブ\n- 戦闘環境タグ\n- 命中、回避、無効、クリティカルに必要な入力\n- Seed\n\n### 出力\n\n- 成立・不成立\n- 最終ダメージ\n- 命中、回避、無効等の判定結果\n- クリティカル等の判定フラグ\n- HP変化\n- 発生した状態・スタック変化\n- 派生ルール\n- 中間計算ログ\n- 失敗理由\n\n## 8. 回復計算インターフェース\n\n回復はダメージと同じ共通パイプラインを使用し、以下を追加考慮する。\n\n- 回復能力\n- 対象の被回復補正\n- 回復阻害\n- 回復禁止\n- 最大HP超過の扱い\n- オーバーヒールの利用可否\n- 回復に反応するタグ・パッシブ\n\n回復式、回復上限、オーバーヒール仕様はバランスまたは詳細仕様で決定する。\n\n## 9. 状態付与インターフェース\n\n### 入力\n\n- 状態ID\n- 付与者\n- 対象\n- 基礎成功情報\n- 付与側補正\n- 対象側耐性\n- タグ相互作用\n- 付与強度\n- 持続定義\n- スタック定義\n- Seed\n\n### 処理\n\n1. 状態の存在確認\n2. 対象適格性確認\n3. 付与禁止・無効タグ確認\n4. 成功判定\n5. 上書き・延長・独立スタック規則適用\n6. 持続・回数・強度設定\n7. 付与時タグルール発火\n8. ログ出力\n\n成功率、耐性式、持続値、最大スタックはバランス調整項目とする。\n\n## 10. スタック操作インターフェース\n\nスタック操作は、状態付与と分離した汎用処理として扱う。\n\n### 操作種別\n\n- 生成\n- 加算\n- 減算\n- 消費\n- 移動\n- 複製\n- 消滅\n\n### 必須情報\n\n- スタックID\n- 所有者\n- 発生源\n- 親タグ\n- 変化量\n- 現在数\n- 最大数\n- 消費条件\n- 消滅条件\n\n最大数や効果量はバランス調整項目とする。\n\n## 11. 派生ルールと反応処理\n\n効果確定後、共通タグルールにより派生処理を発火できる。\n\n例:\n\n- 与ダメージ時\n- 被ダメージ時\n- 回復時\n- 状態付与時\n- クリティカル時\n- 戦闘不能時\n- スタック到達時\n\n派生処理は元の計算要求と別の処理IDを持ち、循環参照と無限発火を検出できる構造にする。\n\n発火回数上限や優先順位は詳細安全仕様で定義する。\n\n## 12. 共通出力\n\n計算結果は少なくとも以下を返す。\n\n- 処理ID\n- 親処理ID\n- 成立・不成立\n- 失敗理由\n- 使用者ID\n- 行動ID\n- 基準対象ID\n- 最終対象ID\n- 効果種別\n- 最終効果量\n- HP・MP・ゲージ変化\n- 状態変化\n- スタック変化\n- コスト消費\n- クールダウン変化\n- 判定フラグ\n- 派生処理一覧\n- ルール版\n- Seed\n- 検証ログ\n\n## 13. ログと検証\n\n通常ログと詳細検証ログを分離する。\n\n### 通常戦闘ログ\n\n- Tick\n- 使用者\n- 行動\n- 対象\n- 結果\n- HP・MP変化\n- 状態・スタック変化\n\n### 詳細検証ログ\n\n- 入力スナップショット\n- 適用したルールID\n- 各段階の入力値・中間値・出力値\n- 使用した乱数\n- 除外された対象と理由\n- 無効化・軽減・上限処理\n- 派生処理\n- ルール版・データ版\n\n## 14. 決定性\n\n- 乱数は明示的なSeedから生成する。\n- 計算処理内で暗黙の乱数を使用しない。\n- 対象順、タグ評価順、派生処理順を決定可能にする。\n- 同一入力、同一Seed、同一ルール版で同じ結果を再現する。\n- GameとStudioの結果差異を自動テストで検出する。\n\n## 15. エラー処理\n\n以下を明示的な失敗として返す。\n\n- 使用者不在\n- 行動定義不在\n- 対象不在\n- 対象不適格\n- コスト不足\n- クールダウン中\n- 状態による使用禁止\n- RANGE解決不能\n- タグルール不正\n- 循環発火\n- データ版不一致\n- ルール版不一致\n\nエラー時に無条件の通常攻撃等へ置換しない。AIの場合は、再思考可能な失敗か、AIロックへ移行すべき失敗かを区別して返す。\n\n## 16. 他システムとの境界\n\n### AI\n\nAIは行動と基準対象を予約する。効果量、命中、ダメージ等を決定しない。\n\n### Studio\n\nStudioは入力データ、Seed、ルール版を指定し、計算結果と中間ログを検証する。\n\n### Game\n\nGameは正式データを使用して同じ計算基盤を実行し、結果を戦闘状態へ反映する。\n\n### UI\n\nUIは予約、結果、ログを表示する。計算処理を持たない。\n\n### バランスデータ\n\n数式、係数、閾値、上限、下限、確率、丸め、分散を提供する。\n\n## 17. 正式保留事項\n\n以下は本書では確定せず、バランス調整または詳細安全仕様で決定する。\n\n- ダメージ式\n- 回復式\n- 命中式\n- 回避式\n- 無効判定式\n- クリティカル式\n- 防御・軽減式\n- 属性相性値\n- タグ補正値\n- 乱数分散幅\n- 丸め方式\n- 最小ダメージ\n- 最大ダメージ\n- 回復上限\n- オーバーヒール\n- 状態成功率\n- 状態耐性式\n- 状態持続値\n- 最大スタック\n- MPコスト\n- クールダウン値\n- RANGE倍率\n- 派生発火上限\n- 同順位処理の具体規則\n\n## 18. 採用判断\n\n本ドラフトで正式採用を求めるのは、以下の構造部分である。\n\n- 入力と出力\n- 事前検証\n- コスト・クールダウンの境界\n- 対象確定とRANGEの責務分離\n- 共通効果解決パイプライン\n- ダメージ、回復、状態、スタックのインターフェース\n- タグ派生処理\n- ログと決定性\n- AI、Studio、Game、UIとの境界\n- 数値仕様を別管理する方針\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0059","title":"[BATTLE] 02_バランス調整項目一覧","status":"Review","summary":"V9ライブラリ v2.0基準文書。戦闘・AI / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 03_戦闘_AI/V9_戦闘計算インターフェース仕様_正式版_v1.0/02_バランス調整項目一覧.md\nsha256: 946d73f8f1eefb6810ee3286259204e298b610d63b65e650cee269774e394239\nbytes: 978\narea: BATTLE / 戦闘・AI\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# 正式採用\n\n# 戦闘計算 バランス調整項目一覧\n\nこの文書の項目は、戦闘計算インターフェース仕様の構造とは分離して管理する。\n\n## ダメージ・回復\n- ダメージ式\n- 回復式\n- 攻撃・防御の換算係数\n- 加算・乗算補正\n- 最小値・最大値\n- 丸め\n- 分散幅\n- オーバーヒール\n\n## 判定\n- 命中\n- 回避\n- 無効\n- クリティカル\n- 属性相性\n- 状態付与成功率\n- 状態耐性\n\n## リソース\n- MPコスト\n- クールダウン値\n- クールダウン減少単位\n- ゲージ操作量\n\n## RANGE\n- 各RANGE倍率\n- 対象数補正\n- 範囲による効果減衰\n\n## 状態・スタック\n- 持続時間・回数\n- 強度\n- 最大スタック\n- 上書き・延長時の数値\n- DOT・HOT値\n\n## 安全制御\n- 派生発火上限\n- 循環検出上限\n- 同順位時の具体的優先規則\n\nこれらは「欠損」ではなく、正式なバランス調整対象として保留する。\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0060","title":"[BATTLE] 03_正式採用・修正判断チェックリスト","status":"Review","summary":"V9ライブラリ v2.0基準文書。戦闘・AI / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 03_戦闘_AI/V9_戦闘計算インターフェース仕様_正式版_v1.0/03_正式採用・修正判断チェックリスト.md\nsha256: 4ce12315246c1224cadb997baecc1a2d2a1c504cfcd996a4ea043fb7379426d0\nbytes: 1035\narea: BATTLE / 戦闘・AI\nlibrary_status: ライブラリ収録\n\n【Original Content】\n# 正式採用・修正判断チェックリスト\n\n各項目を「採用」「修正」「保留」で判定してください。\n\n1. 戦闘計算をAI・UI・Studioから独立した共通基盤にする。\n2. GameとStudioで同じ計算処理を使う。\n3. 数値式・係数をバランスデータへ分離する。\n4. 実行直前の再検証後にコスト消費・クールダウン開始を行う。\n5. 基準対象選択とRANGEによる最終対象生成を分離する。\n6. 効果解決を段階化し、中間値をログ出力できるようにする。\n7. ダメージ、回復、状態、スタックを共通インターフェースで扱う。\n8. タグによる派生・反応処理を独立した処理IDで記録する。\n9. 同一Seed・同一ルール版で結果を再現可能にする。\n10. 不成立時に勝手な代替行動を行わず、明示的失敗を返す。\n11. AIは行動・対象を決め、効果量計算には関与しない。\n12. 数値項目は本仕様では正式保留とする。\n","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"","approved_at":"","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0061","title":"[BATTLE] 04_機械可読仕様","status":"Approved","summary":"V9ライブラリ v2.0基準文書。戦闘・AI / ライブラリ収録。原文を変更せず取り込み。","body":"【V9 v2.0 Baseline Source】\npath: 03_戦闘_AI/V9_戦闘計算インターフェース仕様_正式版_v1.0/04_機械可読仕様.json\nsha256: 38eb13a82c227ff05ff944b8ed8960b3fa00bc5f0f3b484b8fdec22da7f4f604\nbytes: 816\narea: BATTLE / 戦闘・AI\nlibrary_status: ライブラリ収録\n\n【Original Content】\n{\n  \"document\": \"V9 battle calculation interface formal draft\",\n  \"version\": \"draft-1\",\n  \"status\": \"PENDING_APPROVAL\",\n  \"scope\": \"structure_only\",\n  \"balance_values\": \"SEPARATE_DOCUMENT\",\n  \"pipeline\": [\n    \"pre_validation\",\n    \"cost_and_cooldown_commit\",\n    \"target_resolution\",\n    \"base_effect\",\n    \"source_modifiers\",\n    \"action_modifiers\",\n    \"target_modifiers\",\n    \"environment_modifiers\",\n    \"interaction\",\n    \"hit_resolution\",\n    \"critical_resolution\",\n    \"variance\",\n    \"rounding\",\n    \"limits\",\n    \"state_application\",\n    \"derived_rules\",\n    \"incapacitation\",\n    \"logging\"\n  ],\n  \"interfaces\": [\n    \"damage\",\n    \"heal\",\n    \"status\",\n    \"stack\"\n  ],\n  \"external_boundaries\": [\n    \"ai\",\n    \"studio\",\n    \"game\",\n    \"ui\",\n    \"balance_data\"\n  ],\n  \"numeric_balance_unresolved\": true\n}","decision_refs":["DEC-V9-0001"],"depends_on":[],"acceptance_criteria":"V9 v2.0原文・出典path・SHA-256を保持し、後発資料との比較時に基準として参照できる。","approved_by":"V9 Library","approved_at":"2026-08-19T09:15:00+09:00","created_at":"2026-08-19T09:15:00+09:00","updated_at":"2026-08-19T09:15:00+09:00"},{"id":"SPEC-V9-0062","
