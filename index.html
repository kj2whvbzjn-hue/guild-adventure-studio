<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>GK Studio を起動しています</title>
  <style>
    html,body{height:100%;margin:0;background:#0b1018;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
    body{display:grid;place-items:center;text-align:center}
    main{padding:24px}
    a{color:#8ab4ff}
  </style>
  <script>
    (() => {
      const destination = new URL('./studio/', window.location.href);
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    })();
  </script>
</head>
<body>
  <main>
    <p>GK Studio を起動しています。</p>
    <p><a href="./studio/">自動的に移動しない場合はこちら</a></p>
  </main>
</body>
</html>
