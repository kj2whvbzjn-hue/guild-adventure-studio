<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>ギルド冒険物語 正式版基盤 V0.1</title>
<style>
:root{--bg:#0e1726;--panel:#1a2940;--line:#38506f;--text:#f4f7fb;--muted:#aebcd0;--accent:#f6b93b;--good:#67d59a;--bad:#ff7c87}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.top{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#122036;border-bottom:1px solid var(--line)}button,select,input{font:inherit}.brand{font-size:20px;font-weight:800}.small{color:var(--muted);font-size:13px}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.stat{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.stat b{font-size:22px;display:block}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:#263a58;color:var(--text);font-weight:700}.btn.primary{background:var(--accent);color:#211a08;border-color:var(--accent)}.btn.danger{color:#ffd4d8}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{display:grid;gap:6px;min-width:180px;flex:1}.field input,.field select{padding:12px;border-radius:10px;border:1px solid var(--line);background:#101c2e;color:var(--text)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:left}.badge{display:inline-block;border-radius:999px;padding:4px 9px;background:#243b5b;color:var(--muted)}.ok{color:var(--good)}.warn{color:var(--accent)}.history{max-height:220px;overflow:auto}.history div{padding:8px;border-bottom:1px solid var(--line)}pre{white-space:pre-wrap;word-break:break-word;background:#0b1320;padding:12px;border-radius:12px;max-height:260px;overflow:auto}@media(max-width:680px){.stats{grid-template-columns:repeat(4,1fr)}.wrap{padding:10px}.top{align-items:flex-start}.top .actions{justify-content:flex-end}.btn{padding:10px 12px}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">ギルド冒険物語</div><div class="small">V9正式版 基礎実装 V0.1</div></div><div class="actions"><button class="btn" onclick="location.href='../'">MVPへ戻る</button><button class="btn" onclick="location.href='../studio/'">Studio</button></div></header>
<main class="wrap">
<section class="card"><h1>正式キャラクター基盤</h1><p class="small">7能力値・7基本職・レベル上限50・適性値7～13・転職維持・正式セーブVersion 1を検証します。</p><div id="status" class="badge">準備中</div></section>
<section class="card"><h2>キャラクター</h2><div class="row"><label class="field">名前<input id="nameInput" maxlength="20" value="正式版冒険者"></label><label class="field">現在職<select id="jobSelect"></select></label></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="createBtn">新規作成</button><button class="btn" id="levelBtn">1レベル上げる</button><button class="btn" id="tenLevelBtn">10回成長</button><button class="btn" id="saveBtn">保存</button><button class="btn danger" id="resetBtn">正式版セーブ削除</button></div></section>
<section class="card" id="characterCard"><div class="row" style="justify-content:space-between"><div><h2 id="charName">未作成</h2><div id="charMeta" class="small"></div></div><div><span class="badge" id="saveVersion">Save V1</span></div></div><h3>能力値</h3><div id="stats" class="stats"></div><h3>職業適性</h3><div id="aptitudes" class="stats"></div></section>
<section class="card"><h2>転職</h2><p class="small">転職しても現在レベル・能力値・習得スキルを維持し、次のレベルアップから成長率だけ変更します。</p><div class="row"><label class="field">転職先<select id="changeJobSelect"></select></label><button class="btn primary" id="changeJobBtn">転職する</button></div><div id="transferCheck" class="small" style="margin-top:10px"></div></section>
<section class="card"><h2>7基本職と成長率</h2><div style="overflow:auto"><table><thead><tr><th>職業</th><th>STR</th><th>VIT</th><th>AGI</th><th>DEX</th><th>INT</th><th>MND</th><th>LUK</th></tr></thead><tbody id="jobTable"></tbody></table></div></section>
<section class="card"><h2>転職・成長履歴</h2><div id="history" class="history"></div></section>
<section class="card"><h2>正式セーブデータ確認</h2><div class="actions"><button class="btn" id="exportBtn">JSON出力</button><button class="btn" id="validateBtn">整合性検証</button></div><pre id="jsonView"></pre></section>
</main>
<script>
'use strict';
const SAVE_KEY='guild_adventure_formal_save_v1';
const STAT_KEYS=['STR','VIT','AGI','DEX','INT','MND','LUK'];
const MAX_LEVEL=50;
const JOBS={
  swordsman:{name:'剣士',growth:{STR:72,VIT:58,AGI:55,DEX:58,INT:18,MND:28,LUK:36}},
  knight:{name:'騎士',growth:{STR:55,VIT:78,AGI:28,DEX:42,INT:16,MND:48,LUK:25}},
  thief:{name:'盗賊',growth:{STR:42,VIT:35,AGI:78,DEX:72,INT:22,MND:25,LUK:65}},
  archer:{name:'弓兵',growth:{STR:48,VIT:38,AGI:62,DEX:80,INT:20,MND:30,LUK:45}},
  mage:{name:'魔術師',growth:{STR:15,VIT:28,AGI:42,DEX:48,INT:82,MND:62,LUK:32}},
  priest:{name:'神官',growth:{STR:22,VIT:46,AGI:35,DEX:42,INT:58,MND:84,LUK:38}},
  adventurer:{name:'冒険家',growth:{STR:50,VIT:50,AGI:50,DEX:50,INT:50,MND:50,LUK:50}}
};
let state=null;
function now(){return new Date().toISOString()}
function seedFromName(name){let h=2166136261;for(const c of name){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rngFactory(seed){let x=seed||123456789;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}}
function makeAptitudes(name){const r=rngFactory(seedFromName(name));const out={};STAT_KEYS.forEach(k=>out[k]=7+Math.floor(r()*7));return out}
function makeCharacter(name,jobId){return {id:'CHR-FORMAL-0001',name:name||'正式版冒険者',level:1,max_level:MAX_LEVEL,current_job_id:jobId,stats:Object.fromEntries(STAT_KEYS.map(k=>[k,10])),aptitudes:makeAptitudes(name),learned_skills:[],job_history:[{job_id:jobId,from_level:1,at:now()}],growth_history:[],created_at:now(),updated_at:now()}}
function makeSave(char){return {save_schema:'guild-adventure-formal-save',save_version:1,specification:'V9',created_at:now(),updated_at:now(),character:char}}
function rollGrowth(char){if(char.level>=MAX_LEVEL)return {ok:false,message:'レベル上限50です'};const job=JOBS[char.current_job_id];const seed=seedFromName(char.name+'|'+char.level+'|'+char.current_job_id+'|'+char.growth_history.length);const r=rngFactory(seed);const gained={};STAT_KEYS.forEach(k=>{const aptitudeRate=char.aptitudes[k]*10;const chance=Math.min(100,Math.round(job.growth[k]*aptitudeRate/100));gained[k]=r()*100<chance?1:0;char.stats[k]+=gained[k]});char.level++;char.growth_history.push({level:char.level,job_id:char.current_job_id,gained,at:now()});char.updated_at=now();return {ok:true,message:`Lv.${char.level}になりました`}}
function validate(s){const errors=[];if(!s||s.save_version!==1)errors.push('save_versionが1ではありません');const c=s&&s.character;if(!c)errors.push('characterがありません');else{if(c.level<1||c.level>50)errors.push('レベル範囲外');if(!JOBS[c.current_job_id])errors.push('不明な職業');STAT_KEYS.forEach(k=>{if(!Number.isInteger(c.stats[k])||c.stats[k]<10)errors.push(`${k}が不正`);if(!Number.isInteger(c.aptitudes[k])||c.aptitudes[k]<7||c.aptitudes[k]>13)errors.push(`${k}適性が範囲外`)})}return errors}
function save(){if(!state)return;state.updated_at=now();localStorage.setItem(SAVE_KEY,JSON.stringify(state));render('保存しました')}
function load(){try{const x=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(x&&validate(x).length===0)state=x}catch(e){}if(!state)state=makeSave(makeCharacter('正式版冒険者','swordsman'));render('正式版セーブを読み込みました')}
function render(message=''){const c=state.character;document.getElementById('charName').textContent=c.name;document.getElementById('charMeta').textContent=`Lv.${c.level} / ${JOBS[c.current_job_id].name} / 習得スキル ${c.learned_skills.length} / 転職 ${Math.max(0,c.job_history.length-1)}回`;document.getElementById('stats').innerHTML=STAT_KEYS.map(k=>`<div class="stat"><span>${k}</span><b>${c.stats[k]}</b></div>`).join('');document.getElementById('aptitudes').innerHTML=STAT_KEYS.map(k=>`<div class="stat"><span>${k}</span><b>${c.aptitudes[k]}</b><small>(${c.aptitudes[k]*10}%)</small></div>`).join('');document.getElementById('history').innerHTML=[...c.job_history.map(x=>`<div>転職：${JOBS[x.job_id].name}（Lv.${x.from_level}）</div>`),...c.growth_history.slice(-12).reverse().map(x=>`<div>Lv.${x.level} ${JOBS[x.job_id].name}：${STAT_KEYS.filter(k=>x.gained[k]).join(' / ')||'能力上昇なし'}</div>`)].join('')||'<div>履歴なし</div>';document.getElementById('jsonView').textContent=JSON.stringify(state,null,2);const errs=validate(state);document.getElementById('status').textContent=message|| (errs.length?'要修正':'V9基礎モデル正常');document.getElementById('status').className='badge '+(errs.length?'warn':'ok')}
function fillJobs(){const opts=Object.entries(JOBS).map(([id,j])=>`<option value="${id}">${j.name}</option>`).join('');document.getElementById('jobSelect').innerHTML=opts;document.getElementById('changeJobSelect').innerHTML=opts;document.getElementById('jobTable').innerHTML=Object.entries(JOBS).map(([id,j])=>`<tr><td>${j.name}</td>${STAT_KEYS.map(k=>`<td>${j.growth[k]}%</td>`).join('')}</tr>`).join('')}
fillJobs();load();
document.getElementById('createBtn').onclick=()=>{state=makeSave(makeCharacter(document.getElementById('nameInput').value.trim()||'正式版冒険者',document.getElementById('jobSelect').value));save()};
document.getElementById('levelBtn').onclick=()=>{const r=rollGrowth(state.character);render(r.message);save()};
document.getElementById('tenLevelBtn').onclick=()=>{for(let i=0;i<10;i++){if(!rollGrowth(state.character).ok)break}save()};
document.getElementById('saveBtn').onclick=save;
document.getElementById('resetBtn').onclick=()=>{if(confirm('正式版V0.1のセーブだけ削除しますか？')){localStorage.removeItem(SAVE_KEY);state=makeSave(makeCharacter('正式版冒険者','swordsman'));render('正式版セーブを初期化しました')}};
document.getElementById('changeJobBtn').onclick=()=>{const c=state.character,next=document.getElementById('changeJobSelect').value;if(next===c.current_job_id){render('現在と同じ職業です');return}const before={level:c.level,stats:JSON.stringify(c.stats),skills:JSON.stringify(c.learned_skills)};c.current_job_id=next;c.job_history.push({job_id:next,from_level:c.level,at:now()});c.updated_at=now();const preserved=before.level===c.level&&before.stats===JSON.stringify(c.stats)&&before.skills===JSON.stringify(c.learned_skills);document.getElementById('transferCheck').textContent=preserved?'維持確認：レベル・能力値・習得スキルは変化していません。':'維持確認に失敗しました。';save()};
document.getElementById('validateBtn').onclick=()=>{const e=validate(state);alert(e.length?e.join('\n'):'整合性検証に合格しました')};
document.getElementById('exportBtn').onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='guild-adventure-formal-save-v1.json';a.click();URL.revokeObjectURL(a.href)};
</script>
</body></html>
